# Dependency policy: source, license and duplicate changes require review.
[graph]
all-features = true

[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]

[licenses]
confidence-threshold = 0.93
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause", "BSD-3-Clause", "ISC", "MPL-2.0",
  "Unicode-3.0", "Zlib", "CC0-1.0", "0BSD",
]

# The private application is not assigned a license by a dependency audit.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
deny = [
  { crate = "openssl-src", reason = "Native TLS must use the separately checksum-pinned and version-checked OpenSSL build." },
]
# Exact reviewed versions only; a new version still reaches duplicate detection.
# security/dependency-budget.json also rejects increases or replacement groups.
skip = [
  { crate = "pem@=3.0.6", reason = "rtc/rtc-dtls 0.21 require pem 3; their current rcgen 0.14.10 requires pem 4. Exact optional load-test split reviewed 2026-10-05." },
  { crate = "synstructure@=0.13.2", reason = "asn1-rs-derive 0.5.1 requires 0.13; current ICU derive macros require 0.14. Exact build-time split reviewed 2026-10-05." },
  { crate = "asn1-rs@=0.6.2", reason = "Reviewed transitive version split; exact graph is bounded by security/dependency-budget.json." },
  { crate = "asn1-rs-derive@=0.5.1", reason = "Reviewed transitive version split; exact graph is bounded by security/dependency-budget.json." },
