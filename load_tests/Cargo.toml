[package]
name = "simplestchat-load-test"
description = "Synthetic WebRTC load generator for the simplestChat server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "load_test"
path = "src/main.rs"

[dependencies]
simplestchat = { path = ".." }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = "0.23.1"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
hex = "0.4.3"
mediasoup = "0.29.0"
mediasoup-types = "0.6.0"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rtc = "0.21.0"
rustix = { version = "1.1.5", default-features = false, features = ["std", "process"] }
ryu-js = "=1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11.0"
tar = { version = "=0.4.46", default-features = false }
tokio = { version = "1.53.2", features = ["full"] }
tokio-tungstenite = "0.30.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
url = "2.5.8"
uuid = { version = "1.27.0", features = ["v4"] }
webrtc = "0.21.0"
