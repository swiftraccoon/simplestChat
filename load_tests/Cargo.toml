[package]
name = "simplestchat-load-test"
description = "Synthetic WebRTC load generator for the simplestChat server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "load_test"
path = "src/main.rs"
required-features = ["full"]

[features]
default = ["full"]
capacity-runtime = []
full = [
    "capacity-runtime",
    "dep:simplestchat",
    "dep:base64",
    "dep:bytes",
    "dep:futures-util",
    "dep:mediasoup",
    "dep:mediasoup-types",
    "dep:regex",
    "dep:reqwest",
    "dep:rtc",
    "dep:tokio-tungstenite",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:url",
    "dep:webrtc",
    "tokio/full",
    "rustix/net",
]

[dependencies]
simplestchat = { path = "..", optional = true }
anyhow = "1.0.104"
async-trait = "0.1.92"
base64 = { version = "0.23.1", optional = true }
bytes = { version = "1.12.1", optional = true }
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = { version = "0.3.34", optional = true }
hex = "0.4.3"
mediasoup = { version = "0.29.0", optional = true }
mediasoup-types = { version = "0.8.0", optional = true }
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
rand = "0.10.3"
regex = { version = "1.13.1", optional = true }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"], optional = true }
rtc = { version = "0.21.0", optional = true }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }
ryu-js = "=1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = "0.11.0"
tar = { version = "=0.4.46", default-features = false }
tokio = { version = "1.53.2", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", optional = true }
tracing = { version = "0.1.44", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"], optional = true }
url = { version = "2.5.8", optional = true }
uuid = { version = "1.27.0", features = ["v4"] }
webrtc = { version = "0.21.0", optional = true }
