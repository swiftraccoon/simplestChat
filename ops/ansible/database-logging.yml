---
- name: Disable public PostgreSQL parameter logging without a database restart
  hosts: benchmark_hosts
  become: true
  gather_facts: false
  serial: 1
  pre_tasks:
    - name: Require the canonical prepared public host
      ansible.builtin.assert:
        that:
          - scpub_enabled | bool
          - scpub_config == '/etc/simplestchat-public'
          - scpub_root == '/srv/simplestchat-public'
        fail_msg: Use the prepared public host with its canonical configuration paths.

    - name: Look for the installed Ops executable without following links
      ansible.builtin.stat:
        path: /usr/local/libexec/simplestchat-public/simplestchat-ops
        follow: false
        get_checksum: false
      register: scpub_logging_ops

    - name: Require the Ops executable a signed release delivers
      ansible.builtin.assert:
        that:
          - scpub_logging_ops.stat.exists
          - scpub_logging_ops.stat.isreg
          - scpub_logging_ops.stat.uid == 0
          - scpub_logging_ops.stat.mode == '0755'
        fail_msg: >-
          Deliver the signed Ops executable first: run release.yml for a signed
          revision (staging alone is enough), then repeat this playbook.

  tasks:
    - name: Apply and verify the two PostgreSQL logging limits under the workload lock
      ansible.builtin.command:
        argv: [/usr/local/libexec/simplestchat-public/simplestchat-ops, database, logging, disable]
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      register: scpub_logging_result
      changed_when: >-
        scpub_logging_result.rc == 0 and
        (scpub_logging_result.stdout | from_json).changed | bool
      when: not ansible_check_mode
