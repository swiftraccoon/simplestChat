---
- name: Prepare a private simplestChat benchmark host
  hosts: benchmark_hosts
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require the supported host and bounded installation paths
      tags: [always]
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - ansible_facts.service_mgr == 'systemd'
          - scbench_revision is defined
          - scbench_revision is match('^[a-f0-9]{40}$')
          - scbench_root == '/srv/simplestchat-bench'
          - scbench_release_dir == scbench_root + '/sources/' + scbench_revision
          - scbench_repository is match('^https://github.com/[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+\.git$')
        fail_msg: Use Debian 13 x86_64 with systemd and an exact reviewed source commit.

    - name: Inspect the owned benchmark service before changing build inputs
      tags: [always]
      ansible.builtin.command:
        argv: [systemctl, is-active, simplestchat-benchmark.service]
      register: scbench_active
      changed_when: false
      failed_when: scbench_active.rc not in [0, 3, 4]
      check_mode: false

    - name: Refuse provisioning during an active benchmark
      tags: [always]
      ansible.builtin.assert:
        that:
          - scbench_active.stdout not in ['active', 'activating', 'deactivating', 'reloading']
        fail_msg: Wait for the owned benchmark to finish before changing its host or inputs.

    - name: Inspect the owned image builder before changing its host
      tags: [always]
      ansible.builtin.command:
        argv: [systemctl, is-active, simplestchat-image-build.service]
      register: scbench_builder_active
      changed_when: false
      failed_when: scbench_builder_active.rc not in [0, 3, 4]
      check_mode: false

    - name: Refuse provisioning during an active image build
      tags: [always]
      ansible.builtin.assert:
        that:
          - scbench_builder_active.stdout not in ['active', 'activating', 'deactivating', 'reloading']
        fail_msg: Wait for the owned image build before changing its inputs.

    - name: Look for an owned container cleanup record without following links
      tags: [always]
      ansible.builtin.stat:
        path: /run/simplestchat-bench/current.json
        follow: false
        get_checksum: false
        get_mime: false
      register: scbench_cleanup_record

    - name: Look at the cleanup record's directory without following links
      tags: [always]
      ansible.builtin.stat:
        path: /run/simplestchat-bench
        follow: false
        get_checksum: false
        get_mime: false
      register: scbench_cleanup_directory
      when: scbench_cleanup_record.stat.exists

    - name: Require a cleanup record to be a small private file in its private directory
      tags: [always]
      ansible.builtin.assert:
        that:
          - scbench_cleanup_record.stat.isreg
          - scbench_cleanup_record.stat.uid == 0
          - scbench_cleanup_record.stat.mode == '0600'
          - scbench_cleanup_record.stat.size <= 16384
          - scbench_cleanup_directory.stat.isdir
          - scbench_cleanup_directory.stat.uid == 0
          - scbench_cleanup_directory.stat.mode == '0700'
        fail_msg: Operational precondition failed
      when: scbench_cleanup_record.stat.exists

    - name: Read the owned container cleanup record
      tags: [always]
      ansible.builtin.slurp:
        src: /run/simplestchat-bench/current.json
      register: scbench_cleanup_content
      when: scbench_cleanup_record.stat.exists

    - name: Refuse provisioning while container cleanup remains uncertain
      tags: [always]
      vars:
        scbench_cleanup: "{{ scbench_cleanup_content.content | b64decode | from_json }}"
      ansible.builtin.assert:
        that:
          - scbench_cleanup is mapping
          - scbench_cleanup.get('schemaVersion') == 1
          - scbench_cleanup.get('finalized') is sameas true
        fail_msg: Finish owned container cleanup first
        success_msg: No unfinished owned container cleanup.
      when: scbench_cleanup_record.stat.exists

    - name: Refuse provisioning while a public release remains unfinished
      tags: [always]
      ansible.builtin.command:
        argv:
          - /bin/sh
          - -eu
          - -c
          - |
            root=/srv/simplestchat-public
            record=$root/release-state.json
            if [ -e "$record" ] || [ -L "$record" ]; then
              refuse() {
                echo 'Operational precondition failed' >&2
                exit 1
              }
              [ -n "$(find "$record" -prune -type f -user 0 -perm 600)" ] || refuse
              size=$(($(wc -c <"$record")))
              [ "$size" -gt 0 ] || refuse
              [ "$size" -le 16384 ] || refuse
              [ -n "$(find "$root" -prune -type d -user 0 -perm 700)" ] || refuse
              jq -e 'type == "object" and (.schemaVersion | tojson | test("^-?[0-9]+$"))' \
                "$record" >/dev/null 2>&1 || refuse
              jq -e '.schemaVersion == 1 and .finalized == true' "$record" >/dev/null || {
                echo 'Inspect and recover the unfinished public release first' >&2
                exit 1
              }
            fi
            echo 'No unfinished public release.'
      changed_when: false
      check_mode: false

    - name: Look for the local Docker socket
      tags: [always]
      ansible.builtin.stat:
        path: /var/run/docker.sock
        follow: true
        get_checksum: false
        get_mime: false
      register: scbench_docker_socket

    - name: List the running containers of the public project
      tags: [always]
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - --host
          - unix:///var/run/docker.sock
          - ps
          - --quiet
          - --filter
          - label=com.docker.compose.project=simplestchat-public
      register: scbench_public_running
      changed_when: false
      check_mode: false
      timeout: 15
      when: scbench_docker_socket.stat.exists

    - name: Refuse host maintenance while the public application is running
      tags: [always]
      ansible.builtin.assert:
        that:
          - scbench_public_running.stdout | trim == ''
        fail_msg: Stop the public project before host maintenance
        success_msg: No running public project would be interrupted by host maintenance.
      when: scbench_docker_socket.stat.exists

  tasks:
    - name: Prepare OS packages and private directories
      ansible.builtin.import_tasks: tasks/host.yml
      tags: [host]

    - name: Install the pinned container runtime
      ansible.builtin.import_tasks: tasks/docker.yml
      tags: [docker]

    - name: Obtain the exact application source
      ansible.builtin.import_tasks: tasks/source.yml
      tags: [source]

    - name: Install opt-in image build and private benchmark services
      ansible.builtin.import_tasks: tasks/benchmark.yml
      tags: [benchmark]

  handlers:
    - name: Reload systemd units
      ansible.builtin.systemd_service:
        daemon_reload: true
