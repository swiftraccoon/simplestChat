---
# Follow Docker's signed Debian repository installation, never a convenience
# script. Existing runtimes and daemon policy require review, not replacement.
# https://docs.docker.com/engine/install/debian/
- name: Read the installed package inventory before changing the runtime
  ansible.builtin.command:
    argv:
      - /usr/bin/dpkg-query
      - --show
      - '--showformat=${db:Status-Status}'
      - "{{ item }}"
  loop: [docker.io, docker-compose, docker-doc, docker-buildx, podman-docker, containerd, runc]
  register: scbench_conflicting_packages
  changed_when: false
  failed_when: scbench_conflicting_packages.rc not in [0, 1]
  check_mode: false
  tags: [always]

- name: Refuse conflicting distribution container packages
  ansible.builtin.assert:
    that:
      - item.stdout | trim != 'installed'
    fail_msg: "Existing {{ item.item }} requires an explicit migration; provisioning will not remove it."
  loop: "{{ scbench_conflicting_packages.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [always]

- name: Inspect existing Docker daemon configuration without following links
  ansible.builtin.stat:
    path: /etc/docker/daemon.json
    follow: false
    get_checksum: false
    get_mime: false
  register: scbench_docker_daemon_file
  tags: [always]

- name: Require existing daemon configuration to be an ordinary protected file
  ansible.builtin.assert:
    that:
      - not scbench_docker_daemon_file.stat.exists or scbench_docker_daemon_file.stat.isreg
      - not scbench_docker_daemon_file.stat.exists or scbench_docker_daemon_file.stat.uid == 0
      - not scbench_docker_daemon_file.stat.exists or scbench_docker_daemon_file.stat.size <= 65536
      - not scbench_docker_daemon_file.stat.exists or scbench_docker_daemon_file.stat.mode in ['0600', '0640', '0644']
    fail_msg: Existing Docker daemon configuration needs review and will not be overwritten.
  tags: [always]

- name: Read existing daemon configuration without modifying it
  ansible.builtin.slurp:
    src: /etc/docker/daemon.json
  register: scbench_docker_daemon_content
  when: scbench_docker_daemon_file.stat.exists
  no_log: true
  tags: [always]

- name: Keep daemon host bindings under the packaged Unix-socket service
  ansible.builtin.assert:
    that:
      - (scbench_docker_daemon_content.content | b64decode | from_json) is mapping
      - "'hosts' not in (scbench_docker_daemon_content.content | b64decode | from_json)"
    fail_msg: An existing Docker hosts override requires review; remote API listeners are not configured here.
  when: scbench_docker_daemon_file.stat.exists
  no_log: true
  tags: [always]

- name: Read the existing Docker service and socket definitions
  ansible.builtin.command: &scbench_docker_unit_inspection
    argv:
      - /usr/bin/systemctl
      - show
      - "{{ item }}"
      - --property=LoadState
      - --property=FragmentPath
      - --property=DropInPaths
      - --property=ExecStart
      - --property=Listen
  loop: [docker.service, docker.socket]
  register: scbench_docker_units
  changed_when: false
  failed_when: false
  check_mode: false
  timeout: 15
  tags: [always]

# An absent unit is accepted. A present one must be loaded from its packaged
# file without drop-ins. The service must print one command, the packaged
# daemon command, whose only host option is its `-H fd://`; every listener line
# of the socket must be the local Unix socket, whatever order systemctl prints
# them in. The first rule a unit breaks names the refusal.
- name: Verify that existing Docker service and socket definitions remain local
  ansible.builtin.assert: &scbench_docker_unit_rules
    that:
      - scbench_unit_inspectable
      - scbench_unit_packaged
      - scbench_unit_local
    fail_msg: >-
      {{ ('Cannot inspect ' ~ item.item ~ '; its current listener configuration is unknown.')
         if not scbench_unit_inspectable else
         ('Custom ' ~ item.item ~ ' configuration requires review; no changes were made.')
         if not scbench_unit_packaged else
         'Docker must use its packaged Unix-socket command without extra host options.'
         if item.item == 'docker.service' else
         'Docker socket must listen only on its local Unix socket.' }}
    success_msg: Docker service definitions have no custom API listener.
  vars: &scbench_docker_unit_facts
    scbench_unit: "{{ dict(item.stdout_lines | select('search', '=') | map('split', '=', 1)) }}"
    scbench_unit_absent: "{{ scbench_unit.get('LoadState') == 'not-found' and item.rc in [0, 1, 4] }}"
    scbench_unit_inspectable: "{{ scbench_unit_absent or (item.rc == 0 and scbench_unit.get('LoadState') == 'loaded') }}"
    scbench_unit_packaged: >-
      {{ scbench_unit_absent
         or (scbench_unit.get('FragmentPath') in ['/usr/lib/systemd/system/' ~ item.item, '/lib/systemd/system/' ~ item.item]
             and not scbench_unit.get('DropInPaths')) }}
    # Every command and listener line counts, a line without a value too. Any
    # word that can set a daemon host (`-H`, `--host`, a shorthand cluster
    # holding `H`) is collected, wherever it stands in the printed command.
    scbench_unit_commands: "{{ item.stdout_lines | select('match', 'ExecStart(=|$)') | list }}"
    scbench_unit_listeners: "{{ item.stdout_lines | select('match', 'Listen(=|$)') | list }}"
    scbench_unit_hosts: "{{ (scbench_unit_commands | join(' ')).split() | select('match', '--host($|=)|-[^-]*H') | list }}"
    scbench_unit_local: >-
      {{ scbench_unit_absent
         or ((scbench_unit_commands | length == 1
              and 'argv[]=/usr/bin/dockerd -H fd:// --containerd=/run/containerd/containerd.sock ;' in scbench_unit_commands[0]
              and scbench_unit_commands[0].count('argv[]=') == 1
              and scbench_unit_hosts == ['-H'])
             if item.item == 'docker.service' else
             (scbench_unit_listeners | length > 0
              and scbench_unit_listeners | reject('in', ['Listen=/run/docker.sock (Stream)', 'Listen=/var/run/docker.sock (Stream)']) | list == [])) }}
  loop: "{{ scbench_docker_units.results }}"
  loop_control:
    label: "{{ item.item }}"
  tags: [always]

- name: Create the root-controlled apt signing-key directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install the checksum-pinned official Docker signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    checksum: "sha256:{{ scbench_docker_gpg_sha256 }}"
    owner: root
    group: root
    mode: '0644'
    timeout: 30
    validate_certs: true

- name: Configure only the signed stable Debian Docker repository
  ansible.builtin.template:
    src: docker.sources.j2
    dest: /etc/apt/sources.list.d/docker.sources
    owner: root
    group: root
    mode: '0644'
  register: scbench_docker_repository

- name: Keep Docker maintenance updates on the reviewed inventory versions
  ansible.builtin.template:
    src: docker.preferences.j2
    dest: /etc/apt/preferences.d/simplestchat-docker
    owner: root
    group: root
    mode: '0644'

- name: Install the explicitly pinned Docker runtime and CLI plugins
  ansible.builtin.apt:
    name:
      - "docker-ce={{ scbench_docker_engine_version }}"
      - "docker-ce-cli={{ scbench_docker_cli_version }}"
      - "containerd.io={{ scbench_containerd_version }}"
      - "docker-buildx-plugin={{ scbench_docker_buildx_version }}"
      - "docker-compose-plugin={{ scbench_docker_compose_version }}"
    state: present
    update_cache: true
    cache_valid_time: "{{ 0 if scbench_docker_repository.changed else 3600 }}"
    install_recommends: false
    fail_on_autoremove: true
    allow_downgrade: false
    # Do not start a newly installed daemon until its service/socket are checked.
    policy_rc_d: 101

- name: Install authenticated upstream runtime components beyond the package channel
  ansible.builtin.import_tasks: runtime-binaries.yml

- name: Read the packaged service and socket definitions before enabling Docker
  ansible.builtin.command: *scbench_docker_unit_inspection
  loop: [docker.service, docker.socket]
  register: scbench_docker_units
  changed_when: false
  failed_when: false
  check_mode: false
  timeout: 15

- name: Verify the packaged service and socket before enabling Docker
  ansible.builtin.assert: *scbench_docker_unit_rules
  vars: *scbench_docker_unit_facts
  loop: "{{ scbench_docker_units.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Enable Docker using its local Unix socket without daemon policy overrides
  ansible.builtin.systemd_service:
    name: docker.service
    enabled: true
    state: started
    daemon_reload: true
  when: not (scbench_docker_defer_restart | default(false) | bool)

- name: Verify all selected versions through the active Docker service
  ansible.builtin.import_tasks: runtime-verify.yml
  when:
    - not ansible_check_mode
    - not (scbench_docker_defer_restart | default(false) | bool)
