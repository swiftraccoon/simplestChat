---
- name: Refresh the signed Debian package indexes
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Apply explicitly requested operating system updates
  ansible.builtin.apt:
    upgrade: dist
    fail_on_autoremove: true
  when: scbench_upgrade_packages | bool
  register: scbench_os_upgrade

- name: Reboot after an explicitly requested maintenance upgrade
  ansible.builtin.reboot:
    reboot_timeout: 300
    connect_timeout: 10
  when:
    - scbench_reboot | bool
    - scbench_os_upgrade is changed

- name: Install the host administration prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - coreutils
      - curl
      - git
      - procps
      - python3
      - sudo
      - jq
      - util-linux
    state: present
    install_recommends: false
    fail_on_autoremove: true

- name: Reserve a narrowly scoped installation root
  ansible.builtin.file:
    path: "{{ scbench_root }}"
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Create private source, artifact, and result directories
  ansible.builtin.file:
    path: "{{ scbench_root }}/{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0700'
  loop: [sources, artifacts, results]

- name: Create root-controlled configuration and launcher directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/simplestchat-bench
    - /usr/local/libexec/simplestchat-bench

# Each media worker asks for 1 MiB socket buffers on its WebRTC listener and
# the kernel silently clamps the request to these ceilings (208 KiB by
# default), at which it dropped inbound media under load. They are not
# namespaced, so the host sets them; the file survives reboots. Keep them
# modest: a much deeper buffer hides a sustained overload behind queueing
# delay (docs/performance-results.md).
- name: Raise the kernel socket buffer ceilings the media workers request
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-simplestchat-media.conf
    owner: root
    group: root
    mode: '0644'
    content: |
      net.core.rmem_max = 2097152
      net.core.wmem_max = 2097152
  register: scbench_socket_buffer_sysctl

- name: Apply the socket buffer ceilings without waiting for a reboot
  ansible.builtin.command:
    argv:
      - /usr/sbin/sysctl
      - -p
      - /etc/sysctl.d/90-simplestchat-media.conf
  when:
    - scbench_socket_buffer_sysctl is changed
    - not ansible_check_mode
  changed_when: true
