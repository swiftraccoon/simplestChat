---
- name: Deploy an explicitly authorized unsigned off-host artifact
  hosts: benchmark_hosts
  become: true
  gather_facts: false
  serial: 1
  vars:
    ansible_pipelining: true
  pre_tasks:
    - name: Require explicit force authorization and one prepared public host
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all | length == 1
          - scpub_force_release is sameas true
          - scpub_enabled | bool
          - scpub_config == '/etc/simplestchat-public'
          - scpub_root == '/srv/simplestchat-public'
          - scpub_release_revision is match('^[a-f0-9]{40}$')
          - scpub_force_directory is match('^/')
          - scpub_force_request is match('^/')
          - scpub_release_quiet_seconds | int >= 0
          - scpub_release_quiet_seconds | int <= 600
          - scpub_release_artifact_id is not defined
          - scpub_release_ci_run is not defined
        fail_msg: >-
          Use simplestchat-release deploy --force with one prepared inventory
          host and an exact local export.

    - name: Look for the installed Ops executable without following links
      ansible.builtin.stat:
        path: /usr/local/libexec/simplestchat-public/simplestchat-ops
        follow: false
        get_checksum: false
      register: scpub_force_installed

    - name: Require the Ops executable a signed release delivers
      ansible.builtin.assert:
        that:
          - scpub_force_installed.stat.exists
          - scpub_force_installed.stat.isreg
          - scpub_force_installed.stat.uid == 0
          - scpub_force_installed.stat.mode == '0755'
        fail_msg: >-
          Deliver the signed Ops executable first: run release.yml for a signed
          revision (staging alone is enough), then repeat this playbook.

    - name: Verify the prepared host through the installed Ops executable
      vars:
        ansible_python_interpreter: /usr/bin/python3
      ansible.builtin.command:
        argv:
          - /usr/local/libexec/simplestchat-public/simplestchat-ops
          - release
          - preflight
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      register: scpub_force_preflight
      changed_when: false
      timeout: 60

    - name: Require the preflight's fresh operation identity
      ansible.builtin.assert:
        that:
          - (scpub_force_preflight.stdout | from_json).schemaVersion == 1
          - (scpub_force_preflight.stdout | from_json).runId is match('^[a-f0-9]{32}$')

  tasks:
    - name: Create private storage without overwriting a retained release
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ scpub_root }}/releases"
        - "{{ scpub_root }}/forced"
        - "{{ scpub_root }}/forced/{{ (scpub_force_preflight.stdout | from_json).runId }}"

    - name: Transfer only the four exported build artifact files
      ansible.builtin.copy:
        src: "{{ scpub_force_directory }}/{{ item }}"
        dest: "{{ scpub_root }}/forced/{{ (scpub_force_preflight.stdout | from_json).runId }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
        force: false
      loop: [image.tar, release.json, source.json, outcome.json]

    - name: Retain the exact explicit unsigned authorization and file hashes
      ansible.builtin.copy:
        src: "{{ scpub_force_request }}"
        dest: "{{ scpub_root }}/forced/{{ (scpub_force_preflight.stdout | from_json).runId }}/force.json"
        owner: root
        group: root
        mode: '0600'
        force: false

    # Admission checks the transferred bytes against the request and retains
    # them; it verifies no signature and says so in its record.
    - name: Admit the unsigned artifact through the installed Ops executable
      vars:
        ansible_python_interpreter: /usr/bin/python3
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit=simplestchat-force-{{ (scpub_force_preflight.stdout | from_json).runId }}"
          - --property=Type=exec
          - --property=RuntimeMaxSec=900
          - --property=TimeoutStopSec=60
          - --wait
          - /usr/local/libexec/simplestchat-public/simplestchat-ops
          - release
          - admit-unsigned
          - --request
          - "{{ scpub_root }}/forced/{{ (scpub_force_preflight.stdout | from_json).runId }}/force.json"
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: true

    - name: Import and verify the image while the public service remains running
      vars:
        ansible_python_interpreter: /usr/bin/python3
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit=simplestchat-stage-{{ scpub_release_revision[:12] }}-{{ (scpub_force_preflight.stdout | from_json).runId }}"
          - --property=Type=exec
          - --property=RuntimeMaxSec=600
          - --property=TimeoutStopSec=60
          - --wait
          - /usr/local/libexec/simplestchat-public/simplestchat-ops
          - release
          - stage
          - --revision
          - "{{ scpub_release_revision }}"
          - --timeout-seconds
          - '600'
          - --finalization-seconds
          - '60'
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: true

    - name: Replace only the application through the ordinary deployment
      vars:
        ansible_python_interpreter: /usr/bin/python3
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit=simplestchat-release-{{ scpub_release_revision[:12] }}-{{ (scpub_force_preflight.stdout | from_json).runId }}"
          - --property=Type=exec
          - --property=RuntimeMaxSec=1800
          - --property=TimeoutStopSec=240
          - --wait
          - /usr/local/libexec/simplestchat-public/simplestchat-ops
          - release
          - deploy
          - --revision
          - "{{ scpub_release_revision }}"
          - --quiet-seconds
          - "{{ scpub_release_quiet_seconds }}"
          - --timeout-seconds
          - '1800'
          - --finalization-seconds
          - '60'
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: true
