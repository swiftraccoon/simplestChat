---
- name: Install private bounded production monitoring without replacing public services
  hosts: benchmark_hosts
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require an explicitly selected supported public deployment
      ansible.builtin.assert:
        that:
          - scmon_enabled | bool
          - scpub_enabled | bool
          - scmon_external_repository | default('') == '' or scmon_external_repository is match('^[A-Za-z0-9-]{1,39}/[A-Za-z0-9_.-]{1,100}$')
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - scpub_domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          - scmon_prometheus_image is match('^quay.io/prometheus/prometheus:v3.15.0@sha256:[a-f0-9]{64}$')
          - scmon_node_exporter_image is match('^quay.io/prometheus/node-exporter:v1.12.1@sha256:[a-f0-9]{64}$')
    - name: Look for the installed Ops executable without following links
      ansible.builtin.stat:
        path: /usr/local/libexec/simplestchat-public/simplestchat-ops
        follow: false
        get_checksum: false
      register: scmon_ops
    - name: Require the Ops executable a signed release delivers
      ansible.builtin.assert:
        that:
          - scmon_ops.stat.exists
          - scmon_ops.stat.isreg
          - scmon_ops.stat.uid == 0
          - scmon_ops.stat.mode == '0755'
        fail_msg: >-
          Deliver the signed Ops executable first: run release.yml for a signed
          revision (staging alone is enough), then repeat this playbook.
    - name: Refuse monitoring setup during unfinished owned host operations
      ansible.builtin.command:
        argv: [/usr/local/libexec/simplestchat-public/simplestchat-ops, release, preflight]
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: false
      check_mode: false
  tasks:
    - name: Create private monitoring configuration and bounded persistent state
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: '10003'
        mode: "{{ item.mode }}"
      loop:
        - {path: /etc/simplestchat-monitoring, owner: root, mode: '0750'}
        - {path: /var/lib/simplestchat-monitoring, owner: root, mode: '0750'}
        - {path: /var/lib/simplestchat-monitoring/prometheus, owner: '10003', mode: '0700'}
        - {path: /var/lib/simplestchat-monitoring/textfile, owner: root, mode: '0755'}
        - {path: /var/lib/simplestchat-monitoring/spool, owner: root, mode: '0700'}
        - {path: /var/lib/simplestchat-monitoring/external-spool, owner: root, mode: '0700'}
        - {path: /etc/systemd/journald.conf.d, owner: root, mode: '0755'}

    - name: Copy only the prepared metrics token into the scrape credential file
      ansible.builtin.command:
        argv: [/usr/local/libexec/simplestchat-public/simplestchat-ops, monitor, credential]
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      no_log: true
      register: scmon_token
      changed_when: scmon_token.stdout == 'changed'
      when: not ansible_check_mode

    - name: Install fixed monitoring settings without credentials
      ansible.builtin.copy:
        content: >
          {{ {'domain': scpub_domain,
              'external_repository': scmon_external_repository | default(''),
              'transfer_allowance_tb': scpub_transfer_allowance_tb | float,
              'transfer_reset_day': scpub_transfer_reset_day | int,
              'transfer_interface': scpub_transfer_interface} | to_nice_json }}
        dest: /etc/simplestchat-monitoring/settings.json
        owner: root
        group: root
        mode: '0600'

    - name: Render the private monitoring stack and scrape configuration
      notify: Reload validated Prometheus configuration
      ansible.builtin.template:
        src: "{{ item.source }}"
        dest: "{{ item.destination }}"
        owner: root
        group: '10003'
        mode: '0440'
      loop:
        - {source: monitoring-compose.yml.j2, destination: /etc/simplestchat-monitoring/compose.yml}
        - {source: monitoring-prometheus.yml.j2, destination: /etc/simplestchat-monitoring/prometheus.yml}

    - name: Install fixed operational alert rules
      notify: Reload validated Prometheus configuration
      ansible.builtin.copy:
        src: monitoring-alerts.yml
        dest: /etc/simplestchat-monitoring/alerts.yml
        owner: root
        group: '10003'
        mode: '0440'

    - name: Install the reviewed monitoring statements
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/libexec/simplestchat-public/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - monitoring-alerts.sql
        - monitoring-schema.sql
        - monitoring-external-schema.sql
        - monitoring-external.sql
        - monitoring-report.sql

    - name: Install hardened certificate refresh without replacing the public proxy
      ansible.builtin.template:
        src: turn-certificate.service.j2
        dest: /etc/systemd/system/simplestchat-turn-certificate.service
        owner: root
        group: root
        mode: '0644'
      notify: Reload monitoring units

    - name: Enable native relay metrics through the reviewed relay-only transaction
      ansible.builtin.command:
        argv: >-
          {{ ['/usr/local/libexec/simplestchat-public/simplestchat-ops', 'turn', 'enable-metrics'] +
             (['--verify-address', scpub_turn_verify_address]
              if scpub_turn_verify_address | default('') | length > 0 else []) }}
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      register: scmon_turn
      changed_when: "'Relay metrics enabled' in scmon_turn.stdout"

    - name: Back up the database and prepare only the private versioned operations schema
      ansible.builtin.command:
        argv: [/usr/local/libexec/simplestchat-public/simplestchat-ops, monitor, prepare]
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      register: scmon_schema
      changed_when: scmon_schema.stdout == 'created'

    - name: Install collector units
      ansible.builtin.template:
        src: "monitoring-collector.{{ item }}.j2"
        dest: "/etc/systemd/system/simplestchat-monitoring.{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [service, timer]
      notify: Reload monitoring units

    - name: Persist the bounded host journal across application replacement
      ansible.builtin.template:
        src: monitoring-journal.conf.j2
        dest: /etc/systemd/journald.conf.d/simplestchat-retention.conf
        owner: root
        group: root
        mode: '0644'
      notify: Reload persistent journal

    - name: Install the separate bounded external check importer
      ansible.builtin.template:
        src: "monitoring-external.{{ item }}.j2"
        dest: "/etc/systemd/system/simplestchat-monitoring-external.{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [service, timer]
      notify: Reload monitoring units

    - name: Pull only reviewed immutable monitoring images
      ansible.builtin.command:
        argv: [/usr/bin/docker, --host, 'unix:///var/run/docker.sock', image, pull, "{{ item }}"]
      loop: ["{{ scmon_prometheus_image }}", "{{ scmon_node_exporter_image }}"]
      register: scmon_pull
      changed_when: "'Downloaded newer image' in scmon_pull.stdout"

    - name: Validate scrape configuration and operational alert expressions
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - --host
          - unix:///var/run/docker.sock
          - run
          - --rm
          - --network=none
          - --read-only
          - --cap-drop=ALL
          - --security-opt=no-new-privileges:true
          - --user=10003:10003
          - --memory=128m
          - --cpus=0.25
          - --volume=/etc/simplestchat-monitoring:/etc/prometheus:ro
          - --entrypoint=/bin/promtool
          - "{{ scmon_prometheus_image }}"
          - check
          - config
          - /etc/prometheus/prometheus.yml
      changed_when: false

    - name: Start only the separately owned monitoring project
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - --host
          - unix:///var/run/docker.sock
          - compose
          - --project-directory
          - /etc/simplestchat-monitoring
          - -f
          - /etc/simplestchat-monitoring/compose.yml
          - up
          - -d
          - --no-build
          - --pull
          - never
      register: scmon_start
      changed_when: "'Started' in scmon_start.stderr or 'Created' in scmon_start.stderr or 'Recreated' in scmon_start.stderr"

    - name: Apply collector unit changes before enabling its timer
      ansible.builtin.meta: flush_handlers

    - name: Request journal logging during the next verified application replacement
      ansible.builtin.copy:
        content: "1\n"
        dest: /etc/simplestchat-monitoring/application-journal.enabled
        owner: root
        group: root
        mode: '0600'

    - name: Enable the bounded collector timer
      ansible.builtin.systemd_service:
        name: simplestchat-monitoring.timer
        enabled: true
        state: started

    - name: Collect the initial operational snapshot
      ansible.builtin.systemd_service:
        name: simplestchat-monitoring.service
        state: started

    - name: Configure the explicitly selected public GitHub polling timer
      ansible.builtin.systemd_service:
        name: simplestchat-monitoring-external.timer
        enabled: "{{ scmon_external_repository | default('') != '' }}"
        state: "{{ 'started' if scmon_external_repository | default('') != '' else 'stopped' }}"

  handlers:
    - name: Reload validated Prometheus configuration
      ansible.builtin.command:
        argv:
          - /usr/bin/docker
          - --host
          - unix:///var/run/docker.sock
          - kill
          - --signal=SIGHUP
          - simplestchat-monitoring-prometheus-1
      changed_when: true
    - name: Reload monitoring units
      ansible.builtin.systemd_service:
        daemon_reload: true
    - name: Reload persistent journal
      ansible.builtin.systemd_service:
        name: systemd-journald.service
        state: restarted
