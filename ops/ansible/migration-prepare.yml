---
- name: Inspect and prepare the two explicitly selected migration hosts
  hosts: benchmark_hosts
  become: true
  gather_facts: false
  any_errors_fatal: true
  strategy: linear
  vars:
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: Require the controller's exact two-host migration selection
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all | sort == ['migration_source', 'migration_target']
          - inventory_hostname in ['migration_source', 'migration_target']
          - scmig_action in ['verify', 'inspect', 'bootstrap', 'stage']
          - scmig_run_id is match('^[a-f0-9]{32}$')
          - scmig_revision is match('^[a-f0-9]{40}$')
          - scmig_source_origin is match('^https://[a-z0-9.-]+$')
          - scmig_destination_origin is match('^https://[a-z0-9.-]+$')
          - scmig_evidence is match('^/')
          - scpub_enabled | bool
          - scpub_config == '/etc/simplestchat-public'
          - scpub_root == '/srv/simplestchat-public'
        fail_msg: Use the migration controller with two frozen hosts and explicit operation identities.

    - name: Require existing private controller evidence before contacting either host
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -B
          - -c
          - |
            import os, stat, sys
            from pathlib import Path
            path = Path(sys.argv[1])
            parent = Path(sys.argv[2]).resolve()
            metadata = path.lstat()
            if not (path.is_absolute() and path.resolve() == path and path.parent == parent
                    and stat.S_ISDIR(metadata.st_mode) and metadata.st_uid == os.getuid()
                    and stat.S_IMODE(metadata.st_mode) == 0o700):
                raise SystemExit('Invalid private migration evidence')
          - "{{ scmig_evidence }}"
          - "{{ playbook_dir }}/../../results"
      delegate_to: localhost
      become: false
      when: inventory_hostname == 'migration_source'
      changed_when: false
      timeout: 15

  tasks:
    # Controller-local: neither host is contacted. The verified application
    # originals the later staging rechecks, and the authenticated Ops executable
    # the inspection runs, are named in private controller evidence.
    - name: Verify the signed application on the controller before either host is contacted
      when:
        - scmig_action == 'verify'
        - inventory_hostname == 'migration_source'
      delegate_to: localhost
      become: false
      block:
        - name: Require exact signed selectors and caller-trusted controller tools
          ansible.builtin.assert:
            that:
              - scpub_release_repository == 'swiftraccoon/simplestChat'
              - scpub_release_artifact_id is integer
              - scpub_release_artifact_id > 0
              - scpub_release_artifact_id <= 9007199254740991
              - scpub_release_ci_run is integer
              - scpub_release_ci_run > 0
              - scpub_release_ci_run <= 9007199254740991
              - scpub_release_expected_revision == scmig_revision
              - scpub_ops_artifact_id is integer
              - scpub_ops_artifact_id > 0
              - scpub_ops_artifact_id <= 9007199254740991
              - scpub_ops_selection is mapping
              - >-
                scpub_ops_selection.keys() | list | sort ==
                ['buildRunId', 'packageVersion', 'protocolVersion', 'repository',
                 'revision', 'runAttempt', 'target']
              - scpub_ops_selection.repository == scpub_release_repository
              - scpub_ops_selection.revision == scmig_revision
              - scpub_ops_selection.buildRunId == scpub_release_ci_run
              - >-
                scpub_ops_artifact_zip is not defined or
                (scpub_ops_artifact_zip is string and scpub_ops_artifact_zip is match('^/'))
              - scpub_ops_release_controller is string
              - scpub_ops_release_controller is match('^/')
              - scpub_ops_gh_executable is string
              - scpub_ops_gh_executable is match('^/')
              - scpub_ops_gh_executable | basename == 'gh'
              - scpub_ops_gh_executable | realpath | basename == 'gh'
              - "':' not in scpub_ops_gh_executable"
            fail_msg: >-
              A signed move needs the typed application and Ops selections and caller-trusted
              absolute controller and gh executables; use the native migration controller.

        - name: Verify the signed release through the native controller
          ansible.builtin.command:
            argv:
              - "{{ scpub_ops_release_controller }}"
              - verify
              - --repository
              - "{{ scpub_release_repository }}"
              - --artifact-id
              - "{{ scpub_release_artifact_id }}"
              - --revision
              - "{{ scmig_revision }}"
              - --ci-run
              - "{{ scpub_release_ci_run }}"
              - --artifact-dir
              - "{{ scpub_release_verified_directory | default('') }}"
              - --output-parent
              - "{{ (playbook_dir ~ '/../../results') | realpath }}"
              - --timeout-seconds
              - '600'
              - --finalization-seconds
              - '60'
          environment:
            PATH: "{{ scpub_ops_gh_executable | dirname }}:/usr/bin:/bin:/usr/sbin:/sbin"
          register: scmig_verified_application
          changed_when: false
          timeout: 660

        - name: Require the completed native application verification result
          vars:
            scmig_application: "{{ scmig_verified_application.stdout | from_json }}"
          ansible.builtin.assert:
            that:
              - scmig_verified_application.rc == 0
              - scmig_application is mapping
              - >-
                scmig_application.keys() | list | sort ==
                ['directory', 'image.tar', 'release.json', 'revision']
              - scmig_application.revision == scmig_revision
              - scmig_application.directory is string
              - scmig_application.directory is match('^/')
              - scmig_application['image.tar'] is match('^[a-f0-9]{64}$')
              - scmig_application['release.json'] is match('^[a-f0-9]{64}$')
            fail_msg: >-
              Native application verification must return only the exact revision, the absolute
              verified directory, and the signed image and manifest digests.

        - name: Retain the verified identity in private controller evidence
          ansible.builtin.copy:
            content: "{{ scmig_verified_application.stdout | from_json | to_json }}"
            dest: "{{ scmig_evidence }}/application.json"
            mode: '0600'
            force: false

        # The inspection runs this executable on both hosts before anything is
        # installed, so it is authenticated here, before either is contacted.
        - name: Serialize one original Ops acquisition request
          ansible.builtin.set_fact:
            scmig_ops_request: >-
              {{ {'schemaVersion': 1, 'selection': scpub_ops_selection,
                  'artifactId': scpub_ops_artifact_id,
                  'output': scmig_evidence ~ '/ops',
                  'authentication': 'gh-token'}
                 | combine({'artifactZip': scpub_ops_artifact_zip}
                           if scpub_ops_artifact_zip is defined else {}) | to_json }}
            cacheable: false

        - name: Retain the original acquisition request privately
          ansible.builtin.copy:
            content: "{{ scmig_ops_request }}"
            dest: "{{ scmig_evidence }}/ops-request.json"
            mode: '0600'
            force: false

        - name: Read the user's gh token only when GH_TOKEN was not supplied
          ansible.builtin.command:
            argv: [/usr/bin/env, -u, GH_TOKEN, -u, GITHUB_TOKEN,
                   "{{ scpub_ops_gh_executable | realpath }}", auth, token, --hostname, github.com]
          register: scmig_ops_credential
          changed_when: false
          no_log: true
          timeout: 30
          when: lookup('ansible.builtin.env', 'GH_TOKEN') | length == 0

        - name: Authenticate the signed Ops executable on the controller
          ansible.builtin.command:
            argv:
              - "{{ scpub_ops_release_controller }}"
              - ops-artifact
              - acquire
              - --request
              - "{{ scmig_evidence }}/ops-request.json"
              - --request-sha256
              - "{{ scmig_ops_request | hash('sha256') }}"
          environment:
            PATH: "{{ scpub_ops_gh_executable | realpath | dirname }}:/usr/bin:/bin"
            GH_TOKEN: >-
              {{ lookup('ansible.builtin.env', 'GH_TOKEN') or scmig_ops_credential.stdout | trim }}
            GITHUB_TOKEN: ''
          register: scmig_ops_acquired
          changed_when: false
          no_log: true
          timeout: 1920

        - name: Snapshot the authenticated executable
          ansible.builtin.stat:
            path: "{{ scmig_evidence }}/ops/verified/simplestchat-ops"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: scmig_ops_binary

        - name: Require the executable the verifier's signed policy pins
          vars:
            scmig_ops_observed: "{{ scmig_ops_acquired.stdout | from_json }}"
          ansible.builtin.assert:
            that:
              - scmig_ops_acquired.rc == 0
              - scmig_ops_observed is mapping
              - scmig_ops_observed.kind == 'ops-artifact-acquisition-observation'
              - scmig_ops_observed.scope == 'AuthenticatedRetainedBytesWithoutExecutionOrInstallation'
              - scmig_ops_observed.artifact.artifactId == scpub_ops_artifact_id
              - scmig_ops_observed.selection == scpub_ops_selection
              - scmig_ops_observed.verification.matchedVerifierPolicy.revision == scmig_revision
              - scmig_ops_observed.verification.matchedVerifierPolicy.buildRunId == scpub_release_ci_run
              - >-
                scmig_ops_observed.verification.matchedVerifierPolicy.binarySha256
                is match('^[a-f0-9]{64}$')
              - scmig_ops_binary.stat.isreg | default(false)
              - not (scmig_ops_binary.stat.islnk | default(false))
              - scmig_ops_binary.stat.nlink == 1
              - scmig_ops_binary.stat.size > 0
              - scmig_ops_binary.stat.size <= 268435456
              - >-
                scmig_ops_binary.stat.checksum ==
                scmig_ops_observed.verification.matchedVerifierPolicy.binarySha256
            fail_msg: >-
              The retained Ops executable must be the one the signed attestation pins for
              exactly this selection.

        - name: Retain the authenticated executable's identity in private controller evidence
          ansible.builtin.copy:
            content: >-
              {{ {'path': scmig_evidence ~ '/ops/verified/simplestchat-ops',
                  'sha256': scmig_ops_binary.stat.checksum,
                  'bytes': scmig_ops_binary.stat.size} | to_json }}
            dest: "{{ scmig_evidence }}/ops.json"
            mode: '0600'
            force: false

      always:
        - name: Clear the noncached token-bearing command result
          ansible.builtin.set_fact:
            scmig_ops_credential: {}
            cacheable: false
          no_log: true

    # Neither host has a trusted executable of this revision yet, and nothing may
    # be installed before both are known. The authenticated one is therefore run
    # from a volatile private directory and removed again.
    - name: Hold the executable this move authenticated before it reaches either host
      when: scmig_action in ['inspect', 'bootstrap']
      block:
        - name: Snapshot the authenticated executable the controller retained
          ansible.builtin.stat:
            path: "{{ scmig_ops_executable }}"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: scmig_inspector_original

        - name: Require exactly the executable this move authenticated
          ansible.builtin.assert:
            that:
              - scmig_ops_executable == scmig_evidence ~ '/ops/verified/simplestchat-ops'
              - scmig_ops_sha256 is match('^[a-f0-9]{64}$')
              - scmig_inspector_original.stat.isreg | default(false)
              - not (scmig_inspector_original.stat.islnk | default(false))
              - scmig_inspector_original.stat.nlink == 1
              - scmig_inspector_original.stat.checksum == scmig_ops_sha256
            fail_msg: The controller must still hold the exact executable it authenticated.

    - name: Inspect both selected machines without changing services or stored files
      when: scmig_action == 'inspect'
      block:
        # A host's /run forbids execution; /var/tmp is on its root filesystem.
        - name: Create a private directory for the executable where it can run
          ansible.builtin.tempfile:
            state: directory
            path: /var/tmp
            prefix: simplestchat-inspect-
          register: scmig_inspector

        - name: Transfer the authenticated executable without installing it
          ansible.builtin.copy:
            src: "{{ scmig_ops_executable }}"
            dest: "{{ scmig_inspector.path }}/simplestchat-ops"
            owner: root
            group: root
            mode: '0700'
            force: false

        - name: Join the transferred bytes before their first execution
          ansible.builtin.stat:
            path: "{{ scmig_inspector.path }}/simplestchat-ops"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: scmig_inspector_copy

        - name: Require the authenticated bytes on the host
          ansible.builtin.assert:
            that:
              - scmig_inspector_copy.stat.isreg | default(false)
              - not (scmig_inspector_copy.stat.islnk | default(false))
              - scmig_inspector_copy.stat.uid == 0
              - scmig_inspector_copy.stat.mode == '0700'
              - scmig_inspector_copy.stat.checksum == scmig_ops_sha256

        - name: Read the physical identity and source configuration or empty target state
          ansible.builtin.command:
            argv:
              - "{{ scmig_inspector.path }}/simplestchat-ops"
              - migrate
              - inspect
              - "{{ 'source' if inventory_hostname == 'migration_source' else 'target' }}"
              - "{{ scmig_source_origin if inventory_hostname == 'migration_source' else scmig_destination_origin }}"
          environment:
            PATH: /usr/sbin:/usr/bin:/sbin:/bin
            GH_TOKEN: ''
            GITHUB_TOKEN: ''
          register: scmig_inspected
          changed_when: false
          timeout: 60

        - name: Require two distinct successful physical host inspections
          ansible.builtin.assert:
            that:
              - (hostvars['migration_source'].scmig_inspected.stdout | from_json).passed == true
              - (hostvars['migration_target'].scmig_inspected.stdout | from_json).passed == true
              - >-
                (hostvars['migration_source'].scmig_inspected.stdout | from_json).machineId !=
                (hostvars['migration_target'].scmig_inspected.stdout | from_json).machineId
          when: inventory_hostname == 'migration_source'

        - name: Retain only the inspected identities in private controller evidence
          ansible.builtin.copy:
            content: >-
              {{ {'source': hostvars['migration_source'].scmig_inspected.stdout | from_json,
                  'target': hostvars['migration_target'].scmig_inspected.stdout | from_json} | to_nice_json }}
            dest: "{{ scmig_evidence }}/inspection.json"
            mode: '0600'
            force: false
          delegate_to: localhost
          become: false
          when: inventory_hostname == 'migration_source'

      always:
        - name: Remove the private directory and the executable
          ansible.builtin.file:
            path: "{{ scmig_inspector.path }}"
            state: absent
          when: scmig_inspector.path is defined

    - name: Install the reviewed helpers and exact source secrets without starting services
      when: scmig_action == 'bootstrap'
      block:
        - name: Refuse unfinished owned work and unsafe existing bootstrap paths
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -B
              - -c
              - |
                import fcntl, json, os, stat, sys
                from pathlib import Path
                private = ['/etc/simplestchat-public', '/srv/simplestchat-public',
                           '/srv/simplestchat-public/releases', '/srv/simplestchat-public/results',
                           '/srv/simplestchat-public/migrations', '/run/simplestchat-bench']
                paths = [(Path(name), 0o700) for name in private]
                paths.append((Path('/usr/local/libexec/simplestchat-public'), 0o755))
                for path, mode in paths:
                    if path.exists() or path.is_symlink():
                        metadata = path.lstat()
                        if not (stat.S_ISDIR(metadata.st_mode) and metadata.st_uid == 0
                                and metadata.st_gid == 0 and stat.S_IMODE(metadata.st_mode) == mode):
                            raise SystemExit('Unsafe migration bootstrap path')
                lock = Path('/run/simplestchat-bench/workload.lock')
                if lock.exists() or lock.is_symlink():
                    descriptor = os.open(lock, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
                    metadata = os.fstat(descriptor)
                    if not (stat.S_ISREG(metadata.st_mode) and metadata.st_uid == 0
                            and stat.S_IMODE(metadata.st_mode) == 0o600):
                        raise SystemExit('Unsafe workload lock')
                    fcntl.flock(descriptor, fcntl.LOCK_EX | fcntl.LOCK_NB)
                for name in ['/run/simplestchat-bench/current.json',
                             '/srv/simplestchat-public/release-state.json']:
                    path = Path(name)
                    if path.exists() or path.is_symlink():
                        metadata = path.lstat()
                        if not (stat.S_ISREG(metadata.st_mode) and metadata.st_uid == 0
                                and stat.S_IMODE(metadata.st_mode) == 0o600
                                and 0 < metadata.st_size <= 16384):
                            raise SystemExit('Unsafe owned operation journal')
                        record = json.loads(path.read_text())
                        if not (isinstance(record, dict) and type(record.get('schemaVersion')) is int
                                and record['schemaVersion'] == 1 and record.get('finalized') is True):
                            raise SystemExit('Unfinished owned operation')
                request = Path('/srv/simplestchat-public/migrations') / sys.argv[1]
                if request.exists() or request.is_symlink():
                    raise SystemExit('Migration operation already exists')
              - "{{ scmig_run_id }}"
          changed_when: false
          timeout: 30

        - name: Create private migration and immutable release storage
          ansible.builtin.file:
            path: "{{ item }}"
            state: directory
            owner: root
            group: root
            mode: '0700'
          loop:
            - /etc/simplestchat-public
            - /srv/simplestchat-public
            - /srv/simplestchat-public/releases
            - /srv/simplestchat-public/results
            - /srv/simplestchat-public/migrations
            - "/srv/simplestchat-public/migrations/{{ scmig_run_id }}"

        - name: Create the protected installed-helper directory
          ansible.builtin.file:
            path: /usr/local/libexec/simplestchat-public
            state: directory
            owner: root
            group: root
            mode: '0755'

        - name: Install the canonical release receiver and migration helpers
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/usr/local/libexec/simplestchat-public/{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop:
            - bounded_process.py
            - runtime_profile.py
            - release-public.py
            - release_public.py
            - release_artifact.py
            - release_assets.py
            - browser_assets.py
            - release_json.py
            - reboot-public.py
            - reboot_public.py
            - fetch-release.py
            - release_fetch_receiver.py
            - release_trust.py
            - backup_public.py
            - turn_public.py
            - force_release.py

        - name: Bind a new private migration request without replacing prior evidence
          ansible.builtin.copy:
            content: >-
              {{ {'operationId': scmig_run_id, 'sourceOrigin': scmig_source_origin,
                  'destinationOrigin': scmig_destination_origin,
                  'targetRevision': scmig_revision} | to_nice_json }}
            dest: "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/request.json"
            owner: root
            group: root
            mode: '0600'
            force: false

        # Every later step of the move runs these bytes and no installed
        # helper: a source keeps whatever release it has installed.
        - name: Keep the authenticated executable beside the request of this move
          ansible.builtin.copy:
            src: "{{ scmig_ops_executable }}"
            dest: "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/simplestchat-ops"
            owner: root
            group: root
            mode: '0700'
            force: false

        - name: Require the authenticated bytes beside the request
          ansible.builtin.include_tasks: tasks/migration-ops.yml

        - name: Inspect source secrets without returning their contents
          ansible.builtin.stat:
            path: /etc/simplestchat-public/secrets.json
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: scmig_source_secret
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Require private root-owned source secrets
          ansible.builtin.assert:
            that:
              - scmig_source_secret.stat.isreg | default(false)
              - not (scmig_source_secret.stat.islnk | default(false))
              - scmig_source_secret.stat.uid == 0
              - scmig_source_secret.stat.gid == 0
              - scmig_source_secret.stat.mode == '0600'
              - scmig_source_secret.stat.size > 0
              - scmig_source_secret.stat.size <= 65536
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Fetch source secrets into the private controller transaction
          ansible.builtin.fetch:
            src: /etc/simplestchat-public/secrets.json
            dest: "{{ scmig_evidence }}/source-secrets.json"
            flat: true
            validate_checksum: true
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Restrict the retained local secret copy
          ansible.builtin.file:
            path: "{{ scmig_evidence }}/source-secrets.json"
            mode: '0600'
          delegate_to: localhost
          become: false
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Inspect the retained private secret copy
          ansible.builtin.stat:
            path: "{{ scmig_evidence }}/source-secrets.json"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: scmig_retained_secret
          delegate_to: localhost
          become: false
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Require the source secret bytes to remain unchanged during transfer
          ansible.builtin.assert:
            that:
              - scmig_retained_secret.stat.isreg
              - scmig_retained_secret.stat.mode == '0600'
              - scmig_retained_secret.stat.checksum == hostvars['migration_source'].scmig_source_secret.stat.checksum
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Inspect existing destination secrets without following links
          ansible.builtin.stat:
            path: /etc/simplestchat-public/secrets.json
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: scmig_target_secret
          when: inventory_hostname == 'migration_target'
          no_log: true

        - name: Refuse replacement of different or unsafe destination secrets
          ansible.builtin.assert:
            that:
              - scmig_target_secret.stat.isreg | default(false)
              - not (scmig_target_secret.stat.islnk | default(false))
              - scmig_target_secret.stat.uid == 0
              - scmig_target_secret.stat.gid == 0
              - scmig_target_secret.stat.mode == '0600'
              - scmig_target_secret.stat.checksum == hostvars['migration_source'].scmig_source_secret.stat.checksum
          when:
            - inventory_hostname == 'migration_target'
            - scmig_target_secret.stat.exists
          no_log: true

        - name: Preserve the exact source secrets only on the fresh destination
          ansible.builtin.copy:
            src: "{{ scmig_evidence }}/source-secrets.json"
            dest: /etc/simplestchat-public/secrets.json
            owner: root
            group: root
            mode: '0600'
            force: false
          when: inventory_hostname == 'migration_target'
          no_log: true

        - name: Verify the final destination secret bytes before staging
          ansible.builtin.stat:
            path: /etc/simplestchat-public/secrets.json
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          register: scmig_copied_secret
          when: inventory_hostname == 'migration_target'
          no_log: true

        - name: Require the exact protected source secrets on the destination
          ansible.builtin.assert:
            that:
              - scmig_copied_secret.stat.isreg
              - not scmig_copied_secret.stat.islnk
              - scmig_copied_secret.stat.uid == 0
              - scmig_copied_secret.stat.gid == 0
              - scmig_copied_secret.stat.mode == '0600'
              - scmig_copied_secret.stat.checksum == hostvars['migration_source'].scmig_source_secret.stat.checksum
          when: inventory_hostname == 'migration_target'
          no_log: true

    - name: Preserve the unchanged hostname certificate before DNS cutover
      when:
        - scmig_action == 'bootstrap'
        - scmig_source_origin == scmig_destination_origin
      block:
        - name: Export only the validated source hostname certificate and metadata
          ansible.builtin.command:
            argv:
              - "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/simplestchat-ops"
              - migrate
              - tls
              - export
              - "{{ scmig_run_id }}"
          when: inventory_hostname == 'migration_source'
          changed_when: true
          timeout: 90
          no_log: true

        - name: Fetch the private hostname certificate envelope
          ansible.builtin.fetch:
            src: "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/tls.json"
            dest: "{{ scmig_evidence }}/tls.json"
            flat: true
            validate_checksum: true
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Restrict the controller certificate envelope
          ansible.builtin.file:
            path: "{{ scmig_evidence }}/tls.json"
            mode: '0600'
          delegate_to: localhost
          become: false
          when: inventory_hostname == 'migration_source'
          no_log: true

        - name: Copy the protected certificate envelope to the fresh destination
          ansible.builtin.copy:
            src: "{{ scmig_evidence }}/tls.json"
            dest: "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/tls.json"
            owner: root
            group: root
            mode: '0600'
            force: false
          when: inventory_hostname == 'migration_target'
          no_log: true

        - name: Validate and install the exact hostname subtree without replacing existing bytes
          ansible.builtin.command:
            argv:
              - "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/simplestchat-ops"
              - migrate
              - tls
              - import
              - "{{ scmig_run_id }}"
          when: inventory_hostname == 'migration_target'
          changed_when: true
          timeout: 90
          no_log: true

    # The routine release's staging without its prepared-host preflight: a fresh
    # destination has no images.json until public.yml reads what is staged here.
    - name: Transfer and stage the exact verified CI artifact only on the destination
      when:
        - scmig_action == 'stage'
        - inventory_hostname == 'migration_target'
      block:
        - name: Require exact signed-release selectors and direct key-based SSH
          ansible.builtin.assert:
            that:
              - scpub_release_repository == 'swiftraccoon/simplestChat'
              - scpub_release_artifact_id is integer
              - scpub_release_artifact_id > 0
              - scpub_release_artifact_id <= 9007199254740991
              - scpub_release_expected_revision == scmig_revision
              - scpub_release_revision == scmig_revision
              - scpub_release_ci_run is integer
              - scpub_release_ci_run > 0
              - scpub_release_ci_run <= 9007199254740991
              - scpub_release_verified_directory is string
              - scpub_release_verified_directory is match('^/')
              - scpub_ops_artifact_id is integer
              - scpub_ops_artifact_id > 0
              - scpub_ops_artifact_id <= 9007199254740991
              - scpub_ops_selection is mapping
              - >-
                scpub_ops_selection.keys() | list | sort ==
                ['buildRunId', 'packageVersion', 'protocolVersion', 'repository',
                 'revision', 'runAttempt', 'target']
              - scpub_ops_selection.repository == scpub_release_repository
              - scpub_ops_selection.revision == scmig_revision
              - scpub_ops_selection.packageVersion == '0.1.0'
              - scpub_ops_selection.protocolVersion is integer
              - scpub_ops_selection.protocolVersion == 1
              - scpub_ops_selection.target == 'x86_64-unknown-linux-musl'
              - scpub_ops_selection.buildRunId is integer
              - scpub_ops_selection.buildRunId == scpub_release_ci_run
              - scpub_ops_selection.runAttempt is integer
              - scpub_ops_selection.runAttempt > 0
              - scpub_ops_selection.runAttempt <= 9007199254740991
              - scpub_ops_release_controller is string
              - scpub_ops_release_controller is match('^/')
              - scpub_ops_gh_executable is string
              - scpub_ops_gh_executable is match('^/')
              - scpub_ops_gh_executable | basename == 'gh'
              - scpub_ops_gh_executable | realpath | basename == 'gh'
              - "':' not in scpub_ops_gh_executable"
              - >-
                scpub_ops_artifact_zip is not defined or
                (scpub_ops_artifact_zip is string and scpub_ops_artifact_zip is match('^/'))
              - ansible_connection | default('ssh') == 'ssh'
              - ansible_host is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
              - ansible_user is string
              - ansible_user | length > 0
              - ansible_ssh_private_key_file is match('^/')
              - ansible_port | default(22) | string is match('^[1-9][0-9]*$')
              - ansible_port | default(22) | int <= 65535
              - ansible_password is not defined
              - ansible_ssh_pass is not defined
              - ansible_ssh_password is not defined
              - ansible_become_password is not defined
              - ansible_become_pass is not defined
              - ansible_ssh_common_args | default('') | length == 0
              - ansible_ssh_extra_args | default('') | length == 0
            fail_msg: >-
              A signed move needs the typed same-revision application and Ops selections, the
              originals the controller verified, trusted absolute controller paths and direct
              key-based SSH; use the native migration controller.

        - name: Verify the retained signed originals again through the native controller
          ansible.builtin.command:
            argv:
              - "{{ scpub_ops_release_controller }}"
              - verify
              - --repository
              - "{{ scpub_release_repository }}"
              - --artifact-id
              - "{{ scpub_release_artifact_id }}"
              - --revision
              - "{{ scmig_revision }}"
              - --ci-run
              - "{{ scpub_release_ci_run }}"
              - --artifact-dir
              - "{{ scpub_release_verified_directory }}"
              - --output-parent
              - "{{ (playbook_dir ~ '/../../results') | realpath }}"
              - --timeout-seconds
              - '600'
              - --finalization-seconds
              - '60'
          environment:
            PATH: "{{ scpub_ops_gh_executable | dirname }}:/usr/bin:/bin:/usr/sbin:/sbin"
          delegate_to: localhost
          become: false
          register: scpub_native_validated_release
          changed_when: false
          timeout: 660

        - name: Require the completed native application verification result
          vars:
            scpub_native_verified_release: "{{ scpub_native_validated_release.stdout | from_json }}"
          ansible.builtin.assert:
            that:
              - scpub_native_validated_release.rc == 0
              - scpub_native_verified_release is mapping
              - >-
                scpub_native_verified_release.keys() | list | sort ==
                ['directory', 'image.tar', 'release.json', 'revision']
              - scpub_native_verified_release.revision == scmig_revision
              - scpub_native_verified_release.directory == scpub_release_verified_directory
              - scpub_native_verified_release['image.tar'] is match('^[a-f0-9]{64}$')
              - scpub_native_verified_release['release.json'] is match('^[a-f0-9]{64}$')
            fail_msg: >-
              The originals verified before any host was contacted must verify again, unchanged.

        - name: Use the completed native controller verification result
          ansible.builtin.set_fact:
            scpub_validated_release: "{{ scpub_native_validated_release }}"
            cacheable: false

        - name: Snapshot the controller-verified application predicate
          ansible.builtin.stat:
            path: "{{ scpub_release_verified_directory }}/release-predicate.json"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: scpub_app_predicate_file

        - name: Snapshot the controller-verified application manifest
          ansible.builtin.stat:
            path: "{{ scpub_release_verified_directory }}/release.json"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          delegate_to: localhost
          become: false
          register: scpub_app_manifest_file

        - name: Require the verified application originals before any Ops delivery
          ansible.builtin.assert:
            that:
              - scpub_app_predicate_file.stat.isreg | default(false)
              - not (scpub_app_predicate_file.stat.islnk | default(false))
              - scpub_app_predicate_file.stat.nlink == 1
              - scpub_app_predicate_file.stat.size > 0
              - scpub_app_predicate_file.stat.size <= 67108864
              - scpub_app_predicate_file.stat.checksum is match('^[a-f0-9]{64}$')
              - scpub_app_manifest_file.stat.isreg | default(false)
              - not (scpub_app_manifest_file.stat.islnk | default(false))
              - >-
                scpub_app_manifest_file.stat.checksum ==
                (scpub_validated_release.stdout | from_json)['release.json']
            fail_msg: The controller must still hold the exact signed originals it verified.

        - name: Read the controller-verified application predicate
          ansible.builtin.slurp:
            src: "{{ scpub_release_verified_directory }}/release-predicate.json"
          delegate_to: localhost
          become: false
          register: scpub_app_predicate_bytes
          no_log: true

        # Staging runs the signed executable, and every later service playbook
        # requires it, so it arrives before anything else is staged.
        - name: Deliver the signed current Ops executable through native policy
          ansible.builtin.import_tasks: tasks/signed-ops.yml

        - name: Create private immutable storage for the selected release
          ansible.builtin.file:
            path: "{{ scpub_root }}/releases/{{ scmig_revision }}"
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Verify the exact GitHub release and fetch it directly onto the destination
          ansible.builtin.command:
            argv:
              - "{{ scpub_ops_release_controller }}"
              - fetch
              - --repository
              - "{{ scpub_release_repository }}"
              - --revision
              - "{{ scmig_revision }}"
              - --artifact-id
              - "{{ scpub_release_artifact_id }}"
              - --ci-run
              - "{{ scpub_release_ci_run }}"
              - --host
              - "{{ ansible_host }}"
              - --user
              - "{{ ansible_user }}"
              - --identity
              - "{{ ansible_ssh_private_key_file }}"
              - --port
              - "{{ ansible_port | default(22) }}"
              - --output-parent
              - "{{ (playbook_dir ~ '/../../results') | realpath }}"
              - --verified-directory
              - "{{ scpub_release_verified_directory }}"
              - --timeout-seconds
              - '1020'
              - --finalization-seconds
              - '60'
          environment:
            PATH: "{{ scpub_ops_gh_executable | dirname }}:/usr/bin:/bin:/usr/sbin:/sbin"
          delegate_to: localhost
          become: false
          changed_when: true
          timeout: 1080

        - name: Import the verified production image without launching the app
          ansible.builtin.command:
            argv:
              - systemd-run
              - "--unit=simplestchat-migration-stage-{{ scmig_run_id }}"
              - --property=Type=exec
              - --property=RuntimeMaxSec=600
              - --property=TimeoutStopSec=60
              - --wait
              - --collect
              - /usr/local/libexec/simplestchat-public/simplestchat-ops
              - release
              - stage
              - --revision
              - "{{ scmig_revision }}"
              - --timeout-seconds
              - '600'
              - --finalization-seconds
              - '60'
          environment:
            PATH: /usr/sbin:/usr/bin:/sbin:/bin
            GH_TOKEN: ''
            GITHUB_TOKEN: ''
          changed_when: true
          timeout: 720

        # Later maintenance joins this retained signed identity of the staged release.
        - name: Copy only the original verified predicate without replacing existing evidence
          ansible.builtin.copy:
            src: "{{ scpub_release_verified_directory }}/release-predicate.json"
            dest: "{{ scpub_root }}/releases/{{ scmig_revision }}/release-predicate.json"
            owner: root
            group: root
            mode: '0600'
            follow: false
            local_follow: false
            force: false

        - name: Recheck the retained predicate and the staged manifest
          ansible.builtin.stat:
            path: "{{ scpub_root }}/releases/{{ scmig_revision }}/{{ item }}"
            follow: false
            get_checksum: true
            checksum_algorithm: sha256
          loop: [release-predicate.json, release.json]
          register: scmig_staged_identity

        - name: Require the staged release to hold the exact signed originals
          ansible.builtin.assert:
            that:
              - scmig_staged_identity.results | length == 2
              - scmig_staged_identity.results | map(attribute='stat.isreg') | min
              - not (scmig_staged_identity.results | map(attribute='stat.islnk') | max)
              - scmig_staged_identity.results | map(attribute='stat.uid') | unique | list == [0]
              - scmig_staged_identity.results | map(attribute='stat.gid') | unique | list == [0]
              - scmig_staged_identity.results | map(attribute='stat.mode') | unique | list == ['0600']
              - >-
                scmig_staged_identity.results[0].stat.checksum ==
                scpub_app_predicate_file.stat.checksum
              - >-
                scmig_staged_identity.results[1].stat.checksum ==
                (scpub_validated_release.stdout | from_json)['release.json']
            fail_msg: The staged release must retain its original signed predicate and manifest.
