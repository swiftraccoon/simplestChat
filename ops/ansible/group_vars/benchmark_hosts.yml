---
scbench_root: /srv/simplestchat-bench
scbench_repository: https://github.com/swiftraccoon/simplestChat.git
scbench_release_dir: "{{ scbench_root }}/sources/{{ scbench_revision }}"
# Official Docker Debian repository versions and key verified 2026-10-05.
scbench_docker_gpg_sha256: 1500c1f56fa9e26b9b8f42452a553675796ade0807cdce11975eb98170b3a570
scbench_docker_engine_version: 5:29.8.2-1~debian.13~trixie
scbench_docker_cli_version: 5:29.8.2-1~debian.13~trixie
scbench_containerd_version: 2.3.6-1~debian.13~trixie
scbench_docker_buildx_version: 0.37.1-1~debian.13~trixie
scbench_docker_compose_version: 5.6.0-1~debian.13~trixie
# Docker packages supply the service units. Newer standalone releases
# are authenticated separately where the signed package channel has not caught up.
scbench_containerd_upstream_version: 2.4.1
scbench_containerd_archive_sha256: d65eda6a188aac1006848d8060099be88ba9c4bcddbfd9a23a961194710d0dd4
scbench_containerd_binary_sha256:
  containerd: 3853e8be0b4fde012046d9e08e3437be2fa9ee5171bdd7e2e6d7c4daded77232
  containerd-shim-runc-v2: 5848d90712cc3ed09548b1779efb3ed231d52063054b5f4128a9de0892e8771c
  ctr: 3b532fb748982b208caeb002efec180dfe04a5e939dffe465ff681343c9ec71c
scbench_runc_upstream_version: 1.5.2
scbench_runc_binary_sha256: 599f6f94ff8c5057241eff0d54c3c74f95c34935b6457b33fe545defc61e9488
scbench_docker_buildx_upstream_version: 0.37.2
scbench_docker_buildx_binary_sha256: 982ca20490b45ed1ec8d99795974d3d874a358f75938c9c237305010e6b7e548
scbench_docker_compose_binary_sha256: 40343e21ca777173e69cff5dbafeb37c6f81f3b0d57d9e597f036e95eb63e76a
scbench_upgrade_packages: false
scbench_reboot: false
scbench_workload:
  clients: 10
  rooms: 1
  rampUp: 5
  warmup: 10
  duration: 60
  workers: 1

# Public deployment is a separate, explicitly enabled playbook.
scpub_enabled: false
scpub_registration_enabled: false
# Retain the original relying-party identity when moving to one of its subdomains.
scpub_webauthn_rp_id: "{{ scpub_domain }}"
# Sizing follows the host unless the inventory says otherwise (the model is
# build/capacity.py's: the app takes all but one vCPU and the memory beyond a
# quarter, at least 1 GiB, kept for the database, the proxy and the system;
# MAX_CONNECTIONS counts the lightest participants, webinar viewers at 175 per
# worker as measured on an EPYC-class VPS, and heavier shapes meet the
# per-worker CPU guard first). `build/capacity.py suggest --vcpus N --memory-gib M`
# prints the same numbers with what they carry; `run` measures a host.
# The addresses clients reach: the host's default routes unless the inventory
# says otherwise. A dual-stack host announces both; an IPv6-only host announces
# IPv6 as its only address.
scpub_announce_ip: "{{ ansible_default_ipv4.address | default(ansible_default_ipv6.address | default('')) }}"
scpub_announce_ipv6: "{{ (ansible_default_ipv6.address | default('')) if ansible_default_ipv4.address is defined else '' }}"
# The Compose network's IPv6 range when the host announces IPv6 (a private
# range; Docker translates it to the host's address).
scpub_ipv6_network: fd5c:5c68:a7d1::/64
# The port the provider sells, Mbit/s: nearly every VPS has a gigabit port, and a
# virtio interface does not report its speed (measure it instead, docs/performance.md).
scpub_port_mbps: 1000
# The provider's monthly transfer allowance, TB (0 = unknown); the monitoring
# collector totals the interface's traffic per billing period and alerts at
# 80 % and at 100 %. Providers usually count both directions.
scpub_transfer_allowance_tb: 0
scpub_transfer_reset_day: 1
scpub_transfer_interface: "{{ ansible_default_ipv4.interface | default(ansible_default_ipv6.interface | default('eth0')) }}"
# The reserve kept from the app for PostgreSQL, Caddy, TURN and the system.
scpub_reserved_cpus: 1
scpub_reserved_memory_share: 0.25
scpub_reserved_memory_min_mib: 1024
scpub_host_memory_mib: "{{ ansible_memtotal_mb | default(2048) | int }}"
scpub_reserved_memory_mib: "{{ [scpub_reserved_memory_min_mib | int, ((scpub_host_memory_mib | int) * (scpub_reserved_memory_share | float)) | int] | max }}"
scpub_app_cpus: "{{ [1, (ansible_processor_vcpus | default(2) | int) - (scpub_reserved_cpus | int)] | max }}"
scpub_media_workers: "{{ [64, [1, scpub_app_cpus | int] | max] | min }}"
scpub_app_memory_mib: "{{ [512, (scpub_host_memory_mib | int) - (scpub_reserved_memory_mib | int)] | max }}"
scpub_webinar_viewers_per_worker: 175
scpub_capacity_plan: >-
  {{ (scpub_media_workers | int) | simplestchat_capacity(
    scpub_app_memory_mib | int, scpub_port_mbps | float, scpub_webinar_viewers_per_worker | int) }}
scpub_max_connections: "{{ scpub_capacity_plan.connections }}"
scpub_max_rooms: "{{ [64, scpub_max_connections | int] | max }}"
# A room's viewers spread over every worker, so one webinar may fill the host;
# the broadcaster ceiling keeps the all-publishing grid within the per-viewer cap.
scpub_max_participants_per_room: "{{ scpub_capacity_plan.participants }}"
scpub_max_broadcasters_per_room: 30
# Policy, not capacity: accounts and persisted rooms the site admits.
scpub_max_users: 100
scpub_max_persisted_rooms: 100
# The reserve's services get ceilings (Docker limits, not reservations) that
# grow with the reserve: PostgreSQL half of it within 1-4 GiB, Caddy an eighth
# within 256 MiB-2 GiB, both sharing the reserved CPUs.
scpub_postgres_memory_mib: "{{ [1024, [4096, (scpub_reserved_memory_mib | int) // 2] | min] | max }}"
scpub_postgres_shared_buffers_mib: "{{ (scpub_postgres_memory_mib | int) // 4 }}"
scpub_postgres_cpus: "{{ [1, scpub_reserved_cpus | int] | max }}"
scpub_caddy_memory_mib: "{{ [256, [2048, (scpub_reserved_memory_mib | int) // 8] | min] | max }}"
scpub_caddy_cpus: "{{ [0.5, (scpub_reserved_cpus | int) / 2] | max }}"
# TURN relays every participant's media twice, so its capacity is half the port,
# it may hold an allocation set for every connection, and a relayed viewer keeps
# the app's per-viewer cap (3 Mbit/s plus overhead).
scpub_turn_memory_mib: 512
scpub_turn_cpus: 1
# coturn's *bps names mean BYTES per second: Mbit/s * 1,000,000 / 8.
scpub_turn_bps_capacity: "{{ ((scpub_port_mbps | float) * 62500) | int }}"
scpub_turn_max_bps: 500000
scpub_turn_user_quota: 4
scpub_turn_total_quota: "{{ scpub_max_connections | int }}"
scpub_turn_relay_threads: 1
scpub_turn_relay_port_min: 49160
scpub_turn_relay_port_max: "{{ [65000, (scpub_turn_relay_port_min | int) + 2 * (scpub_turn_total_quota | int) - 1] | min }}"
scpub_release_deploy: false
scpub_reboot: false
scpub_config: /etc/simplestchat-public
scpub_root: /srv/simplestchat-public
scpub_postgres_image: docker.io/library/postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
scpub_caddy_image: docker.io/library/caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
scpub_turn_enabled: false
scpub_turn_activate: false
scpub_turn_image: docker.io/coturn/coturn:4.18.0@sha256:bbefd3e1fdfdc0d58770fe01b581fd8b00d9f3a5580d00acb77cf719a6bc78e3

# Private, separately applied production monitoring; verified upstream manifests 2026-09-23.
scmon_enabled: false
scmon_prometheus_image: quay.io/prometheus/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
scmon_node_exporter_image: quay.io/prometheus/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
