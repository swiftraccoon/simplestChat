rule_files:
  - ../files/monitoring-alerts.yml
evaluation_interval: 30s
tests:
  - name: Failed scrapes become incidents after the configured debounce
    interval: 30s
    input_series:
      - series: 'up{job="app",instance="127.0.0.1:3000"}'
        values: '0x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: MetricsUnavailable
        exp_alerts:
          - exp_labels: {severity: critical, job: app, instance: '127.0.0.1:3000'}
  - name: A healthy scrape does not trigger an availability incident
    interval: 30s
    input_series:
      - series: 'up{job="app",instance="127.0.0.1:3000"}'
        values: '1x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: MetricsUnavailable
        exp_alerts: []
  - name: A published sample must remain fresh
    interval: 30s
    input_series:
      - series: 'simplestchat_quality_sample_available{job="app"}'
        values: '1x8'
      - series: 'simplestchat_quality_sample_age_seconds{job="app"}'
        values: '60x8'
    alert_rule_test:
      - eval_time: 3m
        alertname: QualitySampleStale
        exp_alerts:
          - exp_labels: {severity: warning, job: app}
  - name: Missing external import does not pretend monitoring is enabled
    interval: 1m
    alert_rule_test:
      - eval_time: 21m
        alertname: ExternalImportUnavailable
        exp_alerts:
          - exp_labels: {severity: warning}
  - name: Completed setup-only jobs leave probe coverage incomplete
    interval: 1m
    input_series:
      - series: 'simplestchat_ops_external_coverage_complete{component="canary"}'
        values: '1x32'
      - series: 'simplestchat_ops_external_probe_complete{component="canary"}'
        values: '0x32'
    alert_rule_test:
      - eval_time: 31m
        alertname: ExternalCoverageIncomplete
        exp_alerts:
          - exp_labels: {severity: warning, component: canary}
  - name: Stale public readiness and a retained failure stay visible
    interval: 1m
    input_series:
      - series: 'simplestchat_ops_external_probe_timestamp_seconds{component="availability"}'
        values: '0x32'
      - series: 'simplestchat_ops_external_check_failed{component="availability"}'
        values: '1x32'
    alert_rule_test:
      - eval_time: 31m
        alertname: ExternalChecksStale
        exp_alerts:
          - exp_labels: {severity: warning, component: availability}
      - eval_time: 31m
        alertname: ExternalCheckFailed
        exp_alerts:
          - exp_labels: {severity: warning, component: availability}
  - name: The transfer allowance warns at eighty percent and turns critical when spent
    interval: 30s
    input_series:
      - series: 'simplestchat_ops_transfer_allowance_bytes'
        values: '1000x8'
      - series: 'simplestchat_ops_transfer_period_tx_bytes'
        values: '700x4 900x4'
      - series: 'simplestchat_ops_transfer_period_rx_bytes'
        values: '150x8'
    alert_rule_test:
      - eval_time: 1m
        alertname: TransferAllowanceNearlyUsed
        exp_alerts:
          - exp_labels: {severity: warning}
      - eval_time: 1m
        alertname: TransferAllowanceExhausted
        exp_alerts: []
      - eval_time: 3m
        alertname: TransferAllowanceExhausted
        exp_alerts:
          - exp_labels: {severity: critical}
  - name: An unknown allowance never alerts
    interval: 30s
    input_series:
      - series: 'simplestchat_ops_transfer_allowance_bytes'
        values: '0x8'
      - series: 'simplestchat_ops_transfer_period_tx_bytes'
        values: '900x8'
      - series: 'simplestchat_ops_transfer_period_rx_bytes'
        values: '900x8'
    alert_rule_test:
      - eval_time: 2m
        alertname: TransferAllowanceNearlyUsed
        exp_alerts: []
