---
# Temporary same-origin DNS propagation bridge. Apply only to the frozen source
# inventory with the move's retained variables (scmig_run_id, scmig_ops_sha256) and
# explicit schandoff_source_ip, schandoff_target_ip, schandoff_domain and
# schandoff_ttl_seconds=7200. Never starts the old application/DB.
- name: Forward cached DNS traffic from one sealed migration source
  hosts: benchmark_hosts
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Require one explicitly selected source and a bounded migration handoff
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - ansible_play_hosts_all | length == 1
          - ansible_host == schandoff_source_ip
          - schandoff_source_ip != schandoff_target_ip
          - scmig_run_id is match('^[a-f0-9]{32}$')
          - scmig_ops_sha256 is match('^[a-f0-9]{64}$')
          - schandoff_domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          - schandoff_ttl_seconds | int == 7200
        fail_msg: Select only the sealed source with an exact migration ID and a two-hour handoff.
  tasks:
    - name: Require this move's authenticated executable before it runs
      ansible.builtin.include_tasks: tasks/migration-ops.yml

    - name: Validate the sealed source and start an independently expiring TLS forwarder
      ansible.builtin.command:
        argv:
          - "/srv/simplestchat-public/migrations/{{ scmig_run_id }}/simplestchat-ops"
          - migrate
          - handoff
          - "{{ scmig_run_id }}"
          - "{{ schandoff_source_ip }}"
          - "{{ schandoff_target_ip }}"
          - "{{ schandoff_domain }}"
          - "{{ schandoff_ttl_seconds }}"
      changed_when: true
