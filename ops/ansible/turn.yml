---
- name: Prepare or explicitly activate the public TURN relay
  hosts: benchmark_hosts
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require the explicitly enabled relay on a prepared public host
      tags: [always]
      ansible.builtin.assert:
        that:
          - scpub_enabled | bool
          - scpub_turn_enabled | bool
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - scpub_config == '/etc/simplestchat-public'
          - scpub_root == '/srv/simplestchat-public'
          - scpub_domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          - scpub_announce_ip is match('^[0-9]{1,3}(?:\.[0-9]{1,3}){3}$')
          - scpub_turn_image is match('^docker.io/coturn/coturn:4.18.0@sha256:[a-f0-9]{64}$')

    - name: Verify the public host without importing installed helpers
      tags: [always]
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/release_preflight.py', rstrip=false) }}"
          - '{}'
      changed_when: false
      check_mode: false

    - name: Require reviewed installed helpers and the selected relay identity before activation
      tags: [always]
      when: scpub_turn_activate | bool
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -c
          - |
            import hashlib, json, stat, sys
            from pathlib import Path
            expected = json.loads(sys.argv[1])
            for name, digest in expected.items():
                path = Path('/usr/local/libexec/simplestchat-public') / name
                metadata = path.lstat()
                assert stat.S_ISREG(metadata.st_mode) and metadata.st_uid == 0
                assert stat.S_IMODE(metadata.st_mode) == 0o644
                assert hashlib.sha256(path.read_bytes()).hexdigest() == digest, 'Installed relay helpers differ'
            selected = json.loads(Path('/etc/simplestchat-turn/settings.json').read_text())
            assert {key: selected[key] for key in ('domain', 'image')} == json.loads(sys.argv[2]), 'Selected relay identity differs'
          - >-
            {{ {
              'turn_public.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/turn_public.py', rstrip=false) | hash('sha256'),
              'release_public.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_public.py', rstrip=false) | hash('sha256'),
              'release_artifact.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_artifact.py', rstrip=false) | hash('sha256'),
              'release_json.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_json.py', rstrip=false) | hash('sha256')
            } | to_json }}
          - "{{ {'domain': scpub_domain, 'image': scpub_turn_image} | to_json }}"
      changed_when: false
      check_mode: false

  tasks:
    - name: Prepare the separately owned relay without advertising it to clients
      when: not scpub_turn_activate | bool
      block:
        - name: Require the relay project to be stopped before preparing its configuration
          ansible.builtin.command:
            argv: [docker, --host, 'unix:///var/run/docker.sock', ps, --quiet, --filter, 'label=com.docker.compose.project=simplestchat-turn']
          register: scpub_turn_running
          changed_when: false
          failed_when: scpub_turn_running.rc != 0 or scpub_turn_running.stdout | trim != ''
          check_mode: false

        - name: Validate a local public IPv4 address and free relay listeners
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import ipaddress, socket, sys
                address = ipaddress.IPv4Address(sys.argv[1])
                assert address.is_global, 'A local public IPv4 address is required'
                sockets = []
                try:
                    for kind, port in [(socket.SOCK_DGRAM, 3478), (socket.SOCK_STREAM, 3478), (socket.SOCK_STREAM, 5349)]:
                        value = socket.socket(socket.AF_INET, kind)
                        sockets.append(value)
                        value.bind((str(address), port))
                finally:
                    for value in sockets:
                        value.close()
              - "{{ scpub_announce_ip }}"
          changed_when: false
          check_mode: false

        - name: Create private relay configuration
          ansible.builtin.file:
            path: /etc/simplestchat-turn
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Create certificate storage readable only by the relay group
          ansible.builtin.file:
            path: /etc/simplestchat-turn/tls
            state: directory
            owner: root
            group: '10002'
            mode: '0750'

        - name: Generate a dedicated shared relay secret once
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import os, re, secrets, stat
                from pathlib import Path
                path = Path('/etc/simplestchat-turn/secret')
                if path.exists() or path.is_symlink():
                    metadata = path.lstat()
                    assert stat.S_ISREG(metadata.st_mode) and metadata.st_uid == 0
                    assert stat.S_IMODE(metadata.st_mode) == 0o600 and metadata.st_size == 64
                    assert re.fullmatch('[a-f0-9]{64}', path.read_text())
                    print('retained')
                else:
                    with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as output:
                        output.write(secrets.token_hex(32))
                    print('created')
          register: scpub_turn_secret_created
          changed_when: scpub_turn_secret_created.stdout == 'created'
          when: not ansible_check_mode

        - name: Read the private relay secret without logging it
          ansible.builtin.slurp:
            src: /etc/simplestchat-turn/secret
          register: scpub_turn_secret_file
          no_log: true

        - name: Select the relay secret only for private template rendering
          ansible.builtin.set_fact:
            scpub_turn_secret: "{{ scpub_turn_secret_file.content | b64decode }}"
            cacheable: false
          no_log: true

        - name: Render the protected relay configuration
          ansible.builtin.template:
            src: turnserver.conf.j2
            dest: /etc/simplestchat-turn/turnserver.conf
            owner: root
            group: '10002'
            mode: '0440'
          no_log: true

        - name: Render the separate relay project
          ansible.builtin.template:
            src: turn-compose.yml.j2
            dest: /etc/simplestchat-turn/compose.yml
            owner: root
            group: root
            mode: '0600'

        - name: Read the exact prepared relay configuration digest
          ansible.builtin.stat:
            path: /etc/simplestchat-turn/turnserver.conf
            checksum_algorithm: sha256
          register: scpub_turn_configuration
          no_log: true

        - name: Record the non-secret relay identity
          ansible.builtin.copy:
            content: "{{ {'domain': scpub_domain, 'image': scpub_turn_image, 'configurationSha256': scpub_turn_configuration.stat.checksum} | to_nice_json }}"
            dest: /etc/simplestchat-turn/settings.json
            owner: root
            group: root
            mode: '0600'

        - name: Install the reviewed relay and release implementations
          ansible.builtin.copy:
            src: "{{ item }}"
            dest: "/usr/local/libexec/simplestchat-public/{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop: [turn_public.py, release_public.py, release_artifact.py, release_json.py]

        - name: Prepare a verified copy of the current Caddy certificate
          ansible.builtin.command:
            argv: [/usr/bin/python3, -B, /usr/local/libexec/simplestchat-public/turn_public.py, prepare-certificate]
          changed_when: true

        - name: Pull the checksum-pinned coturn image without building on the VPS
          ansible.builtin.command:
            argv: [timeout, '300', docker, --host, 'unix:///var/run/docker.sock', pull, "{{ scpub_turn_image }}"]
          changed_when: true

        - name: Start only the relay after configuration and certificate validation
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - unix:///var/run/docker.sock
              - compose
              - --project-name
              - simplestchat-turn
              - --project-directory
              - /etc/simplestchat-turn
              - -f
              - /etc/simplestchat-turn/compose.yml
              - up
              - --detach
              - --no-build
              - --pull
              - never
          changed_when: true
          timeout: 180

        - name: Verify trusted relay TLS before scheduling certificate maintenance
          ansible.builtin.command:
            argv: [/usr/bin/python3, -B, /usr/local/libexec/simplestchat-public/turn_public.py, refresh-certificate]
          changed_when: true

        - name: Install hourly certificate maintenance
          ansible.builtin.template:
            src: "turn-certificate.{{ item }}.j2"
            dest: "/etc/systemd/system/simplestchat-turn-certificate.{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop: [service, timer]

        - name: Enable the certificate renewal timer
          ansible.builtin.systemd_service:
            name: simplestchat-turn-certificate.timer
            daemon_reload: true
            enabled: true
            state: started

    - name: Activate the externally verified relay with bounded application rollback
      when: scpub_turn_activate | bool
      ansible.builtin.command:
        argv:
          - systemd-run
          - --wait
          - --collect
          - --unit=simplestchat-turn-activate
          - --property=Type=exec
          - --property=RuntimeMaxSec=900
          - --property=TimeoutStopSec=90
          - /usr/bin/python3
          - -B
          - /usr/local/libexec/simplestchat-public/turn_public.py
          - activate
      changed_when: true
      timeout: 1050
