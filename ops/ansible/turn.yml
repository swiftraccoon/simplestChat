---
- name: Prepare or explicitly activate the public TURN relay
  hosts: benchmark_hosts
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require the explicitly enabled relay on a prepared public host
      tags: [always]
      ansible.builtin.assert:
        that:
          - scpub_enabled | bool
          - scpub_turn_enabled | bool
          - ansible_facts.distribution == 'Debian'
          - ansible_facts.distribution_major_version == '13'
          - ansible_facts.architecture == 'x86_64'
          - scpub_config == '/etc/simplestchat-public'
          - scpub_root == '/srv/simplestchat-public'
          - scpub_domain is match('^(?:[a-z0-9](?:[a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$')
          - scpub_announce_ip is match('^[0-9]{1,3}(?:\.[0-9]{1,3}){3}$')
          - scpub_announce_ipv6 == '' or scpub_announce_ipv6 is match('^[0-9a-f:]{3,39}$')
          - scpub_turn_image is match('^docker.io/coturn/coturn:4.18.0@sha256:[a-f0-9]{64}$')
        fail_msg: >-
          The managed relay requires a public IPv4 primary address; an additional IPv6
          listener is supported, but IPv6-only TURN preparation and activation are not.

    - name: Look for the installed Ops executable without following links
      tags: [always]
      ansible.builtin.stat:
        path: /usr/local/libexec/simplestchat-public/simplestchat-ops
        follow: false
        get_checksum: false
      register: scpub_turn_ops

    - name: Require the Ops executable a signed release delivers
      tags: [always]
      ansible.builtin.assert:
        that:
          - scpub_turn_ops.stat.exists
          - scpub_turn_ops.stat.isreg
          - scpub_turn_ops.stat.uid == 0
          - scpub_turn_ops.stat.mode == '0755'
        fail_msg: >-
          Deliver the signed Ops executable first: run release.yml for a signed
          revision (staging alone is enough), then repeat this playbook.

    - name: Verify the prepared public host before any relay step
      tags: [always]
      ansible.builtin.command:
        argv: [/usr/local/libexec/simplestchat-public/simplestchat-ops, release, preflight]
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: false
      check_mode: false

    - name: Read the selected relay identity before activation
      tags: [always]
      when: scpub_turn_activate | bool
      ansible.builtin.slurp:
        src: /etc/simplestchat-turn/settings.json
      register: scpub_turn_selected

    - name: Require the selected relay identity before activation
      tags: [always]
      when: scpub_turn_activate | bool
      ansible.builtin.assert:
        that:
          - (scpub_turn_selected.content | b64decode | from_json).domain == scpub_domain
          - (scpub_turn_selected.content | b64decode | from_json).image == scpub_turn_image
        fail_msg: Selected relay identity differs

  tasks:
    - name: Prepare the separately owned relay without advertising it to clients
      when: not scpub_turn_activate | bool
      block:
        - name: Require the relay project to be stopped before preparing its configuration
          ansible.builtin.command:
            argv: [docker, --host, 'unix:///var/run/docker.sock', ps, --quiet, --filter, 'label=com.docker.compose.project=simplestchat-turn']
          register: scpub_turn_running
          changed_when: false
          failed_when: scpub_turn_running.rc != 0 or scpub_turn_running.stdout | trim != ''
          check_mode: false

        - name: Validate a local public IPv4 address and free relay listeners
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import ipaddress, socket, sys
                address = ipaddress.IPv4Address(sys.argv[1])
                if not (address.is_global):
                    raise SystemExit('A local public IPv4 address is required')
                sockets = []
                try:
                    for kind, port in [(socket.SOCK_DGRAM, 3478), (socket.SOCK_STREAM, 3478), (socket.SOCK_STREAM, 5349)]:
                        value = socket.socket(socket.AF_INET, kind)
                        sockets.append(value)
                        value.bind((str(address), port))
                finally:
                    for value in sockets:
                        value.close()
              - "{{ scpub_announce_ip }}"
          changed_when: false
          check_mode: false

        - name: Create private relay configuration
          ansible.builtin.file:
            path: /etc/simplestchat-turn
            state: directory
            owner: root
            group: root
            mode: '0700'

        - name: Create certificate storage readable only by the relay group
          ansible.builtin.file:
            path: /etc/simplestchat-turn/tls
            state: directory
            owner: root
            group: '10002'
            mode: '0750'

        - name: Generate a dedicated shared relay secret once
          ansible.builtin.command:
            argv:
              - /usr/bin/python3
              - -c
              - |
                import os, re, secrets, stat
                from pathlib import Path
                path = Path('/etc/simplestchat-turn/secret')
                if path.exists() or path.is_symlink():
                    metadata = path.lstat()
                    if not (stat.S_ISREG(metadata.st_mode) and metadata.st_uid == 0):
                        raise SystemExit('Operational precondition failed')
                    if not (stat.S_IMODE(metadata.st_mode) == 0o600 and metadata.st_size == 64):
                        raise SystemExit('Operational precondition failed')
                    if not (re.fullmatch('[a-f0-9]{64}', path.read_text())):
                        raise SystemExit('Operational precondition failed')
                    print('retained')
                else:
                    with os.fdopen(os.open(path, os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600), 'w') as output:
                        output.write(secrets.token_hex(32))
                    print('created')
          register: scpub_turn_secret_created
          changed_when: scpub_turn_secret_created.stdout == 'created'
          when: not ansible_check_mode

        - name: Read the private relay secret without logging it
          ansible.builtin.slurp:
            src: /etc/simplestchat-turn/secret
          register: scpub_turn_secret_file
          no_log: true

        - name: Select the relay secret only for private template rendering
          ansible.builtin.set_fact:
            scpub_turn_secret: "{{ scpub_turn_secret_file.content | b64decode }}"
            cacheable: false
          no_log: true

        - name: Render the protected relay configuration
          ansible.builtin.template:
            src: turnserver.conf.j2
            dest: /etc/simplestchat-turn/turnserver.conf
            owner: root
            group: '10002'
            mode: '0440'
          no_log: true

        - name: Render the separate relay project
          ansible.builtin.template:
            src: turn-compose.yml.j2
            dest: /etc/simplestchat-turn/compose.yml
            owner: root
            group: root
            mode: '0600'

        - name: Read the exact prepared relay configuration digest
          ansible.builtin.stat:
            path: /etc/simplestchat-turn/turnserver.conf
            checksum_algorithm: sha256
          register: scpub_turn_configuration
          no_log: true

        - name: Record the non-secret relay identity
          ansible.builtin.copy:
            content: "{{ {'domain': scpub_domain, 'image': scpub_turn_image, 'configurationSha256': scpub_turn_configuration.stat.checksum} | to_nice_json }}"
            dest: /etc/simplestchat-turn/settings.json
            owner: root
            group: root
            mode: '0600'

        - name: Prepare a verified copy of the current Caddy certificate
          ansible.builtin.command:
            argv: [/usr/local/libexec/simplestchat-public/simplestchat-ops, turn, prepare-certificate]
          environment:
            PATH: /usr/sbin:/usr/bin:/sbin:/bin
            GH_TOKEN: ''
            GITHUB_TOKEN: ''
          changed_when: true

        - name: Pull the checksum-pinned coturn image without building on the VPS
          ansible.builtin.command:
            argv: [timeout, '300', docker, --host, 'unix:///var/run/docker.sock', pull, "{{ scpub_turn_image }}"]
          changed_when: true

        - name: Start only the relay after configuration and certificate validation
          ansible.builtin.command:
            argv:
              - docker
              - --host
              - unix:///var/run/docker.sock
              - compose
              - --project-name
              - simplestchat-turn
              - --project-directory
              - /etc/simplestchat-turn
              - -f
              - /etc/simplestchat-turn/compose.yml
              - up
              - --detach
              - --no-build
              - --pull
              - never
          changed_when: true
          timeout: 180

        - name: Verify trusted relay TLS before scheduling certificate maintenance
          ansible.builtin.command:
            argv: >-
              {{ ['/usr/local/libexec/simplestchat-public/simplestchat-ops', 'turn', 'refresh-certificate'] +
                 (['--verify-address', scpub_turn_verify_address]
                  if scpub_turn_verify_address | default('') | length > 0 else []) }}
          environment:
            PATH: /usr/sbin:/usr/bin:/sbin:/bin
            GH_TOKEN: ''
            GITHUB_TOKEN: ''
          changed_when: true

        - name: Install hourly certificate maintenance
          ansible.builtin.template:
            src: "turn-certificate.{{ item }}.j2"
            dest: "/etc/systemd/system/simplestchat-turn-certificate.{{ item }}"
            owner: root
            group: root
            mode: '0644'
          loop: [service, timer]

        - name: Enable the certificate renewal timer
          ansible.builtin.systemd_service:
            name: simplestchat-turn-certificate.timer
            daemon_reload: true
            enabled: true
            state: started

    # The certificate is refreshed and the relay verified first; the
    # application is then restarted as the release it already runs, with its
    # backup, its bounded wait for rooms to empty and its one rollback.
    - name: Activate the externally verified relay with bounded application rollback
      when: scpub_turn_activate | bool
      ansible.builtin.command:
        argv: >-
          {{ ['systemd-run', '--wait', '--collect', '--unit=simplestchat-turn-activate',
              '--property=Type=exec', '--property=RuntimeMaxSec=1980', '--property=TimeoutStopSec=240',
              '/usr/local/libexec/simplestchat-public/simplestchat-ops', 'turn', 'activate'] +
             (['--verify-address', scpub_turn_verify_address]
              if scpub_turn_verify_address | default('') | length > 0 else []) }}
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: true
      timeout: 2280
