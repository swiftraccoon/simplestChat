---
- name: Stage a prebuilt production release without host maintenance
  hosts: benchmark_hosts
  become: true
  gather_facts: false
  serial: 1
  vars:
    ansible_pipelining: true
  pre_tasks:
    - name: Require an explicitly selected artifact and prepared public host
      ansible.builtin.assert:
        that:
          - scpub_enabled | bool
          - scpub_release_directory is not defined
          - scpub_release_artifact_id is defined
          - scpub_config == '/etc/simplestchat-public'
          - scpub_root == '/srv/simplestchat-public'
        fail_msg: Select a signed main-push GitHub artifact and an already provisioned public host; unsigned local releases are not accepted.

    - name: Require an exact GitHub source and supported key-based SSH connection
      ansible.builtin.assert:
        that:
          - scpub_release_repository is defined
          - scpub_release_repository is match('^[A-Za-z0-9][A-Za-z0-9-]*/[A-Za-z0-9_.-]+$')
          - scpub_release_artifact_id | string is match('^[1-9][0-9]*$')
          - scpub_release_expected_revision is defined
          - scpub_release_expected_revision is match('^[a-f0-9]{40}$')
          - scpub_release_ci_run is defined
          - scpub_release_ci_run | string is match('^[1-9][0-9]*$')
          - ansible_connection | default('ssh') == 'ssh'
          - ansible_host is defined
          - ansible_host is string
          - ansible_host is match('^[A-Za-z0-9][A-Za-z0-9._-]*$')
          - ansible_user is defined
          - ansible_user is string
          - ansible_user | length > 0
          - ansible_ssh_private_key_file is defined
          - ansible_ssh_private_key_file is match('^/')
          - ansible_port | default(22) | string is match('^[1-9][0-9]*$')
          - ansible_port | default(22) | int <= 65535
          - ansible_password is not defined
          - ansible_ssh_pass is not defined
          - ansible_ssh_password is not defined
          - ansible_become_password is not defined
          - ansible_become_pass is not defined
          - ansible_ssh_common_args | default('') | length == 0
          - ansible_ssh_extra_args | default('') | length == 0
        fail_msg: >-
          GitHub fetching requires exact repository/artifact/revision/CI identities and direct OpenSSH
          with an explicit host, user, absolute private key, and root or passwordless sudo.
      when: scpub_release_artifact_id is defined

    - name: Verify the signed release on the controller before any remote preflight
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -B
          - "{{ playbook_dir }}/../../build/verify-release.py"
          - --repository
          - "{{ scpub_release_repository }}"
          - --artifact-id
          - "{{ scpub_release_artifact_id }}"
          - --revision
          - "{{ scpub_release_expected_revision }}"
          - --ci-run
          - "{{ scpub_release_ci_run }}"
          - --artifact-dir
          - "{{ scpub_release_verified_directory | default('') }}"
          - --output-parent
          - "{{ (playbook_dir ~ '/../../results') | realpath }}"
      delegate_to: localhost
      become: false
      register: scpub_validated_release
      changed_when: false
      check_mode: false
      timeout: 660

    - name: Select the explicitly pinned GitHub revision
      ansible.builtin.set_fact:
        scpub_release_revision: "{{ scpub_release_expected_revision }}"
      when: scpub_release_artifact_id is defined

    - name: Verify the host and exact prepared helpers without broad fact gathering
      ansible.builtin.command:
        argv:
          - /usr/bin/python3
          - -B
          - -c
          - "{{ lookup('ansible.builtin.file', playbook_dir ~ '/files/release_preflight.py', rstrip=false) }}"
          - >-
            {{ (({
              'release-public.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release-public.py', rstrip=false) | hash('sha256'),
              'bounded_process.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/bounded_process.py', rstrip=false) | hash('sha256'),
              'release_public.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_public.py', rstrip=false) | hash('sha256'),
              'release_artifact.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_artifact.py', rstrip=false) | hash('sha256'),
              'release_json.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_json.py', rstrip=false) | hash('sha256'),
              'reboot-public.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/reboot-public.py', rstrip=false) | hash('sha256'),
              'reboot_public.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/reboot_public.py', rstrip=false) | hash('sha256')
            } | combine(({
              'release_trust.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_trust.py', rstrip=false) | hash('sha256'),
              'fetch-release.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/fetch-release.py', rstrip=false) | hash('sha256'),
              'release_fetch_receiver.py': lookup('ansible.builtin.file', playbook_dir ~ '/files/release_fetch_receiver.py', rstrip=false) | hash('sha256')
            }) if scpub_release_artifact_id is defined else {}))
            if scpub_release_prepared | default(false) | bool else {}) | to_json }}
      vars:
        ansible_python_interpreter: /usr/bin/python3
      register: scpub_release_preflight
      changed_when: false
      check_mode: false
      timeout: 60

    - name: Require a fresh facts-free release unit identity
      ansible.builtin.assert:
        that:
          - (scpub_release_preflight.stdout | from_json).schemaVersion == 1
          - (scpub_release_preflight.stdout | from_json).runId is match('^[a-f0-9]{32}$')

  tasks:
    - name: Install the isolated release helper directory
      ansible.builtin.file:
        path: /usr/local/libexec/simplestchat-public
        state: directory
        owner: root
        group: root
        mode: '0755'
      when: not (scpub_release_prepared | default(false) | bool)

    - name: Install the release command and shared artifact validator
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/libexec/simplestchat-public/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - bounded_process.py
        - release-public.py
        - release_public.py
        - release_artifact.py
        - release_json.py
        - reboot-public.py
        - reboot_public.py
      when: not (scpub_release_prepared | default(false) | bool)

    - name: Install the bounded GitHub artifact receiver
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/usr/local/libexec/simplestchat-public/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop: [fetch-release.py, release_fetch_receiver.py, release_trust.py]
      when:
        - scpub_release_artifact_id is defined
        - not (scpub_release_prepared | default(false) | bool)

    - name: Create private immutable release storage
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - "{{ scpub_root }}/releases"
        - "{{ scpub_root }}/releases/{{ scpub_release_revision }}"
      when: not (scpub_release_prepared | default(false) | bool)

    - name: Verify the exact GitHub release and fetch it directly onto the prepared host
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - -B
          - "{{ playbook_dir }}/../../build/fetch-release.py"
          - --repository
          - "{{ scpub_release_repository }}"
          - --artifact-id
          - "{{ scpub_release_artifact_id }}"
          - --revision
          - "{{ scpub_release_revision }}"
          - --ci-run
          - "{{ scpub_release_ci_run }}"
          - --host
          - "{{ ansible_host }}"
          - --user
          - "{{ ansible_user }}"
          - --port
          - "{{ ansible_port | default(22) }}"
          - --identity
          - "{{ ansible_ssh_private_key_file }}"
          - --output-parent
          - "{{ (playbook_dir ~ '/../../results') | realpath }}"
          - --verified-directory
          - "{{ (scpub_validated_release.stdout | from_json).directory }}"
      delegate_to: localhost
      become: false
      changed_when: true
      timeout: 1080
      when:
        - not ansible_check_mode
        - scpub_release_artifact_id is defined

    - name: Import and verify the image while the public service remains running
      vars:
        ansible_python_interpreter: /usr/bin/python3
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit=simplestchat-stage-{{ scpub_release_revision[:12] }}-{{ (scpub_release_preflight.stdout | from_json).runId }}"
          - --property=Type=exec
          - --property=RuntimeMaxSec=600
          - --property=TimeoutStopSec=60
          - --wait
          - /usr/bin/python3
          - -B
          - /usr/local/libexec/simplestchat-public/release-public.py
          - stage
          - "{{ scpub_release_revision }}"
      changed_when: true
      when: not ansible_check_mode

    - name: Replace only the application when deployment was explicitly selected
      vars:
        ansible_python_interpreter: /usr/bin/python3
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit=simplestchat-release-{{ scpub_release_revision[:12] }}-{{ (scpub_release_preflight.stdout | from_json).runId }}"
          - --property=Type=exec
          - --property=RuntimeMaxSec=1800
          - --property=TimeoutStopSec=240
          - --wait
          - /usr/bin/python3
          - -B
          - /usr/local/libexec/simplestchat-public/release-public.py
          - deploy
          - "{{ scpub_release_revision }}"
          - --quiet-seconds
          - "{{ scpub_release_quiet_seconds | default(600) | int }}"
      changed_when: true
      when:
        - not ansible_check_mode
        - scpub_release_deploy | default(false) | bool
