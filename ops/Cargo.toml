[package]
name = "simplestchat-ops"
description = "Bounded local operations policy and unsigned artifact tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
getrandom = "=0.4.3"
httparse = "=1.10.1"
nix = { version = "0.31.3", default-features = false, features = ["fs", "process", "signal"] }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
rawzip = "=0.5.2"
regex-syntax = "0.8.11"
rustix = { version = "1.1.5", default-features = false, features = ["event", "fs", "process", "rand", "std", "system", "time"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
simplestchat-load-test = { path = "../load_tests", default-features = false, features = ["capacity-runtime"] }
tar = { version = "=0.4.46", default-features = false }

tokio = { version = "1.53.2", default-features = false, features = [
    "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time",
] }
