[package]
name = "simplestchat-ops"
description = "Bounded, read-only operations policy tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
nix = { version = "0.31.3", default-features = false, features = ["fs"] }
object = { version = "=0.40.0", default-features = false, features = ["read_core", "elf", "std"] }
regex-syntax = "0.8.11"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
tar = { version = "=0.4.46", default-features = false }
