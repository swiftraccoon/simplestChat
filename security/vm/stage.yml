---
# The disposable guest stages the controller-authenticated release with the production
# `release stage` of the signed executable the delivery playbook installed; only the
# guest binding, the transfer and the guest checks' inputs are fixture steps.
- name: Stage the signed release through the production command inside the disposable VM fixture
  hosts: benchmark_hosts
  become: true
  gather_facts: false
  pre_tasks:
    - name: Require the generated fixture identity, its release and loopback-only transport
      ansible.builtin.assert:
        that:
          - inventory_hostname == 'vmfixture'
          - ansible_host == '127.0.0.1'
          - vm_fixture_run_id is match('^[a-f0-9]{32}$')
          - scbench_revision is match('^[a-f0-9]{40}$')
          - vm_fixture_revision == scbench_revision
          - vm_fixture_artifact_dir is match('^/')

    - name: Inspect the cloud-init fixture marker without exposing its contents
      ansible.builtin.slurp:
        src: /etc/simplestchat-vm-fixture
      register: vm_fixture_marker
      no_log: true

    - name: Require this exact owned guest
      ansible.builtin.assert:
        that:
          - vm_fixture_marker.content | b64decode | trim == vm_fixture_run_id
      no_log: true

  tasks:
    - name: Create the private fixture and canonical release directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: root
        group: root
        mode: '0700'
      loop:
        - /root/simplestchat-vm-fixture
        - /etc/simplestchat-public
        - /srv/simplestchat-public
        - /srv/simplestchat-public/results
        - /srv/simplestchat-public/releases
        - "/srv/simplestchat-public/releases/{{ scbench_revision }}"

    - name: Require the root-controlled executable directory the delivery provisioned
      ansible.builtin.file:
        path: /usr/local/libexec/simplestchat-public
        state: directory
        owner: root
        group: root
        mode: '0755'

    # The monitoring and offsite playbooks install these on a real host; the guest's
    # database and restore checks run them.
    - name: Install the reviewed SQL the guest checks run
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../ops/ansible/files/{{ item }}"
        dest: "/usr/local/libexec/simplestchat-public/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - restore-verify.sql
        - monitoring-schema.sql

    - name: Bind guest assertions to this run and release revision
      ansible.builtin.copy:
        content: "{{ {'schemaVersion': 1, 'runId': vm_fixture_run_id, 'revision': scbench_revision} | to_json }}\n"
        dest: /root/simplestchat-vm-fixture/selection.json
        owner: root
        group: root
        mode: '0600'

    - name: Transfer only the authenticated release manifest and image archive
      ansible.builtin.copy:
        src: "{{ vm_fixture_artifact_dir }}/{{ item }}"
        dest: "/srv/simplestchat-public/releases/{{ scbench_revision }}/{{ item }}"
        owner: root
        group: root
        mode: '0600'
      loop: [release.json, image.tar]

    - name: Import and verify the image through the delivered Ops executable
      ansible.builtin.command:
        argv:
          - systemd-run
          - "--unit=simplestchat-stage-{{ scbench_revision[:12] }}-{{ vm_fixture_run_id }}"
          - --property=Type=exec
          - --property=RuntimeMaxSec=600
          - --property=TimeoutStopSec=60
          - --wait
          - /usr/local/libexec/simplestchat-public/simplestchat-ops
          - release
          - stage
          - --revision
          - "{{ scbench_revision }}"
          - --timeout-seconds
          - '600'
          - --finalization-seconds
          - '60'
      environment:
        PATH: /usr/sbin:/usr/bin:/sbin:/bin
        GH_TOKEN: ''
        GITHUB_TOKEN: ''
      changed_when: true
