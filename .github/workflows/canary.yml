name: Canary

# Two owned headless Chromium clients join a dedicated canary room on the
# public deployment: one publishes a fake camera and microphone, the other
# measures what it receives (decoded frame rate, loss, retransmissions, the
# simulcast layer delivered). Nothing here trusts a user's browser; the
# clients are ours. Set the CANARY_ORIGIN and CANARY_ROOM repository
# variables to enable it; the room should exist for this purpose only, since
# the publisher's fake video is visible to anyone in it.

on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-media-canary
  cancel-in-progress: false

jobs:
  canary:
    name: Owned browsers against the public deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check configuration
        id: configured
        env:
          CANARY_ORIGIN: ${{ vars.CANARY_ORIGIN }}
          CANARY_ROOM: ${{ vars.CANARY_ROOM }}
        run: |
          if [ -z "${CANARY_ORIGIN}" ] || [ -z "${CANARY_ROOM}" ]; then
            echo "::error::Canary is not monitored: CANARY_ORIGIN and CANARY_ROOM are required."
            exit 1
          else
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.configured.outputs.enabled == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.configured.outputs.enabled == 'true'
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Install pinned browser tooling
        id: tooling
        if: steps.configured.outputs.enabled == 'true'
        run: |
          npm --prefix web/e2e ci --ignore-scripts
          npm --prefix web/e2e exec -- playwright install --with-deps chromium

      - name: Publish and receive in the canary room
        if: steps.configured.outputs.enabled == 'true'
        env:
          BASE_URL: ${{ vars.CANARY_ORIGIN }}
          IMPAIRED_ROOM: ${{ vars.CANARY_ROOM }}
          IMPAIRED_PROFILES: baseline
          CANARY_MODE: '1'
          IMPAIR_SCRIPT: none
          E2E_ARTIFACTS: ${{ runner.temp }}/canary/direct
        run: node web/e2e/impaired-network.cjs

      - name: Require decoded media through TURN
        if: ${{ !cancelled() && steps.configured.outputs.enabled == 'true' && steps.tooling.outcome == 'success' }}
        env:
          BASE_URL: ${{ vars.CANARY_ORIGIN }}
          IMPAIRED_ROOM: ${{ vars.CANARY_ROOM }}
          IMPAIRED_PROFILES: baseline
          CANARY_MODE: '1'
          IMPAIR_SCRIPT: none
          CANARY_FORCE_RELAY: '1'
          E2E_ARTIFACTS: ${{ runner.temp }}/canary/relay
        run: node web/e2e/impaired-network.cjs

      - name: Retain the canary evidence
        if: ${{ !cancelled() && steps.configured.outputs.enabled == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-${{ github.run_id }}
          path: ${{ runner.temp }}/canary
          if-no-files-found: warn
          retention-days: 30
