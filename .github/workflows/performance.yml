name: Performance

# Weekly comparisons, impairment and session continuity; the thirty-account
# operating point is manual only. Co-located hosted resources are not a
# production capacity guarantee; see docs/performance.md.
on:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:
    inputs:
      baseline:
        description: Git ref the candidate (this commit) is measured against
        default: HEAD~1
        type: string
      clients:
        description: Clients per workload (30 and 100 use the four-room ring graph)
        default: '10'
        type: choice
        options: ['10', '30', '100']
      workers:
        description: Media workers for both servers
        default: '1'
        type: choice
        options: ['1', '2']
      only:
        description: Run one workload; account-room is an explicit manual experiment
        default: all
        type: choice
        options: [all, compare, soak, impaired, account-room]
      field_trials:
        description: LIBWEBRTC_FIELD_TRIALS for the impaired job's server (empty keeps mediasoup's default)
        default: ''
        type: string
      min_outgoing_bitrate:
        description: WEBRTC_MIN_OUTGOING_BITRATE for the impaired job's server in bit/s (empty keeps the application default; 0 keeps mediasoup's floor)
        default: ''
        type: string

permissions:
  contents: read

env:
  OPENSSL_DIR: ${{ github.workspace }}/target/openssl-4.0.3
  AWS_LC_SYS_SYSTEM_DIR: ${{ github.workspace }}/target/aws-lc-5.11.0
  AWS_LC_SYS_STATIC: '1'
  AWS_LC_SYS_SYSTEM_SKIP_VERSION_CHECK: '0'
  PKG_CONFIG_PATH: ${{ github.workspace }}/target/openssl-4.0.3/lib/pkgconfig

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.only }}-${{ inputs.workers }}-${{ inputs.clients }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compare:
    name: Baseline versus candidate on one hosted runner
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'compare' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-release-benchmark

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0

      - name: Install checksum-pinned npm
        working-directory: ${{ github.workspace }}
        run: |
          node build/install-npm.mjs "$RUNNER_TEMP/simplestchat-npm-12.2.0"
          cargo run --locked -q -p xtask -- ci npm-path

      # The owner preserves the detached baseline's cwd and shared dependency
      # target, then settles all six local runs before removing its worktree.
      - name: Build and compare the baseline and candidate
        env:
          BASELINE_REF: ${{ inputs.baseline || 'HEAD~1' }}
          CLIENTS: ${{ inputs.clients || '10' }}
          WORKERS: ${{ inputs.workers || '1' }}
        run: cargo run --locked -q -p xtask -- ci performance-compare

      - name: Evaluate the regression budget
        if: ${{ !cancelled() }}
        run: cargo run --locked -q -p xtask -- performance-thresholds "${RUNNER_TEMP}/comparison/comparison.json"

      - name: Retain the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: performance-comparison-${{ github.run_id }}
          path: ${{ runner.temp }}/comparison
          if-no-files-found: warn
          retention-days: 30

  impaired:
    name: Adaptive path under an impaired downlink
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'impaired' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
      LIBWEBRTC_FIELD_TRIALS: ${{ inputs.field_trials }}
      WEBRTC_MIN_OUTGOING_BITRATE: ${{ inputs.min_outgoing_bitrate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-release-benchmark

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      - name: Install checksum-pinned npm
        working-directory: ${{ github.workspace }}
        run: |
          node build/install-npm.mjs "$RUNNER_TEMP/simplestchat-npm-12.2.0"
          cargo run --locked -q -p xtask -- ci npm-path

      - name: Build the server and the generator
        run: |
          cargo build --locked --release --bin simplestChat
          cargo build --locked --release -p simplestchat-load-test --bin load_test

      - name: Build UI and install pinned browser tooling
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          npm --prefix web/e2e ci --ignore-scripts
          npm --prefix web/e2e exec -- playwright install --with-deps chromium

      # netem on loopback, UDP from the server's media port only: the viewer's
      # downlink degrades while signaling and the publisher's uplink stay clean.
      - name: Browser viewer under loss, a bandwidth cap and recovery
        shell: bash
        run: ./target/release/load_test bench browser-adaptive --output "${RUNNER_TEMP}/impaired/browser"

      # The generator's exact-delivery gates describe a lossless loopback; under
      # impairment its reports are evidence and the step passes when the run
      # completes and the server exits cleanly.
      # A silent microphone with Opus DTX negotiated must send a few packets a
      # second, not fifty; the viewer's audio packet rate proves it end to end.
      - name: Silent microphone sends almost nothing with DTX
        env:
          IMPAIRED_SILENT_AUDIO: "1"
        run: ./target/release/load_test bench browser-mechanics --output "${RUNNER_TEMP}/impaired/dtx"

      # UDP to and from the media port is dropped before anyone joins, so the
      # publisher and the viewer can only connect over the server's ICE-TCP
      # candidates; both transports must report a TCP pair and video must flow.
      - name: Clients connect over ICE-TCP when UDP is blocked
        env:
          IMPAIRED_BLOCK_UDP: "1"
          WEBRTC_SERVER_TCP: "true"
        run: ./target/release/load_test bench browser-tcp --output "${RUNNER_TEMP}/impaired/tcp"

      - name: Generator under five percent loss with jitter, both directions
        run: ./target/release/load_test bench impaired --output "${RUNNER_TEMP}/impaired/generator"

      - name: Retain the impaired-network evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: impaired-network-${{ github.run_id }}
          path: ${{ runner.temp }}/impaired
          if-no-files-found: warn
          retention-days: 30

  soak:
    name: Session soak with a database restart
    if: ${{ !inputs.only || inputs.only == 'all' || inputs.only == 'soak' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        # Official image, pinned to the verified PostgreSQL 18.6 manifest.
        image: docker.io/library/postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: simplestchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_owner -d simplestchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
      DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      TEST_DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      DISPOSABLE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-build

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      - name: Install checksum-pinned npm
        working-directory: ${{ github.workspace }}
        run: |
          node build/install-npm.mjs "$RUNNER_TEMP/simplestchat-npm-12.2.0"
          cargo run --locked -q -p xtask -- ci npm-path

      - name: Build server and load generator
        run: cargo build --locked --workspace --bins

      - name: Build UI and install pinned browser tooling
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          npm --prefix web/e2e ci --ignore-scripts
          npm --prefix web/e2e exec -- playwright install --with-deps chromium

      - name: Migrate disposable test database with the real server
        run: cargo run --locked -q -p xtask -- test-server true

      # The twenty-minute soak covers a real token refresh and expiry. Stopping
      # PostgreSQL for eight seconds at the midpoint exercises the bounded
      # credential-uncertainty allowance (revalidation every 5 s, 15 s of
      # tolerated unavailability): at least one revalidation must fail and the
      # sessions must survive it without a rejoin. A plain `docker restart`
      # completes in under a second and no query falls into that window.
      - name: Soak twenty minutes and stop PostgreSQL for eight seconds at the midpoint
        timeout-minutes: 40
        shell: bash
        env:
          SESSION_SOAK_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/session-soak
          SERVER_REVISION: ${{ github.sha }}
          FRONTEND_REVISION: ${{ github.sha }}
          SOAK_POSTGRES_ID: ${{ job.services.postgres.id }}
          SOAK_POSTGRES_NETWORK: ${{ job.services.postgres.network }}
          SOAK_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
        run: cargo run --locked -q -p xtask -- ci session-soak

      - name: Preserve soak diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: session-soak-${{ github.run_id }}
          path: ${{ runner.temp }}/session-soak
          if-no-files-found: ignore
          retention-days: 30

  account-room:
    name: Thirty authenticated participants with retained chat
    # This experiment is an explicit operating point, outside scheduled and push gates.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.only == 'account-room' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: docker.io/library/postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: simplestchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_owner -d simplestchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
      DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      TEST_DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      DISPOSABLE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-release-benchmark

      - name: Require the hosted PostgreSQL query client
        run: command -v psql

      - name: Build the exact server and authenticated generator
        run: cargo build --locked --release --workspace --bins

      - name: Measure the fixed thirty-account room for twenty minutes
        timeout-minutes: 35
        env:
          ACCOUNT_ROOM_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/account-room
          SERVER_REVISION: ${{ github.sha }}
          TEST_SERVER_BINARY: ${{ github.workspace }}/target/release/simplestChat
          TEST_GENERATOR_BINARY: ${{ github.workspace }}/target/release/load_test
        run: ./target/release/load_test bench account-room

      - name: Preserve bounded account-room evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: account-room-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/account-room/account-room-report.json
            ${{ runner.temp }}/account-room/resource-samples.ndjson
            ${{ runner.temp }}/account-room/server-shutdown.json
            ${{ runner.temp }}/account-room/generator/load_test_summary.json
            ${{ runner.temp }}/account-room/generator/load_test_results.json
            ${{ runner.temp }}/account-room/generator/chat_inventory.json
          if-no-files-found: error
          retention-days: 30
