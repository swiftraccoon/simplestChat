name: CodeQL

on:
  workflow_call:
    inputs:
      security_gate:
        description: Run the security suite and enforce reviewed High and Critical findings.
        type: boolean
        default: true
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Local policy evaluates every finding at the exact commit. Keep hosted PR
  # analysis identical instead of restricting queries/results to changed lines.
  CODEQL_ACTION_DIFF_INFORMED_QUERIES: 'false'

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-analysis:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      security-events: write # Upload only this job's SARIF to code scanning.
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        language: [actions, javascript-typescript, python, rust]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialize the pinned analyzer
        if: ${{ !env.ACT && matrix.language != 'rust' }}
        id: init
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          tools: linked
          languages: ${{ matrix.language }}
          build-mode: none
          queries: ${{ inputs.security_gate && 'security-extended' || 'security-and-quality' }}
      - name: Verify the shared analyzer and query pins
        if: ${{ !env.ACT && matrix.language != 'rust' }}
        env:
          CODEQL_BINARY: ${{ steps.init.outputs.codeql-path }}
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          python3 build/security_codeql_tools.py --codeql "$CODEQL_BINARY" \
            --language "$CODEQL_LANGUAGE" --output "$RUNNER_TEMP/codeql-tools"
      - name: Fingerprint the exact Rust analysis inputs
        if: matrix.language == 'rust'
        id: rust-inputs
        env:
          CODEQL_SUITE: ${{ inputs.security_gate && 'security' || 'all' }}
        run: |
          key="$(python3 build/security_codeql_cache.py --language rust --suite "$CODEQL_SUITE" \
            --source-root "$RUNNER_TEMP/codeql-local/source")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the exact evaluated Rust database
        if: matrix.language == 'rust'
        id: rust-database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeql-rust-database
          key: ${{ steps.rust-inputs.outputs.key }}
      - name: Restore the authenticated Rust analyzer bundle
        if: ${{ !env.ACT && matrix.language == 'rust' }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/codeql-tools
          key: codeql-cli-v1-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main' || 'untrusted' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('security/codeql-toolchain.json') }}
      - name: Run shared analysis and current policy checks
        if: ${{ env.ACT || matrix.language == 'rust' }}
        id: source-analysis
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
          CODEQL_SUITE: ${{ inputs.security_gate && 'security' || 'all' }}
        run: |
          cache=()
          if [[ "$CODEQL_LANGUAGE" == rust ]]; then
            cache=(--database-cache "$RUNNER_TEMP/codeql-rust-database")
          fi
          rm -f "$RUNNER_TEMP/codeql-local/$CODEQL_LANGUAGE-cache-ready.json"
          status=0
          python3 build/security_codeql_local.py --revision "$GITHUB_SHA" \
            --language "$CODEQL_LANGUAGE" --suite "$CODEQL_SUITE" --output "$RUNNER_TEMP/codeql-local" "${cache[@]}" || status=$?
          if [[ -f "$RUNNER_TEMP/codeql-local/$CODEQL_LANGUAGE-cache-ready.json" ]]; then
            echo 'database-cache-ready=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Save the successfully evaluated Rust database
        if: >-
          ${{ always() && !cancelled() && matrix.language == 'rust' &&
          steps.rust-database.outputs.cache-hit != 'true' && steps.source-analysis.outputs.database-cache-ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeql-rust-database
          key: ${{ steps.rust-database.outputs.cache-primary-key }}
      - name: Retain compact local analysis evidence
        if: ${{ always() && env.ACT && env.LOCAL_CI_EVIDENCE }}
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: |
          destination="$LOCAL_CI_EVIDENCE/codeql-$CODEQL_LANGUAGE"
          install -d -m 700 "$destination"
          for name in summary.json failure.json; do
            if [[ -f "$RUNNER_TEMP/codeql-local/$name" ]]; then
              install -m 600 "$RUNNER_TEMP/codeql-local/$name" "$destination/$name"
            fi
          done
      - name: Record the successful local language scan
        if: ${{ env.ACT }}
        env:
          CODEQL_LANGUAGE: ${{ matrix.language }}
        run: python3 build/ci-local-evidence.py record --id "codeql-$CODEQL_LANGUAGE"
      - name: Analyze and upload results
        if: ${{ !env.ACT && matrix.language != 'rust' }}
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          output: ${{ runner.temp }}/codeql-sarif
          category: /language:${{ matrix.language }}/${{ inputs.security_gate && 'security' || 'quality-advisory' }}
      - name: Enforce exact reviews for High and Critical findings
        if: ${{ !env.ACT && matrix.language != 'rust' && inputs.security_gate }}
        run: |
          shopt -s nullglob
          reports=("$RUNNER_TEMP/codeql-sarif/"*.sarif)
          if ((${#reports[@]} != 1)); then
            echo 'Exactly one original CodeQL report is required.' >&2
            exit 1
          fi
          python3 build/security_codeql_triage.py sarif --revision "$GITHUB_SHA" \
            --input "${reports[0]}" --output "$RUNNER_TEMP/codeql-policy-evidence"
      - name: Identify valid current Rust reports even when policy failed
        if: ${{ always() && !env.ACT && matrix.language == 'rust' }}
        id: rust-reports
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'build')
          from security_codeql_local import upload_ready
          output = Path(os.environ['RUNNER_TEMP']) / 'codeql-local'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as destination:
              for category in ('security', 'quality-advisory'):
                  if upload_ready(output, os.environ['GITHUB_SHA'], category, 'rust'):
                      destination.write(f'{category}=true\n')
          PY
      - name: Upload the current Rust security analysis
        if: ${{ always() && !env.ACT && matrix.language == 'rust' && steps.rust-reports.outputs.security == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-local/rust-security.sarif
          checkout_path: ${{ runner.temp }}/codeql-local/source
          category: /language:rust/security
          wait-for-processing: true
      - name: Upload the current Rust advisory analysis
        if: ${{ always() && !env.ACT && matrix.language == 'rust' && steps.rust-reports.outputs.quality-advisory == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-local/rust-quality-advisory.sarif
          checkout_path: ${{ runner.temp }}/codeql-local/source
          category: /language:rust/quality-advisory
          wait-for-processing: true
      - name: Preserve CodeQL policy evidence
        if: ${{ always() && !env.ACT && inputs.security_gate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-policy-${{ matrix.language }}
          path: |
            ${{ runner.temp }}/codeql-policy-evidence/report.json
            ${{ runner.temp }}/codeql-policy-evidence/failure.json
            ${{ runner.temp }}/codeql-local/rust-security-policy/report.json
            ${{ runner.temp }}/codeql-local/summary.json
          if-no-files-found: warn
          retention-days: 14

  native-analysis:
    name: CodeQL (native C/C++)
    # Hosted Ubuntu remains AMD64; local analysis traces the native runner target.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write # Upload only this job's SARIF to code scanning.
    env:
      OPENSSL_DIR: ${{ github.workspace }}/target/codeql-openssl-3.5.9
      PKG_CONFIG_PATH: ${{ github.workspace }}/target/codeql-openssl-3.5.9/lib/pkgconfig
      OPENSSL_STATIC: '1'
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
    steps:
      - name: Require a supported Linux native analysis target
        run: test "$(uname -s)" = Linux && [[ "$(uname -m)" =~ ^(x86_64|aarch64)$ ]]
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify source and install the real worker prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3-pip curl perl
      - name: Restore checksum-pinned OpenSSL only
        id: openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.OPENSSL_DIR }}
          key: codeql-openssl-v1-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main' || 'untrusted' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('build/install-openssl.sh') }}
      - name: Build checksum-pinned OpenSSL
        if: steps.openssl.outputs.cache-hit != 'true'
        run: build/install-openssl.sh "$OPENSSL_DIR"
      - name: Validate static OpenSSL prerequisites
        run: |
          test -s "$OPENSSL_DIR/lib/libssl.a"
          test -s "$OPENSSL_DIR/lib/libcrypto.a"
          pkg-config --exact-version=3.5.9 openssl
          python3 - <<'PY'
          import os
          from pathlib import Path
          disabled = Path(os.environ['OPENSSL_DIR'], 'share/simplestchat/openssl-disabled.txt')
          if disabled.read_text().splitlines() != ['shared', 'dso', 'module', 'engine']:
              raise SystemExit('Static OpenSSL build settings do not match the pinned installer.')
          PY
      - name: Fingerprint the exact native analysis inputs
        id: native-inputs
        env:
          CODEQL_SUITE: ${{ inputs.security_gate && 'security' || 'all' }}
        run: |
          key="$(python3 build/security_codeql_cache.py --language c-cpp --suite "$CODEQL_SUITE" \
            --source-root "$RUNNER_TEMP/codeql-local/source" --openssl-prefix "$OPENSSL_DIR")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - name: Restore the exact evaluated native database
        id: native-database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeql-native-database
          key: ${{ steps.native-inputs.outputs.key }}
      - name: Restore the authenticated native analyzer bundle
        if: ${{ !env.ACT }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/codeql-tools
          key: codeql-cli-v1-${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'main' || 'untrusted' }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('security/codeql-toolchain.json') }}
      - name: Analyze the exact native database, check coverage and current policy
        id: native-analysis
        env:
          CODEQL_SUITE: ${{ inputs.security_gate && 'security' || 'all' }}
        run: |
          rm -f "$RUNNER_TEMP/codeql-local/c-cpp-cache-ready.json"
          status=0
          python3 build/security_codeql_local.py --revision "$GITHUB_SHA" \
            --language c-cpp --suite "$CODEQL_SUITE" --openssl-prefix "$OPENSSL_DIR" \
            --database-cache "$RUNNER_TEMP/codeql-native-database" \
            --output "$RUNNER_TEMP/codeql-local" || status=$?
          if [[ -f "$RUNNER_TEMP/codeql-local/c-cpp-cache-ready.json" ]]; then
            echo 'database-cache-ready=true' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Save the successfully evaluated native database
        if: >-
          ${{ always() && !cancelled() && steps.native-database.outputs.cache-hit != 'true' &&
          steps.native-analysis.outputs.database-cache-ready == 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/codeql-native-database
          key: ${{ steps.native-database.outputs.cache-primary-key }}
      - name: Retain compact local native analysis evidence
        if: ${{ always() && env.ACT && env.LOCAL_CI_EVIDENCE }}
        run: |
          destination="$LOCAL_CI_EVIDENCE/codeql-c-cpp"
          install -d -m 700 "$destination"
          for name in summary.json failure.json; do
            if [[ -f "$RUNNER_TEMP/codeql-local/$name" ]]; then
              install -m 600 "$RUNNER_TEMP/codeql-local/$name" "$destination/$name"
            fi
          done
      - name: Record the successful local native scan
        if: ${{ env.ACT }}
        run: python3 build/ci-local-evidence.py record --id codeql-c-cpp
      - name: Identify valid current native reports even when policy failed
        if: ${{ always() && !env.ACT }}
        id: native-reports
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'build')
          from security_codeql_local import upload_ready
          output = Path(os.environ['RUNNER_TEMP']) / 'codeql-local'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as destination:
              for category in ('security', 'quality-advisory'):
                  if upload_ready(output, os.environ['GITHUB_SHA'], category, 'c-cpp'):
                      destination.write(f'{category}=true\n')
          PY
      - name: Upload the current native security analysis
        if: ${{ always() && !env.ACT && steps.native-reports.outputs.security == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-local/c-cpp-security.sarif
          checkout_path: ${{ runner.temp }}/codeql-local/source
          category: /language:c-cpp/security
          wait-for-processing: true
      - name: Upload the current native advisory analysis
        if: ${{ always() && !env.ACT && steps.native-reports.outputs.quality-advisory == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          sarif_file: ${{ runner.temp }}/codeql-local/c-cpp-quality-advisory.sarif
          checkout_path: ${{ runner.temp }}/codeql-local/source
          category: /language:c-cpp/quality-advisory
          wait-for-processing: true
      - name: Preserve native CodeQL policy evidence
        if: ${{ always() && !env.ACT && inputs.security_gate }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: codeql-policy-c-cpp
          path: |
            ${{ runner.temp }}/codeql-local/c-cpp-security-policy/report.json
            ${{ runner.temp }}/codeql-local/c-cpp-security-policy/failure.json
            ${{ runner.temp }}/codeql-local/summary.json
          if-no-files-found: warn
          retention-days: 14
