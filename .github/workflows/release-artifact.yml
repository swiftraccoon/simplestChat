name: Build production release artifact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  artifact:
    name: Development image build without release authorization
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain for the release controller
        timeout-minutes: 2
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (2026-10-01)
        with:
          toolchain: 1.99.0

      - name: Prepare the source-built native release controller
        timeout-minutes: 6
        run: |
          cargo build --locked --release -p simplestchat-ops --bin simplestchat-ops \
            --target-dir "$RUNNER_TEMP/release-builder-build"

      - name: Build the exact selected commit without publishing or deploying
        timeout-minutes: 65
        run: |
          "$RUNNER_TEMP/release-builder-build/release/simplestchat-ops" release build \
            --output "${RUNNER_TEMP}/simplestchat-release"

      - name: Retain the artifact and original build outcome
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simplestchat-development-${{ github.sha }}
          path: ${{ runner.temp }}/simplestchat-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
