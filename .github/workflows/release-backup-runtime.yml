name: Signed musl backup verification KVM runtime

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful same-head main CI run containing signed Ops'
        type: string
        required: true
      run_attempt:
        description: 'Exact successful CI attempt'
        type: string
        required: true
        default: '1'
      artifact_id:
        description: 'Signed Ops artifact ID from that exact CI attempt'
        type: string
        required: true

permissions:
  contents: read # Exact checkout only; no source or release writes.
  actions: read # Acquire and authenticate the exact successful same-head CI artifact.

concurrency:
  group: release-backup-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-backup-runtime:
    name: Restore ${{ matrix.scenario }} in one fresh owned guest
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'swiftraccoon/simplestChat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        scenario: [current, historical-subset-failed-release, privacy-invalid]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install only the exact controller toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal \
            --component rustfmt --component clippy --component rust-analyzer
          rustup target add --toolchain 1.99.0 x86_64-unknown-linux-gnu
      - name: Prepare the free owned KVM and pinned controller dependencies
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils \
            openssh-client curl acl
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          python3 -m venv "$RUNNER_TEMP/restore-controller"
          "$RUNNER_TEMP/restore-controller/bin/python" -m pip --isolated install \
            --require-hashes --only-binary=:all: -r ops/ansible/requirements.txt
          python3 build/security_tools.py install --tools gh --directory "$RUNNER_TEMP/restore-gh"
          restore_gh="$(python3 build/security_tools.py path gh \
            --directory "$RUNNER_TEMP/restore-gh")"
          test "$restore_gh" = "$RUNNER_TEMP/restore-gh/bin/gh"
          printf '%s\n' "$RUNNER_TEMP/restore-controller/bin" "${restore_gh%/gh}" >> "$GITHUB_PATH"
      - name: Compile trusted acquisition and passive ELF inspection before credentials
        run: |
          cargo build --locked -p xtask --bin xtask
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            -p simplestchat-ops --bin simplestchat-ops
      - name: Authenticate installed musl and exercise the complete public restore command
        timeout-minutes: 35
        env:
          GH_TOKEN: ${{ github.token }}
          RESTORE_RUN_ID: ${{ inputs.run_id }}
          RESTORE_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          RESTORE_ARTIFACT_ID: ${{ inputs.artifact_id }}
          RESTORE_SCENARIO: ${{ matrix.scenario }}
        run: |
          python3 -B build/security_vm_restore.py \
            --run-id "$RESTORE_RUN_ID" --run-attempt "$RESTORE_RUN_ATTEMPT" \
            --artifact-id "$RESTORE_ARTIFACT_ID" --scenario "$RESTORE_SCENARIO" \
            --output "$RUNNER_TEMP/release-backup-runtime"
      - name: Retain only the closed current summary on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-musl-backup-runtime-${{ matrix.scenario }}
          path: ${{ runner.temp }}/release-backup-runtime/summary.json
          if-no-files-found: error
          retention-days: 14
