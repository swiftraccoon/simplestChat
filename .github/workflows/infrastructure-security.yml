name: Disposable infrastructure security

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      boot_only:
        description: 'Only diagnose Debian guest boot; no application deployment or restore proof'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # Resolve and download only the exact signed main CI release.

concurrency:
  group: infrastructure-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  infrastructure:
    name: ${{ inputs.boot_only && 'Debian VM boot diagnostics' || 'Debian VM deployment and restore policy' }}
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install only the exact controller toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 x86_64-unknown-linux-gnu
      # The controller runs the signed-artifact verifiers through this source build
      # on the runner; the guest receives the signed Ops artifact itself.
      - name: Compile the controller and its runner-side verifier before credentials
        run: |
          cargo build --locked -p simplestchat-release --bin simplestchat-release
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            -p simplestchat-ops --bin simplestchat-ops
      - name: Install owned-guest prerequisites
        run: |
          # This fresh VM-only runner does not use the preinstalled mobile/.NET SDKs.
          # Reclaim them before enforcing the guest's independent disk-space guard.
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl acl python3-venv
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          python3 -m venv "$RUNNER_TEMP/vm-controller"
          "$RUNNER_TEMP/vm-controller/bin/python" -m pip --isolated install \
            --require-hashes --only-binary=:all: -r ops/ansible/requirements.txt
          cargo run --locked -q -p simplestchat-security -- tools install --tools gh \
            --directory "$RUNNER_TEMP/vm-gh"
          vm_gh="$(cargo run --locked -q -p simplestchat-security -- tools path gh \
            --directory "$RUNNER_TEMP/vm-gh")"
          test "$vm_gh" = "$RUNNER_TEMP/vm-gh/bin/gh"
          printf '%s\n' "$RUNNER_TEMP/vm-controller/bin" "${vm_gh%/gh}" >> "$GITHUB_PATH"
      - name: Acquire the signed main release, apply twice and verify host policy and isolated restore
        if: ${{ !inputs.boot_only }}
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          target/debug/simplestchat-release ops-artifact infrastructure-runtime \
            --output "$RUNNER_TEMP/security-vm"
      - name: Diagnose only the owned Debian guest boot
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.boot_only }}
        timeout-minutes: 35
        run: |
          target/debug/simplestchat-release ops-artifact infrastructure-runtime --boot-only \
            --output "$RUNNER_TEMP/security-vm"
      - name: Preserve only the sanitized VM summary
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infrastructure-security-summary
          path: ${{ runner.temp }}/security-vm/summary.json
          if-no-files-found: warn
          retention-days: 14
