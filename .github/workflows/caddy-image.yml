name: Publish pinned Caddy image

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-image
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish Caddy
    if: github.repository == 'swiftraccoon/simplestChat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write # Publish the reviewed image and its attestation to GHCR.
      attestations: write # Bind the image index to the exact recipe and source revision.
      id-token: write # Obtain the GitHub identity used to sign that attestation.
    env:
      IMAGE_NAME: ghcr.io/swiftraccoon/simplestchat-caddy
      IMAGE_TAG: 2.11.7-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Authenticate the repository image publisher
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Validate both architectures and publish their immutable index
        id: image
        run: |
          docker buildx create --name simplestchat-caddy --driver docker-container \
            --driver-opt image=docker.io/moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea \
            --use
          docker buildx build --builder simplestchat-caddy \
            --platform linux/amd64,linux/arm64 --pull --push \
            --build-arg "SOURCE_REVISION=$GITHUB_SHA" \
            --file build/caddy-image.Dockerfile \
            --tag "$IMAGE_NAME:$IMAGE_TAG" \
            --metadata-file "$RUNNER_TEMP/caddy-metadata.json" .
          # The index digest comes from metadata that is UTF-8 holding exactly
          # one JSON object; jq prints the digest only when the whole string is
          # one, so the shell never sees a newline or NUL it would drop.
          metadata="$RUNNER_TEMP/caddy-metadata.json"
          digest=''
          if iconv -f UTF-8 -t UTF-8 "$metadata" >/dev/null; then
            digest="$(jq --exit-status --raw-output --slurp 'if length == 1
              then .[0]["containerimage.digest"] | strings
                | select(test("\\Asha256:[a-f0-9]{64}\\z")) else empty end' \
              "$metadata")" || digest=''
          fi
          if [[ ! "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo 'Caddy image index digest is missing or malformed' >&2
            exit 1
          fi
          printf 'digest=%s\n' "$digest" >>"$GITHUB_OUTPUT"
          recipe="$(sha256sum <build/caddy-image.Dockerfile)"
          caddyfile="$(sha256sum <Caddyfile)"
          image="$IMAGE_NAME:$IMAGE_TAG@$digest"
          jq --null-input --arg revision "$GITHUB_SHA" --arg image "$image" \
            --arg recipe "${recipe%% *}" --arg caddyfile "${caddyfile%% *}" \
            '{version: "2.11.7", revision: $revision, image: $image,
              platforms: ["linux/amd64", "linux/arm64"],
              recipeSha256: $recipe, caddyfileSha256: $caddyfile}' \
            >"$RUNNER_TEMP/caddy-release.json"
          printf '%s\n' "Caddy 2.11.7: \`$image\`" >>"$GITHUB_STEP_SUMMARY"
      - name: Attest the exact image index and reviewed build inputs
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          predicate-path: ${{ runner.temp }}/caddy-release.json
          predicate-type: https://github.com/swiftraccoon/simplestChat/attestations/caddy/v1
          push-to-registry: true
          create-storage-record: false
      - name: Retain the exact deployment selector
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: caddy-release-${{ github.sha }}
          path: ${{ runner.temp }}/caddy-release.json
          if-no-files-found: error
          retention-days: 30
      - name: Remove the owned builder and registry credentials
        if: always()
        run: |
          docker buildx rm simplestchat-caddy || true
          docker logout ghcr.io
