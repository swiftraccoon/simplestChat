name: Signed musl host deploy KVM runtime

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Successful same-head main CI run for both signed artifacts'
        type: string
        required: true
      run_attempt:
        description: 'Exact successful CI run attempt'
        type: string
        required: true
        default: '1'
      artifact_id:
        description: 'Signed Ops artifact ID from that exact CI attempt'
        type: string
        required: true

      server_artifact_id:
        description: 'Signed current server artifact from that same CI attempt'
        type: string
        required: true
      previous_revision:
        description: 'Exact old successful main revision with identical packaged schema'
        type: string
        required: true
      previous_run_id:
        description: 'Exact successful old main CI run'
        type: string
        required: true
      previous_run_attempt:
        description: 'Exact old successful CI attempt'
        type: string
        required: true
      previous_artifact_id:
        description: 'Signed old server artifact from that exact attempt'
        type: string
        required: true

permissions:
  contents: read # Exact checkout only; no source or release writes.
  actions: read # Acquire and authenticate the selected CI artifacts.

concurrency:
  group: release-deploy-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-deploy-runtime:
    name: Signed old/current images, real DB/Caddy and owned rollback
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'swiftraccoon/simplestChat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install the exact minimal Rust toolchain
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          rustup target add --toolchain 1.99.0 x86_64-unknown-linux-gnu
      - name: Prepare the free owned guest and pinned controller tools
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils seabios ipxe-qemu \
            openssh-client curl ca-certificates acl
          test -c /dev/kvm
          # KVM change events can flush named-user access between the two boots.
          sudo setfacl -m "g:$(id -g):rw" /dev/kvm
          python3 -m venv "$RUNNER_TEMP/deploy-controller"
          "$RUNNER_TEMP/deploy-controller/bin/python" -m pip --isolated install \
            --require-hashes --only-binary=:all: -r ops/ansible/requirements.txt
          python3 build/security_tools.py install --tools gh --directory "$RUNNER_TEMP/deploy-gh"
          deploy_gh="$(python3 build/security_tools.py path gh \
            --directory "$RUNNER_TEMP/deploy-gh")"
          test "$deploy_gh" = "$RUNNER_TEMP/deploy-gh/bin/gh"
          printf '%s\n' "$RUNNER_TEMP/deploy-controller/bin" "${deploy_gh%/gh}" >> "$GITHUB_PATH"
      - name: Compile trusted controllers before exposing the API credential
        run: |
          cargo build --locked -p xtask --bin xtask
          cargo build --locked --release --target x86_64-unknown-linux-gnu \
            -p simplestchat-ops --bin simplestchat-ops
      - name: Authenticate old/current contracts and exercise installed musl deploy
        timeout-minutes: 80
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_RUN_ID: ${{ inputs.run_id }}
          DEPLOY_RUN_ATTEMPT: ${{ inputs.run_attempt }}
          DEPLOY_ARTIFACT_ID: ${{ inputs.artifact_id }}
          DEPLOY_SERVER_ARTIFACT_ID: ${{ inputs.server_artifact_id }}
          DEPLOY_PREVIOUS_REVISION: ${{ inputs.previous_revision }}
          DEPLOY_PREVIOUS_RUN_ID: ${{ inputs.previous_run_id }}
          DEPLOY_PREVIOUS_RUN_ATTEMPT: ${{ inputs.previous_run_attempt }}
          DEPLOY_PREVIOUS_ARTIFACT_ID: ${{ inputs.previous_artifact_id }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          ./target/debug/xtask ops-artifact deploy-runtime \
            --run-id "$DEPLOY_RUN_ID" --run-attempt "$DEPLOY_RUN_ATTEMPT" \
            --artifact-id "$DEPLOY_ARTIFACT_ID" \
            --server-artifact-id "$DEPLOY_SERVER_ARTIFACT_ID" \
            --previous-revision "$DEPLOY_PREVIOUS_REVISION" \
            --previous-run-id "$DEPLOY_PREVIOUS_RUN_ID" \
            --previous-run-attempt "$DEPLOY_PREVIOUS_RUN_ATTEMPT" \
            --previous-artifact-id "$DEPLOY_PREVIOUS_ARTIFACT_ID" \
            --output "$RUNNER_TEMP/release-deploy-runtime"
      - name: Preserve only the sanitized deploy summary, including failed trials
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-musl-release-deploy-runtime-summary
          path: ${{ runner.temp }}/release-deploy-runtime/summary.json
          if-no-files-found: warn
          retention-days: 14
