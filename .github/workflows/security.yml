name: Security

on:
  workflow_call:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-fast:
    name: Fast security gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-09)
        with:
          toolchain: 1.98.1
      - name: Install source-check prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv shellcheck
      - name: Run the shared blocking gate
        env:
          SECURITY_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          args=()
          if [[ -n "$SECURITY_BASE" && "$SECURITY_BASE" != 0000000000000000000000000000000000000000 ]]; then
            args+=(--base "$SECURITY_BASE")
          fi
          build/check-security.sh fast --output "$RUNNER_TEMP/security-fast" "${args[@]}"
      - name: Retain compact local source-check evidence
        if: ${{ always() && env.ACT && env.LOCAL_CI_EVIDENCE }}
        run: |
          destination="$LOCAL_CI_EVIDENCE/security-fast"
          install -d -m 700 "$destination"
          if [[ -f "$RUNNER_TEMP/security-fast/summary.json" ]]; then
            install -m 600 "$RUNNER_TEMP/security-fast/summary.json" "$destination/summary.json"
          fi
      - name: Record successful local source checks
        if: ${{ env.ACT }}
        run: python3 build/ci-local-evidence.py record --id security-fast
      - name: Preserve the redacted check summary
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-fast-summary
          path: ${{ runner.temp }}/security-fast/summary.json
          if-no-files-found: error
          retention-days: 14

  native-security:
    name: Native security (${{ matrix.mode }})
    # Scheduled/manual runs execute these same checks inside the shared deep tier.
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        mode: [asan, ubsan, replay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fingerprint the exact native-${{ matrix.mode }} inputs
        id: verified-inputs
        env:
          CI_CACHE_SCOPE: native-${{ matrix.mode }}
        run: |
          key="$(python3 build/ci_verified.py key --scope "$CI_CACHE_SCOPE")"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Restore a verified native-${{ matrix.mode }} result
        id: verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-verified-native-${{ matrix.mode }}
          key: ${{ steps.verified-inputs.outputs.key }}
      - name: Validate the restored native-${{ matrix.mode }} receipt
        if: steps.verified.outputs.cache-hit == 'true'
        env:
          CI_CACHE_SCOPE: native-${{ matrix.mode }}
          CI_CACHE_KEY: ${{ steps.verified-inputs.outputs.key }}
          CI_CACHE_DIRECTORY: ${{ runner.temp }}/ci-verified-native-${{ matrix.mode }}
        run: |
          python3 build/ci_verified.py verify --scope "$CI_CACHE_SCOPE" \
            --key "$CI_CACHE_KEY" --directory "$CI_CACHE_DIRECTORY"

      - name: Start this local job's isolated container engine
        if: ${{ env.ACT && steps.verified.outputs.cache-hit != 'true' }}
        run: build/ci-local-docker.sh
      - name: Verify upstream source and native seed identities
        if: steps.verified.outputs.cache-hit != 'true'
        run: |
          python3 build/security_vendor.py verify --root "$PWD" \
            --cache "$RUNNER_TEMP/vendor-cache" --output "$RUNNER_TEMP/vendor-integrity"
          python3 build/native_security.py verify
      - name: Fingerprint the prepared native image
        if: steps.verified.outputs.cache-hit != 'true'
        id: native-image-inputs
        run: |
          key="$(python3 build/native_security_cache.py key)"
          printf 'key=%s\n' "$key" >> "$GITHUB_OUTPUT"
      - name: Restore the exact prepared native image
        if: steps.verified.outputs.cache-hit != 'true'
        id: native-image
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-image-cache
          key: ${{ steps.native-image-inputs.outputs.key }}
      - name: Validate and load the prepared native image
        if: steps.verified.outputs.cache-hit != 'true' && steps.native-image.outputs.cache-hit == 'true'
        env:
          NATIVE_IMAGE_KEY: ${{ steps.native-image-inputs.outputs.key }}
        run: |
          python3 build/native_security_cache.py load --key "$NATIVE_IMAGE_KEY" \
            --directory "$RUNNER_TEMP/native-image-cache" --output "$RUNNER_TEMP/native-preparation"
      - name: Prepare the pinned native checker
        if: steps.verified.outputs.cache-hit != 'true' && steps.native-image.outputs.cache-hit != 'true'
        run: python3 build/native_security.py prepare --output "$RUNNER_TEMP/native-preparation"
      - name: Export the checked prepared native image
        if: steps.verified.outputs.cache-hit != 'true' && steps.native-image.outputs.cache-hit != 'true'
        env:
          NATIVE_IMAGE_KEY: ${{ steps.native-image-inputs.outputs.key }}
        run: |
          python3 build/native_security_cache.py save --key "$NATIVE_IMAGE_KEY" \
            --directory "$RUNNER_TEMP/native-image-cache" --output "$RUNNER_TEMP/native-preparation"
      - name: Save the exact prepared native image before running its selected suite
        if: steps.verified.outputs.cache-hit != 'true' && steps.native-image.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-image-cache
          key: ${{ steps.native-image-inputs.outputs.key }}
      - name: Run the selected isolated native suite
        if: steps.verified.outputs.cache-hit != 'true'
        env:
          NATIVE_MODE: ${{ matrix.mode }}
        run: |
          image_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["imageId"])' "$RUNNER_TEMP/native-preparation/report.json")"
          python3 build/native_security.py run --image "$image_id" --mode "$NATIVE_MODE" \
            --output "$RUNNER_TEMP/native-$NATIVE_MODE"
      - name: Retain compact local native evidence
        if: ${{ always() && env.ACT && env.LOCAL_CI_EVIDENCE }}
        env:
          NATIVE_MODE: ${{ matrix.mode }}
        run: |
          for phase in vendor-integrity native-preparation "native-$NATIVE_MODE"; do
            destination="$LOCAL_CI_EVIDENCE/native-$NATIVE_MODE/$phase"
            install -d -m 700 "$destination"
            for name in report.json failure.json; do
              if [[ -f "$RUNNER_TEMP/$phase/$name" ]]; then
                install -m 600 "$RUNNER_TEMP/$phase/$name" "$destination/$name"
              fi
            done
          done
      - name: Record the successful local native suite
        if: ${{ env.ACT }}
        env:
          NATIVE_MODE: ${{ matrix.mode }}
        run: python3 build/ci-local-evidence.py record --id "native-$NATIVE_MODE"
      - name: Preserve bounded native results
        if: ${{ always() && !env.ACT && steps.verified.outputs.cache-hit != 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-security-results-${{ matrix.mode }}
          path: |
            ${{ runner.temp }}/vendor-integrity/report.json
            ${{ runner.temp }}/native-*/report.json
            ${{ runner.temp }}/native-*/failure.json
            ${{ runner.temp }}/native-asan/native.stdout.log
            ${{ runner.temp }}/native-asan/native.stderr.log
            ${{ runner.temp }}/native-ubsan/native.stdout.log
            ${{ runner.temp }}/native-ubsan/native.stderr.log
            ${{ runner.temp }}/native-replay/native.stdout.log
            ${{ runner.temp }}/native-replay/native.stderr.log
          if-no-files-found: error
          retention-days: 14

      - name: Record the successful native-${{ matrix.mode }} verification
        if: steps.verified.outputs.cache-hit != 'true'
        env:
          CI_CACHE_SCOPE: native-${{ matrix.mode }}
          CI_CACHE_KEY: ${{ steps.verified-inputs.outputs.key }}
          CI_CACHE_DIRECTORY: ${{ runner.temp }}/ci-verified-native-${{ matrix.mode }}
        run: |
          python3 build/ci_verified.py save --scope "$CI_CACHE_SCOPE" \
            --key "$CI_CACHE_KEY" --directory "$CI_CACHE_DIRECTORY"
      - name: Save the exact native-${{ matrix.mode }} success
        if: steps.verified.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ci-verified-native-${{ matrix.mode }}
          key: ${{ steps.verified.outputs.cache-primary-key }}

  security-deep:
    name: Scheduled complete security tier
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-09)
        with:
          toolchain: 1.98.1
      - name: Install shared gate prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv shellcheck
      - name: Start this local job's isolated container engine
        if: ${{ env.ACT }}
        run: build/ci-local-docker.sh
      - name: Run the maintained complete tier
        run: build/check-security.sh deep --deep-check native --output "$RUNNER_TEMP/security-deep"
      - name: Retain compact local deep-tier evidence
        if: ${{ always() && env.ACT && env.LOCAL_CI_EVIDENCE }}
        run: |
          for phase in . vendor native-preparation native-asan native-ubsan native-replay; do
            destination="$LOCAL_CI_EVIDENCE/security-deep/$phase"
            install -d -m 700 "$destination"
            for name in summary.json report.json failure.json; do
              if [[ -f "$RUNNER_TEMP/security-deep/$phase/$name" ]]; then
                install -m 600 "$RUNNER_TEMP/security-deep/$phase/$name" "$destination/$name"
              fi
            done
          done
      - name: Record the successful local deep tier
        if: ${{ env.ACT }}
        run: python3 build/ci-local-evidence.py record --id security-deep
      - name: Preserve the redacted check summary
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-deep-summary
          path: ${{ runner.temp }}/security-deep/summary.json
          if-no-files-found: error
          retention-days: 30
      - name: Preserve bounded offline native diagnostics
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-deep-native-diagnostics
          path: |
            ${{ runner.temp }}/security-deep/native-asan/native.stdout.log
            ${{ runner.temp }}/security-deep/native-asan/native.stderr.log
            ${{ runner.temp }}/security-deep/native-ubsan/native.stdout.log
            ${{ runner.temp }}/security-deep/native-ubsan/native.stderr.log
            ${{ runner.temp }}/security-deep/native-replay/native.stdout.log
            ${{ runner.temp }}/security-deep/native-replay/native.stderr.log
          if-no-files-found: warn
          retention-days: 14

  security-mutation:
    name: Scheduled policy mutation checks
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENSSL_DIR: ${{ github.workspace }}/target/openssl-3.5.9
      PKG_CONFIG_PATH: ${{ github.workspace }}/target/openssl-3.5.9/lib/pkgconfig
      OPENSSL_STATIC: '1'
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: policy-mutation
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Prepare the locked source dependency cache
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv
          cargo fetch --locked
      - name: Check selected policy assertions in an isolated source copy
        run: |
          build/check-security.sh deep --deep-check mutation \
            --openssl-prefix "$OPENSSL_DIR" --output "$RUNNER_TEMP/security-mutation"
      - name: Retain compact local mutation evidence
        if: ${{ always() && env.ACT && env.LOCAL_CI_EVIDENCE }}
        run: |
          for phase in . mutation; do
            destination="$LOCAL_CI_EVIDENCE/security-mutation/$phase"
            install -d -m 700 "$destination"
            for name in summary.json outcome.json inventory.json failure.json; do
              if [[ -f "$RUNNER_TEMP/security-mutation/$phase/$name" ]]; then
                install -m 600 "$RUNNER_TEMP/security-mutation/$phase/$name" "$destination/$name"
              fi
            done
          done
      - name: Record the successful local mutation tier
        if: ${{ env.ACT }}
        run: python3 build/ci-local-evidence.py record --id security-mutation
      - name: Preserve compact test-quality evidence
        if: ${{ always() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-mutation-summary
          path: |
            ${{ runner.temp }}/security-mutation/summary.json
            ${{ runner.temp }}/security-mutation/mutation/outcome.json
            ${{ runner.temp }}/security-mutation/mutation/summary.json
            ${{ runner.temp }}/security-mutation/mutation/inventory.json
          if-no-files-found: error
          retention-days: 30
