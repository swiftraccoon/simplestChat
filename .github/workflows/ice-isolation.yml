name: ICE isolation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ice-isolation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  same-host:
    name: WebKit and Chromium on the same Mac
    runs-on: macos-26
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ICE_ISOLATION_E2E: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.10.0
          cache: npm
          cache-dependency-path: web/e2e/package-lock.json

      - name: Install checksum-pinned npm
        working-directory: ${{ github.workspace }}
        run: |
          node build/install-npm.mjs "$RUNNER_TEMP/simplestchat-npm-12.2.0"
          # The runner's rustup reads rust-toolchain.toml; only xtask tooling is built.
          rustup toolchain install --profile minimal
          cargo run --locked -q -p xtask -- ci npm-path

      - name: Install pinned browser tooling
        id: tooling
        run: |
          npm --prefix web/e2e ci --ignore-scripts
          npm --prefix web/e2e exec -- playwright install webkit chromium
          cargo run --locked -q -p xtask -- media-ip --github-env

      - name: Record macOS version
        run: sw_vers

      - name: Inspect mDNS service and owned registration
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        timeout-minutes: 1
        env:
          MDNS_DIAGNOSTIC_E2E: '1'
          E2E_ARTIFACTS: ${{ runner.temp }}/ice-isolation
        run: cargo run --locked -q -p xtask -- ci mdns preflight --artifact-only

      - name: WebKit receive-only ICE
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        timeout-minutes: 3
        env:
          E2E_BROWSER: webkit
          E2E_ARTIFACTS: ${{ runner.temp }}/ice-isolation/webkit
        run: node web/e2e/ice-isolation.cjs

      - name: WebKit with owned candidate filtering override
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        timeout-minutes: 3
        env:
          E2E_BROWSER: webkit
          WEBKIT_ICE_DIAGNOSTIC: '1'
          ICE_ISOLATION_WEBKIT_FILTERING: '0'
          E2E_ARTIFACTS: ${{ runner.temp }}/ice-isolation/webkit-filtering-disabled
        run: node web/e2e/ice-isolation.cjs

      - name: Chromium receive-only ICE
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        timeout-minutes: 3
        env:
          E2E_BROWSER: chromium
          E2E_ARTIFACTS: ${{ runner.temp }}/ice-isolation/chromium
        run: node web/e2e/ice-isolation.cjs

      - name: Summarize scoped mDNS and WebKit diagnostics
        if: ${{ !cancelled() && steps.tooling.outcome == 'success' }}
        timeout-minutes: 1
        env:
          MDNS_DIAGNOSTIC_E2E: '1'
          E2E_ARTIFACTS: ${{ runner.temp }}/ice-isolation
        run: cargo run --locked -q -p xtask -- ci mdns snapshot --artifact-only

      - name: Preserve both browser reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ice-isolation-macos-26
          path: ${{ runner.temp }}/ice-isolation
          if-no-files-found: ignore
          retention-days: 7
