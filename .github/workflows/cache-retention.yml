name: Cache retention

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cache-retention-main
  cancel-in-progress: false

jobs:
  retain:
    name: Retain current CI caches
    if: >-
      ${{ github.repository == 'swiftraccoon/simplestChat' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # Delete only bounded obsolete cache IDs after successful main CI.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Retain current caches and prune obsolete allowed families
        env:
          GH_TOKEN: ${{ github.token }}
          MAINTENANCE_RUN: ${{ github.event.workflow_run.id }}
          MAINTENANCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 build/ci_cache_retention.py --apply \
            --run-id "$MAINTENANCE_RUN" --revision "$MAINTENANCE_SHA"
