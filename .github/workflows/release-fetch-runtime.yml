name: Native release fetch KVM runtime

on:
  workflow_dispatch:

permissions:
  contents: read # Exact workflow checkout; no release or source writes.
  actions: read # Read the same-head successful CI artifact and attestations.

concurrency:
  group: release-fetch-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-fetch-runtime:
    name: Source-built GNU client and unchanged receiver on disposable Debian
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      github.repository == 'swiftraccoon/simplestChat' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.8'
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable (2026-10-01)
        with:
          toolchain: 1.99.0
          targets: x86_64-unknown-linux-gnu
      - name: Prepare the free owned guest and pinned controller tools
        run: |
          sudo rm -rf -- /usr/local/lib/android /usr/share/dotnet
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils \
            openssh-client curl acl
          test -c /dev/kvm
          sudo setfacl -m "u:$(id -un):rw" /dev/kvm
          python3 -m venv "$RUNNER_TEMP/release-fetch-controller"
          "$RUNNER_TEMP/release-fetch-controller/bin/python" -m pip --isolated install \
            --require-hashes --only-binary=:all: -r ops/ansible/requirements.txt
          python3 build/security_tools.py install --tools gh \
            --directory "$RUNNER_TEMP/release-fetch-gh"
          fetch_gh="$(python3 build/security_tools.py path gh \
            --directory "$RUNNER_TEMP/release-fetch-gh")"
          test "$fetch_gh" = "$RUNNER_TEMP/release-fetch-gh/bin/gh"
          printf '%s\n' "$RUNNER_TEMP/release-fetch-controller/bin" \
            "${fetch_gh%/gh}" >> "$GITHUB_PATH"
      - name: Compile the native GNU client before exposing its API credential
        run: >-
          cargo build --locked --release --target x86_64-unknown-linux-gnu
          -p simplestchat-ops --bin simplestchat-ops
      - name: Acquire the same-head artifact and prove both real SSH fetch paths
        id: runtime
        # One credential leaf includes selection wait900 + transfer240 + four180
        # verifiers, their settlements/API/setup and the original keeper1800.
        # This proof budget changes no production caller/default or native N/M.
        timeout-minutes: 65
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -B - <<'PY'
          import os
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path(os.environ['GITHUB_WORKSPACE']) / 'build'))
          from security_context import ROOT
          import bounded_process

          def main():
              # This fixture-only1900 ceiling may refuse an otherwise valid slow
              # acquisition. It changes no production phase/caller timeout.
              private = Path(os.environ['RUNNER_TEMP']) / 'release-fetch-preacquisition-private'
              try:
                  if os.environ['GITHUB_REPOSITORY'] != 'swiftraccoon/simplestChat':
                      raise ValueError('fixed repository required')
                  private.mkdir(mode=0o700)
                  with (private / 'stdout').open('xb') as stdout:
                      with (private / 'stderr').open('xb') as stderr:
                          os.fchmod(stdout.fileno(), 0o600)
                          os.fchmod(stderr.fileno(), 0o600)
                          status, _, _ = bounded_process.run(
                              [sys.executable, '-B', str(ROOT / 'build/security_vm_release.py'),
                               '--repository', 'swiftraccoon/simplestChat', '--output',
                               str(Path(os.environ['RUNNER_TEMP']) / 'release-fetch-acquired')],
                              cwd=ROOT, env=dict(os.environ), output=stdout, error=stderr,
                              limits=bounded_process.Limits(
                                  timeout=1900, stdout=2 * 1024**2, stderr=2 * 1024**2),
                          )
                  if status == 0:
                      return 0
              except BaseException:
                  pass
              # Original private streams are closed before this sole diagnostic.
              sys.stderr.write('Signed release preacquisition is unproven; no VM was started.\n')
              return 1

          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          python3 -B build/security_vm_fetch.py \
            --binary "$GITHUB_WORKSPACE/target/x86_64-unknown-linux-gnu/release/simplestchat-ops" \
            --acquired "$RUNNER_TEMP/release-fetch-acquired" \
            --output "$RUNNER_TEMP/release-fetch-runtime"
      - name: Preserve only the closed sanitized native fetch summary
        if: ${{ success() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-release-fetch-runtime-summary
          path: ${{ runner.temp }}/release-fetch-runtime/summary.json
          if-no-files-found: error
          retention-days: 14
