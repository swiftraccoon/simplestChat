name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  automation:
    name: Operations automation lint and safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated controller checks
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv shellcheck jq
          python3 -m venv "${RUNNER_TEMP}/ansible-controller"
          "${RUNNER_TEMP}/ansible-controller/bin/pip" install -r ops/ansible/requirements.txt
          echo "${RUNNER_TEMP}/ansible-controller/bin" >> "${GITHUB_PATH}"
      - name: Validate automation without contacting any host
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
        run: |
          ansible-lint --offline --strict ops/ansible
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/site.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/public.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/release.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/reboot.yml --syntax-check
          shellcheck ops/ansible/files/*.sh
          python -m unittest discover -s ops/ansible/tests -v

  rust:
    name: Rust + PostgreSQL + browser integration
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        # Official image, pinned to the verified PostgreSQL 18.6 manifest.
        image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: simplestchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_owner -d simplestchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # mediasoup-sys invokes pip from its Cargo build script.
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
      DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      TEST_DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      DISPOSABLE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # mediasoup-sys builds the C++ worker: needs python3 + pip (meson/ninja
      # are fetched by its build script) and a full C++ toolchain
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip cmake curl perl pkg-config shellcheck jq

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-09)
        with:
          toolchain: 1.98.1
          # mediasoup-sys formats generated bindings during its build script.
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      - name: Check helper syntax, safety and cleanup
        run: build/check.sh --helpers

      - name: Configure native dependency paths
        run: |
          echo "OPENSSL_DIR=${RUNNER_TEMP}/simplestchat-openssl-3.5.8" >> "${GITHUB_ENV}"
          echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/simplestchat-openssl-3.5.8/lib/pkgconfig" >> "${GITHUB_ENV}"

      # rust-cache may clean non-Cargo files under target on a fallback hit.
      - name: Build checksum-pinned OpenSSL
        run: build/install-openssl.sh "${OPENSSL_DIR}"

      - name: Check Rust lints and documentation
        run: build/check.sh --rust

      - name: Build production server
        run: cargo build --locked --bin simplestChat

      - name: Verify readiness and graceful shutdown
        run: node build/shutdown-smoke.mjs --binary "$PWD/target/debug/simplestChat"

      - name: Verify bounded local operation diagnostics
        run: node build/diagnostics-smoke.mjs --binary "$PWD/target/debug/simplestChat"

      - name: Verify native security patches
        run: |
          cargo tree --locked -i lru | grep -F 'lru v0.18.4'
          cargo tree --locked -i mediasoup-sys \
            | grep -Eq 'mediasoup-sys v0\.17\.0 \(.*/vendor/mediasoup-sys-0\.17\.0\)$'
          grep -Fq 'source_filename = abseil-cpp-20240722.2.tar.gz' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap
          grep -Fq 'source_hash = ec820b01d9b328ca1f1b9c4e5b305d7a9fa03dc410ef64ba6654b637f9a4c3a8' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap
          grep -Fq 'patch_directory = abseil-cpp' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap
          echo '454b10520ba4ba4a9995612ba2d9e6490b5477bb5093eff54af4c84917f71f19  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/abseil-cpp/meson.build' \
            | sha256sum --check --strict
          echo '7939f4c45423cec4a18236ad0a88570e33508dd7462e07b1038001f90ece65fb  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/abseil-cpp/LICENSE.build' \
            | sha256sum --check --strict
          if grep -Fq 'source_filename = abseil-cpp-20240722.0.tar.gz' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap; then
            echo 'vulnerable Abseil 20240722.0 source remains configured' >&2
            exit 1
          fi
          if grep -Fq 'source_fallback_url' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap; then
            echo 'Abseil source fallback must remain disabled' >&2
            exit 1
          fi
          grep -Fq 'source_hash = 66d511b9e6e334c0e62279eb234fbfb2b3110b1479c09b95b44c7afca8cff9e7' \
            vendor/mediasoup-sys-0.17.0/subprojects/libuv.wrap
          grep -Fq 'source_hash = a232f7433b45872d43e4dc74a25cbd58effc0be76e3d704b34e5de3c637eed77' \
            vendor/mediasoup-sys-0.17.0/subprojects/unordered-dense.wrap
          grep -Fq 'source_hash = 0957cae5821b17ce07f0833aaa52b5137643a8382203221f363a8303c109af34' \
            vendor/mediasoup-sys-0.17.0/subprojects/catch2.wrap
          echo '3eada92dfde42ed1148b17712bd363d28d73a74bf374484acd45e1faf27f487f  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/meson.build' \
            | sha256sum --check --strict
          echo 'dc02dc5b7d5bd069782529f59012e7ac25b53325b7783609c77a3b36ca819a7c  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/meson_options.txt' \
            | sha256sum --check --strict
          echo 'cba566c9f026b7c23c2460c4262ddd420e4da63986a892653d4c15a0f9e6943d  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/link_file_in_build_dir.py' \
            | sha256sum --check --strict
          echo '7939f4c45423cec4a18236ad0a88570e33508dd7462e07b1038001f90ece65fb  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/LICENSE.build' \
            | sha256sum --check --strict
          echo '8f535a2932f7074ed3c52c01de988b8e2881d94a3e2a169945c42d64ac0f3e77  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/ankerl-unordered-dense/meson.build' \
            | sha256sum --check --strict
          strings target/debug/simplestChat | grep -Fq 'OpenSSL 3.5.8 25 Aug 2026'
          if strings target/debug/simplestChat | grep -Fq 'OpenSSL 3.0.8'; then
            echo 'vulnerable bundled OpenSSL 3.0.8 found in server binary' >&2
            exit 1
          fi
          if ldd target/debug/simplestChat | grep -Eq 'lib(ssl|crypto)\.so'; then
            echo 'server binary links dynamically to OpenSSL' >&2
            exit 1
          fi

      - name: Build load-test client
        run: cargo build --locked --features load-test --bin load_test

      - name: Migrate disposable test database with the real server
        run: build/with-test-server.sh true

      # Include all PostgreSQL tests, not only the default unit suite.
      # Serialize native media-worker and room-session integration tests.
      - name: Test (including PostgreSQL recovery, refresh and moderation)
        run: cargo test --locked --all-features -- --include-ignored --test-threads=1

      - name: Synthetic media delivery correctness smoke
        timeout-minutes: 2
        env:
          RUST_LOG: warn
          E2E_ARTIFACTS: ${{ runner.temp }}/media-smoke
        run: |
          build/with-test-server.sh target/debug/load_test \
            --server ws://127.0.0.1:3119/ws --clients 4 --rooms 1 --mode conference \
            --ramp-up 2 --warmup 10 --duration 8 --deadline-grace 20 \
            --output-dir "${E2E_ARTIFACTS}" --run-label ci-media-smoke \
            --server-revision "${GITHUB_SHA}" --generator-revision "${GITHUB_SHA}"

      - name: Preserve media smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-smoke
          path: ${{ runner.temp }}/media-smoke
          if-no-files-found: ignore
          retention-days: 7

      - name: Build UI and install pinned browser tooling
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          npm --prefix web/e2e ci --ignore-scripts
          npm --prefix web/e2e exec -- playwright install --with-deps chromium
          npm --prefix web/e2e audit --audit-level=moderate

      - name: Homepage containment and responsive layout
        timeout-minutes: 3
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/homepage-layout
        run: npm --prefix web/e2e run test:layout

      - name: Automatic room recovery after an owned server restart
        timeout-minutes: 3
        run: |
          node build/restart-browser-smoke.mjs --binary "$PWD/target/debug/simplestChat" \
            --browser chromium --output "${RUNNER_TEMP}/restart-browser"

      - name: Preserve browser restart diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restart-browser
          path: ${{ runner.temp }}/restart-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve homepage layout diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-layout
          path: ${{ runner.temp }}/homepage-layout
          if-no-files-found: ignore
          retention-days: 7

      - name: Community and real-media browser regressions
        timeout-minutes: 8
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/community-e2e
        run: build/with-test-server.sh npm --prefix web/e2e test

      - name: Accessibility rules and keyboard smoke
        timeout-minutes: 5
        env:
          ACCESSIBILITY_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/accessibility-e2e
        run: build/with-test-server.sh node web/e2e/accessibility.cjs

      - name: Preserve accessibility diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-e2e
          path: ${{ runner.temp }}/accessibility-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-e2e
          path: ${{ runner.temp }}/community-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          # SQLx 0.9 removes the old optional rsa lockfile entry. Keep its
          # advisory unsuppressed so a future reintroduction is audited.
          # The atty and rand advisories occur only in mediasoup-sys build tools.
          cargo audit --deny unsound \
            --ignore RUSTSEC-2021-0145 \
            --ignore RUSTSEC-2026-0097

  web:
    name: Web lint + format + tests + typecheck + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node is build/test-only; deployment runs Rust, not Node.
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: ../build/check.sh --web
      - name: Audit web dependencies
        # Build-time packages execute against trusted source and are part of the
        # supply chain, so audit the complete lockfile rather than omitting dev.
        run: npm audit --audit-level=moderate

  deployment:
    name: Production image + deployment config
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PRODUCTION_IMAGE: simplestchat-ci:production
      # Official Caddy image, pinned to the 2.11.4-alpine multi-architecture
      # manifest digest published by Docker Official Images.
      CADDY_IMAGE: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate Compose rendering
        env:
          # Reserved example values only; no deployment secret enters CI.
          ALLOWED_ORIGINS: https://chat.example.test
          TRUSTED_PROXY_SECRET: ci-only-proxy-secret-00000000000000000000000000000000
        run: docker compose --file docker-compose.yml config --quiet

      - name: Validate Caddyfile
        env:
          TRUSTED_PROXY_SECRET: ci-only-proxy-secret-00000000000000000000000000000000
        run: |
          # The official image marks /usr/bin/caddy with NET_BIND_SERVICE.
          # Retain only that capability so Linux can execute the binary while
          # the validation container remains otherwise isolated.
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges \
            --tmpfs /config:rw,nosuid,nodev,noexec,size=16m \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=16m \
            --env TRUSTED_PROXY_SECRET \
            --mount type=bind,src="${PWD}/Caddyfile",dst=/etc/caddy/Caddyfile,readonly \
            --entrypoint /usr/bin/caddy \
            "${CADDY_IMAGE}" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build production container
        run: |
          timeout --signal=TERM --kill-after=2m 50m \
            docker build --pull --target production \
              --tag "${PRODUCTION_IMAGE}" .

      - name: Verify production image contents and user
        shell: bash
        run: |
          set -euo pipefail

          configured_user="$(
            docker image inspect --format '{{.Config.User}}' "${PRODUCTION_IMAGE}"
          )"
          test "${configured_user}" = "10001:10001"

          shopt -s nullglob
          migration_names=()
          for migration in migrations/*.sql; do
            migration_names+=("${migration##*/}")
          done
          test "${#migration_names[@]}" -gt 0

          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            "${PRODUCTION_IMAGE}" -eu -c '
              test "$(id -u)" = 10001
              test "$(id -g)" = 10001
              test -x /app/simplestChat
              test -s /app/web/dist/index.html
              test ! -e /app/load_test

              actual_migrations="$(
                find /app/migrations -maxdepth 1 -type f -name "*.sql" | wc -l
              )"
              test "${actual_migrations}" -eq "$#"
              for migration do
                test -s "/app/migrations/${migration}"
              done
            ' verify-image "${migration_names[@]}"

      - name: Production startup, migration and database-backed API smoke
        timeout-minutes: 5
        env:
          CONTAINER_TEST_ARTIFACTS: ${{ runner.temp }}/container-smoke
        run: build/test-container.sh

      - name: Preserve container diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-smoke
          path: ${{ runner.temp }}/container-smoke
          if-no-files-found: ignore
          retention-days: 7
