name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  automation:
    name: Operations automation lint and safety checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Include the PR head beneath GitHub's synthetic merge commit.
          fetch-depth: 2
      - name: Check the branch tip commit subject
        env:
          COMMIT_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          git log -1 --format=%B "$COMMIT_REVISION" > "${RUNNER_TEMP}/commit-message"
          .githooks/commit-msg "${RUNNER_TEMP}/commit-message"
      - name: Install isolated controller checks
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv shellcheck jq postgresql
          python3 -m venv "${RUNNER_TEMP}/ansible-controller"
          "${RUNNER_TEMP}/ansible-controller/bin/pip" install -r build/python-requirements.txt
          echo "${RUNNER_TEMP}/ansible-controller/bin" >> "${GITHUB_PATH}"
      - name: Validate automation without contacting any host
        env:
          ANSIBLE_CONFIG: ${{ github.workspace }}/ops/ansible/ansible.cfg
          PYTHON_CHECK_ENV: ${{ runner.temp }}/ansible-controller
        run: |
          build/check-python.sh
          ansible-lint --offline --strict ops/ansible
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/site.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/public.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/release.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/reboot.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/turn.yml --syntax-check
          ansible-playbook -i ops/ansible/inventory.example.yml ops/ansible/monitoring.yml --syntax-check
          shellcheck ops/ansible/files/*.sh
          python -m unittest discover -s ops/ansible/tests -v

      - name: Verify operational alert history in disposable PostgreSQL
        run: |
          postgres_bindir="$(pg_config --bindir)"
          export PATH="${postgres_bindir}:$PATH"
          build/with-test-postgres.sh python -m unittest discover \
            -s ops/ansible/tests -p test_monitoring_database.py -v

      - name: Verify isolated backup restoration with pinned PostgreSQL
        env:
          RESTORE_CONTAINER_E2E: "1"
        run: |
          docker pull docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
          postgres_bindir="$(pg_config --bindir)"
          export PATH="${postgres_bindir}:$PATH"
          build/with-test-postgres.sh python -m unittest discover \
            -s ops/ansible/tests -p test_restore_database.py -v

      - name: Preserve isolated restore failure diagnostics
        if: ${{ failure() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restore-container
          path: ${{ runner.temp }}/simplestchat-restore-container.*/
          if-no-files-found: ignore
          retention-days: 7

      - name: Verify production alert rule behavior with pinned Prometheus
        run: |
          docker run --rm --network=none --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges:true --memory=128m --cpus=0.25 --pids-limit=64 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            --volume "$PWD/ops/ansible:/work:ro" --workdir /work/tests \
            --entrypoint /bin/promtool \
            quay.io/prometheus/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0 \
            test rules monitoring-rules.test.yml

  rust-lint:
    name: Rust format, lints and documentation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-check

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      - name: Check helper syntax, safety and cleanup
        run: build/check.sh --helpers

      - name: Check Rust formatting, lints and documentation
        run: build/check.sh --rust

      - name: Audit Rust dependencies
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          # SQLx 0.9 removes the old optional rsa lockfile entry. Keep its
          # advisory unsuppressed so a future reintroduction is audited.
          # The atty and rand advisories occur only in mediasoup-sys build tools.
          cargo audit --deny unsound \
            --ignore RUSTSEC-2021-0145 \
            --ignore RUSTSEC-2026-0097

  rust-test:
    name: Rust build, native and PostgreSQL tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        # Official image, pinned to the verified PostgreSQL 18.6 manifest.
        image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: simplestchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_owner -d simplestchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # mediasoup-sys invokes pip from its Cargo build script.
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
      DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      TEST_DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      DISPOSABLE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      # One feature set for every Rust target in CI. Distinct feature sets
      # (default for the server, load-test for the generator, all for the
      # tests) each rebuilt the native worker, three minutes apiece. The
      # load-test feature only adds the generator's dependencies and binary;
      # the server code is identical.
      - name: Build server and load generator
        run: cargo build --locked --all-features --bins

      - name: Verify readiness and graceful shutdown
        run: node build/shutdown-smoke.mjs --binary "$PWD/target/debug/simplestChat"

      - name: Verify bounded local operation diagnostics
        run: node build/diagnostics-smoke.mjs --binary "$PWD/target/debug/simplestChat"

      - name: Verify native security patches
        run: |
          cargo tree --locked -i lru | grep -F 'lru v0.18.4'
          cargo tree --locked -i mediasoup-sys \
            | grep -Eq 'mediasoup-sys v0\.17\.0 \(.*/vendor/mediasoup-sys-0\.17\.0\)$'
          grep -Fq 'source_filename = abseil-cpp-20240722.2.tar.gz' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap
          grep -Fq 'source_hash = ec820b01d9b328ca1f1b9c4e5b305d7a9fa03dc410ef64ba6654b637f9a4c3a8' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap
          grep -Fq 'patch_directory = abseil-cpp' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap
          echo '454b10520ba4ba4a9995612ba2d9e6490b5477bb5093eff54af4c84917f71f19  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/abseil-cpp/meson.build' \
            | sha256sum --check --strict
          echo '7939f4c45423cec4a18236ad0a88570e33508dd7462e07b1038001f90ece65fb  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/abseil-cpp/LICENSE.build' \
            | sha256sum --check --strict
          if grep -Fq 'source_filename = abseil-cpp-20240722.0.tar.gz' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap; then
            echo 'vulnerable Abseil 20240722.0 source remains configured' >&2
            exit 1
          fi
          if grep -Fq 'source_fallback_url' \
            vendor/mediasoup-sys-0.17.0/subprojects/abseil-cpp.wrap; then
            echo 'Abseil source fallback must remain disabled' >&2
            exit 1
          fi
          grep -Fq 'source_hash = 66d511b9e6e334c0e62279eb234fbfb2b3110b1479c09b95b44c7afca8cff9e7' \
            vendor/mediasoup-sys-0.17.0/subprojects/libuv.wrap
          grep -Fq 'source_hash = a232f7433b45872d43e4dc74a25cbd58effc0be76e3d704b34e5de3c637eed77' \
            vendor/mediasoup-sys-0.17.0/subprojects/unordered-dense.wrap
          grep -Fq 'source_hash = 0957cae5821b17ce07f0833aaa52b5137643a8382203221f363a8303c109af34' \
            vendor/mediasoup-sys-0.17.0/subprojects/catch2.wrap
          echo '3eada92dfde42ed1148b17712bd363d28d73a74bf374484acd45e1faf27f487f  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/meson.build' \
            | sha256sum --check --strict
          echo 'dc02dc5b7d5bd069782529f59012e7ac25b53325b7783609c77a3b36ca819a7c  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/meson_options.txt' \
            | sha256sum --check --strict
          echo 'cba566c9f026b7c23c2460c4262ddd420e4da63986a892653d4c15a0f9e6943d  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/link_file_in_build_dir.py' \
            | sha256sum --check --strict
          echo '7939f4c45423cec4a18236ad0a88570e33508dd7462e07b1038001f90ece65fb  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/libuv/LICENSE.build' \
            | sha256sum --check --strict
          echo '8f535a2932f7074ed3c52c01de988b8e2881d94a3e2a169945c42d64ac0f3e77  vendor/mediasoup-sys-0.17.0/subprojects/packagefiles/ankerl-unordered-dense/meson.build' \
            | sha256sum --check --strict
          strings target/debug/simplestChat | grep -Fq 'OpenSSL 3.5.8 25 Aug 2026'
          if strings target/debug/simplestChat | grep -Fq 'OpenSSL 3.0.8'; then
            echo 'vulnerable bundled OpenSSL 3.0.8 found in server binary' >&2
            exit 1
          fi
          if ldd target/debug/simplestChat | grep -Eq 'lib(ssl|crypto)\.so'; then
            echo 'server binary links dynamically to OpenSSL' >&2
            exit 1
          fi

      - name: Migrate disposable test database with the real server
        run: build/with-test-server.sh true

      # Include all PostgreSQL tests, not only the default unit suite.
      # Serialize native media-worker and room-session integration tests.
      - name: Test (including PostgreSQL recovery, refresh and moderation)
        run: cargo test --locked --all-features -- --include-ignored --test-threads=1

      - name: Synthetic media delivery correctness smoke
        timeout-minutes: 2
        env:
          RUST_LOG: warn
          E2E_ARTIFACTS: ${{ runner.temp }}/media-smoke
        run: |
          build/with-test-server.sh target/debug/load_test \
            --server ws://127.0.0.1:3119/ws --clients 4 --rooms 1 --mode conference \
            --ramp-up 2 --warmup 10 --duration 8 --deadline-grace 20 \
            --output-dir "${E2E_ARTIFACTS}" --run-label ci-media-smoke \
            --server-revision "${GITHUB_SHA}" --generator-revision "${GITHUB_SHA}"

      # !env.ACT: build/ci-local.sh runs jobs with act, whose artifact server does
      # not speak the upload-artifact v7 protocol; diagnostics stay in the job's log.
      - name: Preserve media smoke diagnostics
        if: ${{ !cancelled() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-smoke
          path: ${{ runner.temp }}/media-smoke
          if-no-files-found: ignore
          retention-days: 7

  native-dtls:
    name: Native worker DTLS closure and media diagnostics
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The check compiles the vendored worker and its test binary from scratch,
      # about nine minutes, and reads nothing but the vendored sources, the
      # pinned OpenSSL installer, the pinned Python build tools and the script.
      # A passing run records that exact input set; later pushes that leave it
      # unchanged skip the rebuild, and any change to it verifies again.
      - name: Look up a passing verification of these native inputs
        id: verified
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/native-dtls-verified
          key: native-dtls-${{ runner.os }}-${{ hashFiles('vendor/**', 'build/check-native-dtls.sh', 'build/install-openssl.sh', 'build/pip-constraints.txt') }}
          lookup-only: true

      - name: Install native build dependencies
        if: steps.verified.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3-pip cmake curl perl pkg-config
          echo "OPENSSL_DIR=${RUNNER_TEMP}/simplestchat-openssl-3.5.8" >> "${GITHUB_ENV}"

      - name: Restore checksum-pinned OpenSSL
        if: steps.verified.outputs.cache-hit != 'true'
        id: openssl
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/simplestchat-openssl-3.5.8
          key: openssl-${{ runner.os }}-${{ hashFiles('build/install-openssl.sh') }}

      - name: Build checksum-pinned OpenSSL
        if: steps.verified.outputs.cache-hit != 'true' && steps.openssl.outputs.cache-hit != 'true'
        run: build/install-openssl.sh "${OPENSSL_DIR}"

      - name: Verify native DTLS closure and media diagnostic context
        if: steps.verified.outputs.cache-hit != 'true'
        timeout-minutes: 12
        run: build/check-native-dtls.sh

      - name: Preserve native media failure diagnostics
        if: ${{ failure() && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-dtls-failure
          path: ${{ runner.temp }}/simplestchat-native-dtls.*/*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Record the passing verification
        if: steps.verified.outputs.cache-hit != 'true'
        run: printf '%s\n' "${GITHUB_SHA}" > "${RUNNER_TEMP}/native-dtls-verified"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.verified.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/native-dtls-verified
          key: ${{ steps.verified.outputs.cache-primary-key }}

  browser:
    name: Browser integration (${{ matrix.group }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # One job definition, three runners: every group repeats the same
      # two-minute build and browser setup, then runs under two minutes of
      # suites instead of five and a half minutes in one sequence.
      #   accounts: sign-in, passkeys, room controls, chat retry, accessibility
      #   media: community and real-media regressions, continuity, call outcomes
      #   stress: homepage layout, restart recovery, the UI stress harness
      matrix:
        group: [accounts, media, stress]
    services:
      postgres:
        # Official image, pinned to the verified PostgreSQL 18.6 manifest.
        image: docker.io/library/postgres:18.6-bookworm@sha256:1c59e2c3c818eaa0f0628f695b36e7c9e362d6b219b36a54a32df645cbd7e1af
        env:
          POSTGRES_USER: test_owner
          POSTGRES_PASSWORD: disposable-ci-password
          POSTGRES_DB: simplestchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_owner -d simplestchat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # mediasoup-sys invokes pip from its Cargo build script.
      PIP_CONSTRAINT: ${{ github.workspace }}/build/pip-constraints.txt
      OPENSSL_STATIC: "1"
      DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      TEST_DATABASE_URL: postgres://test_owner:disposable-ci-password@127.0.0.1:5432/simplestchat_test?sslmode=disable
      DISPOSABLE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/native-toolchain
        with:
          cache-key: rust-build

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            web/e2e/package-lock.json

      # One feature set for every Rust target in CI. Distinct feature sets
      # (default for the server, load-test for the generator, all for the
      # tests) each rebuilt the native worker, three minutes apiece. The
      # load-test feature only adds the generator's dependencies and binary;
      # the server code is identical.
      - name: Build server and load generator
        run: cargo build --locked --all-features --bins

      - name: Migrate disposable test database with the real server
        run: build/with-test-server.sh true

      - name: Build UI and install pinned browser tooling
        run: |
          npm --prefix web ci --ignore-scripts
          npm --prefix web run build
          npm --prefix web/e2e ci --ignore-scripts
          npm --prefix web/e2e exec -- playwright install --with-deps chromium firefox
          npm --prefix web/e2e audit --audit-level=moderate

      - name: Authentication dialog and diagnostic privacy in Chromium and Firefox
        if: matrix.group == 'accounts'
        timeout-minutes: 4
        env:
          AUTH_LIFECYCLE_E2E: "1"
        run: |
          for browser in chromium firefox; do
            E2E_BROWSER="$browser" E2E_ARTIFACTS="${RUNNER_TEMP}/auth-lifecycle-${browser}" \
              build/with-test-server.sh node web/e2e/auth-lifecycle.cjs
          done

      - name: Preserve authentication lifecycle diagnostics
        if: ${{ !cancelled() && matrix.group == 'accounts' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: auth-lifecycle
          path: ${{ runner.temp }}/auth-lifecycle-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Shared account state and room navigation in Chromium and Firefox
        if: matrix.group == 'accounts'
        timeout-minutes: 4
        env:
          AUTH_CROSS_TAB_E2E: "1"
        run: |
          for browser in chromium firefox; do
            E2E_BROWSER="$browser" E2E_ARTIFACTS="${RUNNER_TEMP}/account-tabs-${browser}" \
              build/with-test-server.sh node web/e2e/auth-cross-tab.cjs
          done

      - name: Confirm room controls and retain failed edits
        if: matrix.group == 'accounts'
        timeout-minutes: 4
        env:
          ROOM_CONTROL_E2E: "1"
        run: |
          for browser in chromium firefox; do
            E2E_BROWSER="$browser" E2E_ARTIFACTS="${RUNNER_TEMP}/room-controls-${browser}" \
              build/with-test-server.sh node web/e2e/room-control-confirmation.cjs
          done

      - name: Real passkey registration and discoverable authentication
        if: matrix.group == 'accounts'
        timeout-minutes: 4
        env:
          PASSKEY_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/passkey
        run: build/with-test-server.sh node web/e2e/passkey.cjs

      - name: Preserve passkey verification diagnostics
        if: ${{ !cancelled() && matrix.group == 'accounts' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passkey
          path: ${{ runner.temp }}/passkey
          if-no-files-found: ignore
          retention-days: 7

      - name: Passkey management and recovery with native credentials
        if: matrix.group == 'accounts'
        timeout-minutes: 4
        env:
          PASSKEY_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/passkey-management
        run: build/with-test-server.sh node web/e2e/passkey-management.cjs

      - name: Preserve passkey management diagnostics
        if: ${{ !cancelled() && matrix.group == 'accounts' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: passkey-management
          path: ${{ runner.temp }}/passkey-management
          if-no-files-found: ignore
          retention-days: 7

      - name: Homepage containment and responsive layout
        if: matrix.group == 'stress'
        timeout-minutes: 3
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/homepage-layout
        run: npm --prefix web/e2e run test:layout

      - name: Automatic room recovery after an owned server restart
        if: matrix.group == 'stress'
        timeout-minutes: 3
        run: |
          node build/restart-browser-smoke.mjs --binary "$PWD/target/debug/simplestChat" \
            --browser chromium --output "${RUNNER_TEMP}/restart-browser"

      - name: Preserve browser restart diagnostics
        if: ${{ !cancelled() && matrix.group == 'stress' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restart-browser
          path: ${{ runner.temp }}/restart-browser
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve homepage layout diagnostics
        if: ${{ !cancelled() && matrix.group == 'stress' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: homepage-layout
          path: ${{ runner.temp }}/homepage-layout
          if-no-files-found: ignore
          retention-days: 7

      - name: Community and real-media browser regressions
        if: matrix.group == 'media'
        timeout-minutes: 8
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/community-e2e
        run: build/with-test-server.sh npm --prefix web/e2e test

      - name: Media continuity and device controls in Chromium and Firefox
        if: matrix.group == 'media'
        timeout-minutes: 4
        env:
          MEDIA_CONTINUITY_E2E: "1"
        run: |
          # Firefox native ICE needs an owned non-loopback candidate, even
          # when the HTTP origin and disposable database remain on loopback.
          test_media_ip="$(node build/test-media-ip.mjs)"
          for browser in chromium firefox; do
            TEST_ANNOUNCE_IP="$test_media_ip" E2E_BROWSER="$browser" E2E_ARTIFACTS="${RUNNER_TEMP}/media-continuity-${browser}" \
              build/with-test-server.sh node web/e2e/media-continuity.cjs
          done

      - name: Reconcile interrupted chat sends without duplicate delivery
        if: matrix.group == 'accounts'
        timeout-minutes: 4
        env:
          CHAT_RETRY_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/chat-retry
        run: build/with-test-server.sh node web/e2e/chat-retry.cjs

      - name: Preserve product continuity diagnostics
        if: ${{ !cancelled() && matrix.group == 'accounts' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: product-continuity
          path: |
            ${{ runner.temp }}/account-tabs-*
            ${{ runner.temp }}/room-controls-*
            ${{ runner.temp }}/chat-retry
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve media continuity diagnostics
        if: ${{ !cancelled() && matrix.group == 'media' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: media-continuity
          path: ${{ runner.temp }}/media-continuity-*
          if-no-files-found: ignore
          retention-days: 7

      - name: Received call outcomes with real browser media
        if: matrix.group == 'media'
        timeout-minutes: 4
        env:
          CALL_OUTCOME_E2E: "1"
          IMPAIR_SCRIPT: none
          IMPAIRED_PROFILES: baseline
          E2E_ARTIFACTS: ${{ runner.temp }}/call-outcomes
        run: build/with-test-server.sh node web/e2e/impaired-network.cjs

      - name: Preserve call outcome diagnostics
        if: ${{ !cancelled() && matrix.group == 'media' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: call-outcomes
          path: ${{ runner.temp }}/call-outcomes
          if-no-files-found: ignore
          retention-days: 7

      - name: Chat delivery and UI stress harness smoke
        if: matrix.group == 'stress'
        timeout-minutes: 4
        env:
          UI_STRESS_E2E: "1"
          UI_STRESS_PROFILE: smoke
          E2E_ARTIFACTS: ${{ runner.temp }}/ui-stress
          SERVER_REVISION: ${{ github.sha }}
          FRONTEND_REVISION: ${{ github.sha }}
        run: build/with-test-server.sh npm --prefix web/e2e run test:stress

      - name: Preserve UI stress diagnostics
        if: ${{ !cancelled() && matrix.group == 'stress' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui-stress
          path: ${{ runner.temp }}/ui-stress
          if-no-files-found: ignore
          retention-days: 7

      - name: Accessibility rules and keyboard smoke
        if: matrix.group == 'accounts'
        timeout-minutes: 5
        env:
          ACCESSIBILITY_E2E: "1"
          E2E_ARTIFACTS: ${{ runner.temp }}/accessibility-e2e
        run: build/with-test-server.sh node web/e2e/accessibility.cjs

      - name: Preserve accessibility diagnostics
        if: ${{ !cancelled() && matrix.group == 'accounts' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: accessibility-e2e
          path: ${{ runner.temp }}/accessibility-e2e
          if-no-files-found: ignore
          retention-days: 7

      - name: Preserve browser diagnostics
        if: ${{ !cancelled() && matrix.group == 'media' && !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: community-e2e
          path: ${{ runner.temp }}/community-e2e
          if-no-files-found: ignore
          retention-days: 7

  web:
    name: Web lint + format + tests + typecheck + build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Node is build/test-only; deployment runs Rust, not Node.
          node-version: 26.8.1
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --ignore-scripts
      - run: ../build/check.sh --web
      - name: Audit web dependencies
        # Build-time packages execute against trusted source and are part of the
        # supply chain, so audit the complete lockfile rather than omitting dev.
        run: npm audit --audit-level=moderate

  deployment:
    name: Production image + deployment config
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      PRODUCTION_IMAGE: simplestchat-ci:production
      # Official Caddy image, pinned to the 2.11.4-alpine multi-architecture
      # manifest digest published by Docker Official Images.
      CADDY_IMAGE: docker.io/library/caddy:2.11.4-alpine@sha256:5f5c8640aae01df9654968d946d8f1a56c497f1dd5c5cda4cf95ab7c14d58648
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release fixture's controller needs about twenty seconds of apt and
      # pip work that shares nothing with the image build. Start it here and
      # collect it after the build instead of paying for it on the critical path.
      # Its output goes to files: an inherited step pipe would make the runner
      # wait for the background job before ending this step.
      - name: Start the isolated release-container controller build
        run: |
          {
            # Drop the inherited -e here so a failure still writes its status;
            # an || list would instead disable -e inside the subshell.
            set +e
            (
              set -euo pipefail
              sudo apt-get update
              sudo apt-get install -y python3-venv openssl curl ca-certificates util-linux
              python3 -m venv "${RUNNER_TEMP}/release-container-controller"
              "${RUNNER_TEMP}/release-container-controller/bin/pip" install -r ops/ansible/requirements.txt
            ) > "${RUNNER_TEMP}/release-container-controller.log" 2>&1
            echo "$?" > "${RUNNER_TEMP}/release-container-controller.status"
          } < /dev/null > /dev/null 2>&1 &

      - name: Install checksum-pinned production Compose
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          # Match the provisioned host: older config --hash omits env_file values.
          # Digest verified against the official v5.5.1 release asset and checksum.
          compose_download="$(mktemp -d "${RUNNER_TEMP}/simplestchat-compose.XXXXXXXX")"
          curl --disable --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --connect-timeout 10 --max-time 60 \
            https://github.com/docker/compose/releases/download/v5.5.1/docker-compose-linux-x86_64 \
            --output "${compose_download}/docker-compose"
          printf '%s  %s\n' \
            db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576 \
            "${compose_download}/docker-compose" | sha256sum --check --strict
          sudo install -d -m 0755 /usr/local/lib/docker/cli-plugins
          sudo install -m 0755 "${compose_download}/docker-compose" /usr/local/lib/docker/cli-plugins/docker-compose
          test "$(timeout --signal=TERM --kill-after=2s 10s docker compose version --short)" = 5.5.1
          test "$(sudo env -i PATH=/usr/sbin:/usr/bin:/sbin:/bin LC_ALL=C \
            timeout --signal=TERM --kill-after=2s 10s /usr/bin/docker --host unix:///var/run/docker.sock \
            compose version --short)" = 5.5.1

      - name: Validate Compose rendering
        env:
          # Reserved example values only; no deployment secret enters CI.
          ALLOWED_ORIGINS: https://chat.example.test
          TRUSTED_PROXY_SECRET: ci-only-proxy-secret-00000000000000000000000000000000
        run: docker compose --file docker-compose.yml config --quiet

      - name: Validate Caddyfile
        env:
          TRUSTED_PROXY_SECRET: ci-only-proxy-secret-00000000000000000000000000000000
        run: |
          # The official image marks /usr/bin/caddy with NET_BIND_SERVICE.
          # Retain only that capability so Linux can execute the binary while
          # the validation container remains otherwise isolated.
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --cap-add NET_BIND_SERVICE \
            --security-opt no-new-privileges \
            --tmpfs /config:rw,nosuid,nodev,noexec,size=16m \
            --tmpfs /data:rw,nosuid,nodev,noexec,size=16m \
            --env TRUSTED_PROXY_SECRET \
            --mount type=bind,src="${PWD}/Caddyfile",dst=/etc/caddy/Caddyfile,readonly \
            --entrypoint /usr/bin/caddy \
            "${CADDY_IMAGE}" \
            validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # Builder layers (OpenSSL, toolchain, warmed dependencies including the
      # native worker) are reused from this directory until their inputs
      # change, so a source-only push compiles only this crate.
      - name: Restore image layer cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/buildx-cache
          key: buildx-${{ runner.os }}-${{ hashFiles('Dockerfile', 'Cargo.toml', 'Cargo.lock', 'build/install-openssl.sh', 'build/pip-constraints.txt', 'vendor/**') }}
          restore-keys: buildx-${{ runner.os }}-

      - name: Build production container
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          # The default driver cannot export a layer cache; a container builder
          # can, and --load hands the finished image to the runner's daemon.
          docker buildx rm --force simplestchat-ci 2>/dev/null || true
          docker buildx create --name simplestchat-ci --driver docker-container --use
          cache_dir="${RUNNER_TEMP}/buildx-cache"
          cache_from=()
          if [[ -f "${cache_dir}/index.json" ]]; then
            cache_from=(--cache-from "type=local,src=${cache_dir}")
          fi
          timeout --signal=TERM --kill-after=2m 50m \
            docker buildx build --pull --load --target production --platform linux/amd64 \
              --provenance=false --sbom=false \
              "${cache_from[@]}" \
              --cache-to "type=local,dest=${cache_dir}-next,mode=max" \
              --build-arg "SOURCE_REVISION=${GITHUB_SHA}" \
              --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --iidfile "${RUNNER_TEMP}/production.iid" \
              --tag "${PRODUCTION_IMAGE}" .
          # Replace rather than append: an appended local cache grows without bound.
          rm -rf "${cache_dir}"
          mv "${cache_dir}-next" "${cache_dir}"
          # The release fixture requires an empty engine; the builder's
          # BuildKit container must not outlive the build.
          docker buildx rm --force simplestchat-ci
          production_id="$(<"${RUNNER_TEMP}/production.iid")"
          [[ "${production_id}" =~ ^sha256:[a-f0-9]{64}$ ]]
          # Every following smoke, export and fixture uses this exact image,
          # not the mutable build tag. The exporter never rebuilds it.
          printf 'PRODUCTION_IMAGE=%s\n' "${production_id}" >> "${GITHUB_ENV}"

      - name: Verify production image contents and user
        shell: bash
        run: |
          set -euo pipefail

          configured_user="$(
            docker image inspect --format '{{.Config.User}}' "${PRODUCTION_IMAGE}"
          )"
          test "${configured_user}" = "10001:10001"

          shopt -s nullglob
          migration_names=()
          for migration in migrations/*.sql; do
            migration_names+=("${migration##*/}")
          done
          test "${#migration_names[@]}" -gt 0

          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --entrypoint /bin/sh \
            "${PRODUCTION_IMAGE}" -eu -c '
              test "$(id -u)" = 10001
              test "$(id -g)" = 10001
              test "$(stat -c %u /app/simplestChat)" = 0
              test "$(stat -c %u /app/web/dist/index.html)" = 0
              test "$(stat -c %u /app/migrations)" = 0
              test -x /app/simplestChat
              test -s /app/web/dist/index.html
              test ! -e /app/load_test

              actual_migrations="$(
                find /app/migrations -maxdepth 1 -type f -name "*.sql" | wc -l
              )"
              test "${actual_migrations}" -eq "$#"
              for migration do
                test -s "/app/migrations/${migration}"
              done
            ' verify-image "${migration_names[@]}"

      - name: Production startup, migration and database-backed API smoke
        timeout-minutes: 5
        env:
          CONTAINER_TEST_ARTIFACTS: ${{ runner.temp }}/container-smoke
        run: build/test-container.sh

      - name: Export the tested immutable production image
        if: ${{ success() && github.event_name == 'push' }}
        timeout-minutes: 6
        run: |
          python3 build/build-release.py --image-id "${PRODUCTION_IMAGE}" \
            --timeout-seconds 300 --output "${RUNNER_TEMP}/simplestchat-release"

      - name: Install isolated release-container checks
        timeout-minutes: 5
        run: |
          until [[ -f "${RUNNER_TEMP}/release-container-controller.status" ]]; do sleep 1; done
          cat "${RUNNER_TEMP}/release-container-controller.log"
          test "$(<"${RUNNER_TEMP}/release-container-controller.status")" = 0
          test -x "${RUNNER_TEMP}/release-container-controller/bin/python"

      - name: App-only release and rollback on a disposable host
        timeout-minutes: 10
        run: |
          sudo "${RUNNER_TEMP}/release-container-controller/bin/python" -B \
            build/test-release-container.py --disposable-host \
            --image "${PRODUCTION_IMAGE}" --output "${RUNNER_TEMP}/release-container"

      - name: Retain the verified production release
        # Export precedes the root-owned fixture; publication requires every
        # deployment check above to pass. Fetching also requires whole-CI success.
        if: ${{ success() && github.event_name == 'push' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: simplestchat-production-${{ github.sha }}
          path: ${{ runner.temp }}/simplestchat-release
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Preserve sanitized release-container report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-container
          # Private fixture data and helper logs may contain credentials or DB data.
          path: ${{ runner.temp }}/release-container/report.json
          if-no-files-found: warn
          retention-days: 7

      - name: Preserve container diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-smoke
          path: ${{ runner.temp }}/container-smoke
          if-no-files-found: ignore
          retention-days: 7
