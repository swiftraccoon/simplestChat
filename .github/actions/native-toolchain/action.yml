name: Native Rust toolchain
description: >-
  Pinned Rust toolchain, restored Cargo cache, cached checksum-pinned static
  OpenSSL, and stable mtimes for the vendored native crates.

inputs:
  cache-key:
    description: >-
      Name of the artifact set this job produces. Jobs that build the same
      targets share one cache under this key; jobs that build different
      targets must use different keys so a save never evicts another job's
      artifacts.
    required: true

runs:
  using: composite
  steps:
    # mediasoup-sys builds the C++ worker: needs python3 + pip (meson/ninja
    # are fetched by its build script) and a full C++ toolchain.
    # The ubuntu-24.04 image already provides every tool below, and the
    # unconditional apt-get update alone cost twelve seconds in each job.
    # Install a package only when one of its tools is missing from PATH.
    - name: Install system dependencies
      shell: bash
      run: |
        missing=()
        while read -r package tools; do
          for tool in ${tools}; do
            if ! command -v "${tool}" >/dev/null; then
              missing+=("${package}")
              break
            fi
          done
        done <<'TOOLS'
        build-essential gcc g++ make
        python3-pip pip3
        cmake cmake
        curl curl
        perl perl
        pkg-config pkg-config
        shellcheck shellcheck
        jq jq
        iproute2 ip
        TOOLS
        if ((${#missing[@]})); then
          sudo apt-get update
          sudo apt-get install -y "${missing[@]}"
        else
          echo 'Every native build tool is already installed.'
        fi

    - name: Install pinned Rust toolchain
      uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (2026-09-09)
      with:
        toolchain: 1.98.1
        # mediasoup-sys formats generated bindings during its build script.
        components: rustfmt, clippy

    # Cargo fingerprints path dependencies by source mtime, and checkout gives
    # every file a fresh mtime, so restored artifacts for the vendored
    # mediasoup crates were rebuilt on every run: about three minutes of C++
    # per compile step. The worker's build script also watches the pinned pip
    # constraints file. Pin those inputs to one fixed mtime; the cache keys
    # below carry their content hashes, so a real change still rebuilds.
    - name: Give vendored sources a stable mtime
      shell: bash
      run: find vendor build/pip-constraints.txt -exec touch -h -t 200001010000 {} +

    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        # Bump the prefix whenever the retention policy changes: an existing
        # key is reused as is and never re-saved.
        prefix-key: v1-rust
        shared-key: ${{ inputs.cache-key }}
        key: vendor-${{ hashFiles('vendor/**') }}

    # rust-cache saves registry crates and, optionally, workspace members. The
    # vendored crates are neither (their manifests sit under the repository
    # root without being members), so it prunes their artifacts on every save,
    # including the compiled worker under mediasoup-sys's OUT_DIR, and every
    # job rebuilt it. Cache those artifacts separately: this step runs after
    # rust-cache, so it restores after it and saves before it cleans.
    - name: Restore vendored native artifacts
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          target/debug/build/mediasoup-*
          target/debug/deps/*mediasoup*
          target/debug/.fingerprint/mediasoup-*
          target/release/build/mediasoup-*
          target/release/deps/*mediasoup*
          target/release/.fingerprint/mediasoup-*
        key: vendored-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('vendor/**', 'Cargo.lock', 'rust-toolchain.toml', 'build/pip-constraints.txt', 'build/install-openssl.sh') }}

    - name: Configure native dependency paths
      shell: bash
      run: |
        echo "OPENSSL_DIR=${RUNNER_TEMP}/simplestchat-openssl-3.5.8" >> "${GITHUB_ENV}"
        echo "PKG_CONFIG_PATH=${RUNNER_TEMP}/simplestchat-openssl-3.5.8/lib/pkgconfig" >> "${GITHUB_ENV}"

    # The installer verifies the archive checksum before building; the prefix
    # is a pure function of the script, so cache it by the script's hash.
    - name: Restore checksum-pinned OpenSSL
      id: openssl
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/simplestchat-openssl-3.5.8
        key: openssl-${{ runner.os }}-${{ hashFiles('build/install-openssl.sh') }}

    - name: Build checksum-pinned OpenSSL
      if: steps.openssl.outputs.cache-hit != 'true'
      shell: bash
      run: build/install-openssl.sh "${OPENSSL_DIR}"
