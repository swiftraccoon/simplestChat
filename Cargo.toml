[package]
name = "simplestChat"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[features]
default = []
# Keep the synthetic WebRTC client and its dependency graph out of production
# server builds. Enable this only when building/running the load-test binary.
load-test = ["dep:webrtc", "dep:rtc", "dep:async-trait"]

[dependencies]
mediasoup = "0.27.0"
tokio = { version = "1.53.1", features = ["full"] }
axum = { version = "0.8.9", features = ["ws"] }
tokio-tungstenite = "0.30.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0.20"
num_cpus = "1.17.0"
uuid = { version = "1.26.0", features = ["v4"] }
futures-util = "0.3.34"
webrtc = { version = "0.20.5", optional = true }
rtc = { version = "0.20.5", optional = true }
async-trait = { version = "0.1.92", optional = true }
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
rand = "0.10.2"
mediasoup-types = "0.4.0"
tower-http = { version = "0.7.1", features = ["fs", "timeout"] }
hmac = "0.13.0"
sha1 = "0.11.0"
base64 = "0.23.1"
sqlx = { version = "0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-native-tls", "uuid", "chrono", "json", "derive", "migrate"] }
argon2 = "0.6.0"
jsonwebtoken = { version = "11.0.0", default-features = false, features = ["aws_lc_rs"] }
webauthn-rs = "0.5.5"
url = "2.5.8"
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
tokio-test = "0.4.5"

# Temporary, source-auditable forks of the exact crates.io releases.  The
# mediasoup fork only raises `lru`; the sys fork replaces its vulnerable
# bundled OpenSSL with a version-checked external static library.  See
# vendor/README.md for provenance and the removal criteria.
[patch.crates-io]
mediasoup = { path = "vendor/mediasoup-0.27.0" }
mediasoup-sys = { path = "vendor/mediasoup-sys-0.17.0" }

# Build proc-macros / build scripts unoptimized even in release. Without this,
# the release profile's optimize+strip on macOS produces a malformed Mach-O for
# the sqlx-macros dylib ("mis-aligned LINKEDIT string pool") that dlopen rejects.
# No effect on the app's own release codegen; harmless on Linux (nuck11).
[profile.release.build-override]
opt-level = 0
strip = false

[[bin]]
name = "load_test"
path = "load_tests/bin/load_test.rs"
required-features = ["load-test"]
