[package]
name = "simplestChat"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"

[features]
default = []
# Keep the synthetic WebRTC client and its dependency graph out of production
# server builds. Enable this only when building/running the load-test binary.
load-test = ["dep:webrtc"]

[dependencies]
mediasoup = "0.27.0"
tokio = { version = "1.48", features = ["full"] }
axum = { version = "0.8.6", features = ["ws"] }
tokio-tungstenite = "0.28.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
anyhow = "1.0.100"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
thiserror = "2.0.17"
num_cpus = "1.17.0"
uuid = { version = "1.18.1", features = ["v4"] }
futures-util = "0.3.31"
webrtc = { version = "0.17.1", optional = true }
bytes = "1.10.1"
chrono = { version = "0.4.42", features = ["serde"] }
rand = "0.9.2"
mediasoup-types = "0.4.0"
tower-http = { version = "0.6", features = ["fs", "timeout"] }
hmac = "0.12"
sha1 = "0.10"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio", "tls-native-tls", "uuid", "chrono", "derive", "migrate"] }
argon2 = "0.5"
jsonwebtoken = { version = "10.3", default-features = false, features = ["aws_lc_rs"] }
webauthn-rs = "0.5"
url = "2"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tokio-test = "0.4"

# Temporary, source-auditable forks of the exact crates.io releases.  The
# mediasoup fork only raises `lru`; the sys fork replaces its vulnerable
# bundled OpenSSL with a version-checked external static library.  See
# vendor/README.md for provenance and the removal criteria.
[patch.crates-io]
mediasoup = { path = "vendor/mediasoup-0.27.0" }
mediasoup-sys = { path = "vendor/mediasoup-sys-0.17.0" }

# Build proc-macros / build scripts unoptimized even in release. Without this,
# the release profile's optimize+strip on macOS produces a malformed Mach-O for
# the sqlx-macros dylib ("mis-aligned LINKEDIT string pool") that dlopen rejects.
# No effect on the app's own release codegen; harmless on Linux (nuck11).
[profile.release.build-override]
opt-level = 0
strip = false

[[bin]]
name = "load_test"
path = "load_tests/bin/load_test.rs"
required-features = ["load-test"]
