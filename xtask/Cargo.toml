[package]
name = "xtask"
description = "Repository automation run with `cargo run -p xtask -- <command>`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
futures-util = "0.3.34"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
nix = { version = "0.31.3", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls"] }
rawzip = "=0.5.2"
regex = "1.13.1"
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
ryu-js = "=1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
sha2 = "0.11.0"
simplestchat-ops = { path = "../ops" }
syn = { version = "=3.0.6", features = ["full"] }
tar = { version = "=0.4.46", default-features = false }
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
tokio = { version = "1.53.2", features = ["full"] }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5.8"
