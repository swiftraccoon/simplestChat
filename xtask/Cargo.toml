[package]
name = "xtask"
description = "Repository automation run with `cargo run -p xtask -- <command>`"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
ryu-js = "=1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["raw_value"] }
simplestchat-toolkit = { path = "../crates/toolkit" }
syn = { version = "=3.0.9", features = ["full"] }
url = "2.5.8"

[dev-dependencies]
regex = "1.13.1"
