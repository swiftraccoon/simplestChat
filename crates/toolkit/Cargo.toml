[package]
name = "simplestchat-toolkit"
description = "Shared child-command, native build environment and owned process helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Lets a dependent's tests inject signal receivers. Dependents enable it only
# from `[dev-dependencies]`, so their normal and release builds leave it off;
# `--all-features` builds compile `Signals::injected`, which only tests call.
test-hooks = []

[dependencies]
rustix = { version = "1.1.5", default-features = false, features = ["process"] }
simplestchat-ops = { path = "../../ops", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = ["macros", "rt", "sync", "time"] }
