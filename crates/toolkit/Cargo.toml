[package]
name = "simplestchat-toolkit"
description = "Shared child-command, native build environment, owned process, retained executable and output replay helpers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[features]
# Lets a dependent's tests inject signal receivers. Dependents enable it only
# from `[dev-dependencies]`, so their normal and release builds leave it off;
# `--all-features` builds compile `Signals::injected`, which only tests call.
test-hooks = []

[dependencies]
nix = { version = "0.31.3", default-features = false }
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std"] }
simplestchat-ops = { path = "../../ops", default-features = false }
tokio = { version = "1.53.3", default-features = false, features = [
    "io-util", "macros", "process", "rt", "sync", "time",
] }
