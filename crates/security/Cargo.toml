[package]
name = "simplestchat-security"
description = "The security gate: checksum-pinned scanner installation and verified reuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "simplestchat-security"
path = "src/main.rs"

# The image's builder stage compiles this crate before the application, so
# every dependency here is built there too and needs a reason: the four
# locked archive formats, JSON and TOML documents, and workflow YAML, which is
# read with the reader the CI and release crates already read it with.
[features]
default = ["image"]
# The checks of a saved image, which authenticate it with the release
# verifier of the ops crate and let SIGINT and SIGTERM cancel the scanners
# instead of ending the gate. The image build compiles this crate without
# them, before the ops sources are there, for the three commands it runs
# inside the builder.
image = ["dep:signal-hook", "dep:simplestchat-ops"]

[dependencies]
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
lzma-rs = "=0.3.0"
rawzip = "=0.5.2"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std", "system"] }
serde = "1.0.229"
serde-saphyr = { version = "=2.0.0", default-features = false, features = ["deserialize"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = { version = "=0.4.5", default-features = false, optional = true }
simplestchat-ops = { path = "../../ops", default-features = false, optional = true }
tar = { version = "=0.4.46", default-features = false }
toml = { version = "=1.1.8", default-features = false, features = ["parse", "serde", "std"] }
