[package]
name = "simplestchat-security"
description = "The security gate: checksum-pinned scanner installation and verified reuse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "simplestchat-security"
path = "src/main.rs"

# The image's builder stage compiles this crate before the application: keep
# its dependencies to what reading the four locked archive formats needs.
[dependencies]
flate2 = { version = "=1.1.11", default-features = false, features = ["rust_backend"] }
lzma-rs = "=0.3.0"
rawzip = "=0.5.2"
rustix = { version = "1.1.5", default-features = false, features = ["fs", "process", "std", "system"] }
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "=0.4.46", default-features = false }
toml = { version = "=1.2.1", default-features = false, features = ["parse", "serde", "std"] }
